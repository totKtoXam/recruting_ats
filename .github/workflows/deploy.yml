name: Deploy Apps Script

# API bootstrap trigger verified

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: recruiting-ats-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Restore clasp credentials
        shell: bash
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          CLASP_JSON: ${{ secrets.CLASP_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || (echo "CLASPRC_JSON secret is missing" && exit 1)
          test -n "$CLASP_JSON" || (echo "CLASP_JSON secret is missing" && exit 1)

          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          printf '%s' "$CLASP_JSON" > ".clasp.json"
          chmod 600 "$HOME/.clasprc.json" ".clasp.json"

      - name: Validate clasp project
        run: npx clasp show-file-status

      - name: Push Apps Script sources
        run: npx clasp push --force

      - name: Update Web App deployment
        env:
          GAS_DEPLOYMENT_ID: ${{ secrets.GAS_DEPLOYMENT_ID }}
        run: |
          test -n "$GAS_DEPLOYMENT_ID" || (echo "GAS_DEPLOYMENT_ID secret is missing" && exit 1)

          npx clasp create-deployment \
            --deploymentId "$GAS_DEPLOYMENT_ID" \
            --description "GitHub Actions: $GITHUB_SHA"

      - name: Publish Web App URL
        env:
          GAS_WEB_APP_URL: ${{ vars.GAS_WEB_APP_URL }}
        run: |
          if [ -n "$GAS_WEB_APP_URL" ]; then
            echo "Web App: $GAS_WEB_APP_URL"
            {
              echo "### Recruiting ATS Web App"
              echo
              echo "$GAS_WEB_APP_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "GAS_WEB_APP_URL repository variable is not configured."
            echo "Set Settings -> Secrets and variables -> Actions -> Variables -> GAS_WEB_APP_URL to show the app URL in deploy logs and job summary."
          fi


      - name: Deploy Resume Intake API
        env:
          API_CLASP_JSON: ${{ secrets.API_CLASP_JSON }}
          API_GAS_DEPLOYMENT_ID: ${{ secrets.API_GAS_DEPLOYMENT_ID }}
          API_WEB_APP_URL: ${{ vars.API_WEB_APP_URL }}
        run: |
          if [ -z "$API_CLASP_JSON" ]; then
            echo "Resume Intake API push skipped: API_CLASP_JSON is not configured."
            exit 0
          fi

          printf '%s' "$API_CLASP_JSON" > ".clasp.json"

          echo "Validating API Apps Script project..."
          npx clasp show-file-status

          echo "Pushing API Apps Script sources..."
          npx clasp push --force

          if [ -z "$API_GAS_DEPLOYMENT_ID" ]; then
            echo "API sources pushed successfully."
            echo "API_GAS_DEPLOYMENT_ID is not configured yet. Create the first Web App deployment manually, then add its Deployment ID as a repository secret."
            exit 0
          fi

          echo "Updating API Web App deployment..."
          npx clasp create-deployment \
            --deploymentId "$API_GAS_DEPLOYMENT_ID" \
            --description "GitHub Actions API: $GITHUB_SHA"

          if [ -n "$API_WEB_APP_URL" ]; then
            echo "API Web App: $API_WEB_APP_URL"
            {
              echo
              echo "### Recruiting ATS Resume Intake API"
              echo
              echo "$API_WEB_APP_URL"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "API_WEB_APP_URL repository variable is not configured."
          fi
