<script>
// ---------- Серверные таблицы ----------
// Фильтрация, сортировка и пагинация выполняются в БД: таблица отправляет
// { page, pageSize, sort, filters } в RPC и рисует полученную страницу.

const PAGE_SIZES=[10,20,50,100];
const serverTables={};

function createServerTable(config){
  const table={
    ...config,
    query:{page:1,pageSize:20,sort:{...config.defaultSort},filters:{}},
    data:null,
    requestId:0,
    mounted:false,
    filterTimer:null
  };
  serverTables[config.id]=table;
  return table;
}

function mountServerTable(table){
  const root=el(table.containerId);
  if(!root||table.mounted)return;

  const header=table.columns.map(column=>{
    const sortable=!!column.sort;
    const sortCall='serverTableSort(\''+table.id+'\',\''+column.sort+'\')';
    return '<th'+(sortable?' class="sortable" tabindex="0" aria-sort="none" onclick="'+sortCall+'" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();'+sortCall+'}"':'')+
      ' data-sort-key="'+escapeHtml(column.sort||'')+'"'+(column.width?' style="width:'+column.width+'"':'')+'>'+
      (column.label?'<span>'+escapeHtml(column.label)+'</span>':'<span class="sr-only">Действия</span>')+
      (sortable?' '+icon('sort','icon-sm sort-icon'):'')+
    '</th>';
  }).join('');

  const filters=table.columns.map(column=>{
    const filter=column.filter;
    if(!filter)return '<th class="no-filter"></th>';
    const label=' data-label="'+escapeHtml(column.label||'')+'"';
    const handler='serverTableFilter(\''+table.id+'\',\''+filter.key+'\',this.value)';
    if(filter.type==='select'){
      return '<th'+label+'><select class="filter-input" aria-label="Фильтр: '+escapeHtml(column.label||'')+'" onchange="'+handler+'">'+
        option('','Все')+filter.options().map(item=>typeof item==='object'?option(item.value,item.label):option(item,item)).join('')+
      '</select></th>';
    }
    const name=column.label||'значению';
    return '<th'+label+'><input class="filter-input" type="'+(filter.type==='number'?'number':'search')+'" '+
      'placeholder="'+(filter.type==='number'?'№':'Поиск')+'" aria-label="Фильтр по '+escapeHtml(name.toLowerCase())+'" oninput="'+handler+'"></th>';
  }).join('');

  root.innerHTML=
    '<div class="table-scroll">'+
      '<table class="data-table">'+
        '<thead><tr>'+header+'</tr><tr class="filter-row">'+filters+'</tr></thead>'+
        '<tbody></tbody>'+
      '</table>'+
    '</div>'+
    '<div class="table-pagination"></div>';

  table.mounted=true;
}

async function loadServerTable(id){
  const table=serverTables[id];
  if(!table)return;
  mountServerTable(table);

  const root=el(table.containerId);
  const requestId=++table.requestId;
  root.classList.add('table-loading');

  try{
    const data=await rpc(table.rpcName,table.query);
    // Ответ на устаревший запрос (фильтр успели изменить) не рисуем.
    if(requestId!==table.requestId)return;
    table.data=data;
    table.query.page=data.page;
    renderServerTableBody(table);
  }catch(error){
    if(requestId===table.requestId){
      showToast(error&&error.message?error.message:String(error),'error');
    }
  }finally{
    if(requestId===table.requestId)root.classList.remove('table-loading');
  }
}

// Только что созданные записи: закреплены сверху первой страницы и подсвечены,
// пока их не откроют (или до перезагрузки страницы).
const freshRecords={vacancies:new Map(),vacancyPresets:new Map(),sources:new Map(),users:new Map(),templates:new Map()};

function markFresh(tableId,item){
  const table=serverTables[tableId];
  if(table&&freshRecords[tableId])freshRecords[tableId].set(String(table.rowId(item)),item);
}

function isFresh(tableId,id){
  const bucket=freshRecords[tableId];
  return !!(bucket&&bucket.has(String(id)));
}

function clearFresh(tableId,id){
  const bucket=freshRecords[tableId];
  if(bucket&&bucket.delete(String(id)))rerenderServerTable(tableId);
}

function tableItemsWithFresh(table){
  const data=table.data;
  const bucket=freshRecords[table.id];
  const stateFilter=table.query.filters.state||'active';
  if(!bucket||!bucket.size||data.page!==1||!['active','all'].includes(stateFilter))return data.items;
  const pinnedIds=new Set(bucket.keys());
  const pinned=[...bucket.values()].map(item=>
    data.items.find(row=>String(table.rowId(row))===String(table.rowId(item)))||item
  ).filter(item=>!item.state||item.state==='active');
  return [...pinned,...data.items.filter(row=>!pinnedIds.has(String(table.rowId(row))))];
}

function renderServerTableBody(table){
  const root=el(table.containerId);
  const data=table.data;
  if(!root||!data)return;
  renderStateSwitches(table.id);

  root.querySelectorAll('th[data-sort-key]').forEach(th=>{
    const key=th.dataset.sortKey;
    if(!key)return;
    const active=table.query.sort.key===key;
    if(active)th.dataset.sort=table.query.sort.dir;
    else delete th.dataset.sort;
    th.setAttribute('aria-sort',active?(table.query.sort.dir==='asc'?'ascending':'descending'):'none');
    const use=th.querySelector('.sort-icon use');
    if(use)use.setAttribute('href','#i-'+(active?(table.query.sort.dir==='asc'?'sort-asc':'sort-desc'):'sort'));
  });

  const items=tableItemsWithFresh(table);
  root.querySelector('tbody').innerHTML=items.length
    ? items.map(item=>{
        const selected=table.isSelected&&table.isSelected(item);
        const fresh=isFresh(table.id,table.rowId(item));
        const stateClass=(item.state&&item.state!=='active'?' row-'+item.state:'')+(fresh?' row-fresh':'')+(table.rowClass?' '+table.rowClass(item):'');
        return '<tr class="clickable-row'+(selected?' selected-row':'')+stateClass+'" tabindex="0"'+(selected?' aria-selected="true"':'')+
          ' onkeydown="if(event.key===\'Enter\'&&event.target===this)this.click()"'+
          ' onclick="serverTableRowClick(\''+table.id+'\',\''+escJs(table.rowId(item))+'\')">'+
          table.columns.map((column,index)=>'<td data-label="'+escapeHtml(column.label||'')+'">'+
            (index===0&&fresh?'<span class="fresh-badge">Новая</span>':'')+column.render(item)+'</td>').join('')+
        '</tr>';
      }).join('')
    : '<tr><td class="table-empty" colspan="'+table.columns.length+'">'+serverTableEmptyHtml(table)+'</td></tr>';

  const from=data.total?(data.page-1)*data.pageSize+1:0;
  const to=Math.min(data.page*data.pageSize,data.total);
  const lastPage=Math.max(Math.ceil(data.total/data.pageSize),1);
  const nav=(name,tip,page,disabled)=>
    '<button class="icon-btn icon-btn-sm" data-tip="'+tip+'" aria-label="'+tip+'"'+(disabled?' disabled':'')+
    ' onclick="serverTableGo(\''+table.id+'\','+page+')">'+icon(name,'icon-sm')+'</button>';

  root.querySelector('.table-pagination').innerHTML=
    '<span class="pagination-info">'+from+'–'+to+' из '+data.total+'</span>'+
    '<select class="page-size" aria-label="Строк на странице" onchange="serverTablePageSize(\''+table.id+'\',this.value)">'+
      PAGE_SIZES.map(size=>option(size,size+' на стр.',size===data.pageSize)).join('')+
    '</select>'+
    nav('chevrons-left','Первая страница',1,data.page<=1)+
    nav('chevron-left','Предыдущая страница',data.page-1,data.page<=1)+
    '<span class="pagination-info">'+data.page+' / '+lastPage+'</span>'+
    nav('chevron-right','Следующая страница',data.page+1,data.page>=lastPage)+
    nav('chevrons-right','Последняя страница',lastPage,data.page>=lastPage);
}

// Пустая таблица объясняет почему: фильтры, архив/корзина или записей ещё нет.
function serverTableEmptyHtml(table){
  const filters={...table.query.filters};
  const stateFilter=filters.state||'active';
  delete filters.state;
  let title=table.emptyText||'Записей пока нет';
  let text='';
  if(Object.keys(filters).length){title='Ничего не найдено';text='Измените или очистите фильтры в шапке таблицы.'}
  else if(stateFilter==='archived')title='В архиве пусто';
  else if(stateFilter==='deleted'){title='Корзина пуста';text='Удалённые записи хранятся здесь 30 дней.'}
  else if(table.emptyHint)text=table.emptyHint;
  return '<div class="table-empty-state">'+icon(Object.keys(filters).length?'search':'inbox')+
    '<strong>'+escapeHtml(title)+'</strong>'+(text?'<span>'+escapeHtml(text)+'</span>':'')+'</div>';
}

function serverTableSort(id,key){
  const table=serverTables[id];
  const sort=table.query.sort;
  table.query.sort={key,dir:sort.key===key&&sort.dir==='asc'?'desc':'asc'};
  table.query.page=1;
  loadServerTable(id);
}

function serverTableFilter(id,key,rawValue){
  const table=serverTables[id];
  const filterValue=String(rawValue||'').trim();
  if(filterValue)table.query.filters[key]=filterValue;
  else delete table.query.filters[key];
  table.query.page=1;
  clearTimeout(table.filterTimer);
  table.filterTimer=setTimeout(()=>loadServerTable(id),300);
}

function serverTableGo(id,page){
  serverTables[id].query.page=page;
  loadServerTable(id);
}

function serverTablePageSize(id,size){
  const table=serverTables[id];
  table.query.pageSize=Number(size)||20;
  table.query.page=1;
  loadServerTable(id);
}

function serverTableRowClick(id,rowId){
  const table=serverTables[id];
  if(isFresh(id,rowId)){freshRecords[id].delete(String(rowId))}
  const item=(table.data&&table.data.items||[]).find(row=>String(table.rowId(row))===String(rowId));
  if(item&&table.onRowClick)table.onRowClick(item);
}

function rerenderServerTable(id){
  const table=serverTables[id];
  if(table&&table.data)renderServerTableBody(table);
}

// ---------- Состояние записей: активные / архив / корзина ----------

const STATE_LABELS={active:'Активные',archived:'Архив',deleted:'Корзина',all:'Все'};
const STATE_ICONS={active:'i-dot',archived:'i-archive',deleted:'i-trash',all:'i-list'};

function stateCountHtml(count){
  return '<span class="seg-count'+(Number(count)?'':' is-zero')+'">'+count+'</span>';
}

// Переключатель состояния с количеством записей в каждом (с учётом фильтров таблицы).
function renderStateSwitches(onlyId){
  document.querySelectorAll('.state-switch[data-table]').forEach(root=>{
    const id=root.dataset.table;
    if(onlyId&&id!==onlyId)return;
    const table=serverTables[id];
    if(!table)return;
    const current=table.query.filters.state||'active';
    const counts=table.data&&table.data.counts||{};
    // Корзину видят только администраторы: удалять и восстанавливать могут только они.
    const states=isAdminUser()?['active','archived','deleted','all']:['active','archived','all'];
    root.setAttribute('role','radiogroup');
    root.setAttribute('aria-label','Показать записи');
    root.innerHTML=states.map(state=>
      '<label class="segmented-option" data-state="'+state+'"><input type="radio" name="state-'+id+'" value="'+state+'"'+(state===current?' checked':'')+
      ' onchange="setTableState(\''+id+'\',this.value)"><span><svg class="icon seg-icon" aria-hidden="true"><use href="#'+STATE_ICONS[state]+'"/></svg>'+STATE_LABELS[state]+
      (counts[state]!==undefined?stateCountHtml(counts[state]):'')+'</span></label>'
    ).join('');
  });
}

function setTableState(id,state){
  const table=serverTables[id];
  table.query.filters.state=state;
  table.query.page=1;
  loadServerTable(id);
}

function stateBadge(item){
  if(item.state==='archived')return '<span class="state-badge state-archived">В архиве</span>';
  if(item.state==='deleted')return '<span class="state-badge state-deleted" data-tip="Удалится окончательно '+escapeHtml(fmtDate(item.purgeAt))+'">Удалится через '+escapeHtml(item.daysUntilPurge)+' дн.</span>';
  return '';
}

// Кнопки жизненного цикла для записи в зависимости от её состояния.
function lifecycleButtons(type,id,state,small){
  const size=small?' icon-btn-sm':'';
  const call=action=>'event.stopPropagation();entityAction(\''+type+'\',\''+escJs(id)+'\',\''+action+'\',this)';
  if(state==='deleted'){
    return isAdminUser()?iconBtn('restore','Восстановить из корзины',call('restore'),size.trim()):'';
  }
  if(state==='archived'){
    return iconBtn('unarchive','Вернуть из архива',call('unarchive'),size.trim())+
      (isAdminUser()?iconBtn('trash','Удалить (корзина, 30 дней)',call('delete'),(size+' icon-btn-danger').trim()):'');
  }
  return iconBtn('archive','В архив',call('archive'),size.trim());
}

function lifecycleNote(item){
  if(!item||item.state==='active')return '';
  if(item.state==='archived'){
    return '<div class="lifecycle-note">'+icon('archive','icon-sm')+'<span>В архиве с '+escapeHtml(fmtDate(item.archivedAt))+'. Удалить можно только архивную запись.</span></div>';
  }
  return '<div class="lifecycle-note deleted">'+icon('trash','icon-sm')+'<span>В корзине. Будет удалено окончательно '+escapeHtml(fmtDate(item.purgeAt))+' (через '+escapeHtml(item.daysUntilPurge)+' дн.). До этого её можно восстановить.</span></div>';
}

const ENTITY_ACTIONS={
  archive:{rpc:'archiveEntity',done:'Отправлено в архив.'},
  unarchive:{rpc:'unarchiveEntity',done:'Возвращено из архива.'},
  delete:{rpc:'deleteEntity',done:'Перемещено в корзину. Восстановить можно в течение 30 дней.'},
  restore:{rpc:'restoreEntity',done:'Восстановлено из корзины (в архив).'}
};

const ENTITY_AFTER={
  vacancy:async id=>{await refreshReferences();await loadServerTable('vacancies');if(String(value('vacancyId'))===String(id))await reopenVacancy(id)},
  source:async id=>{await refreshReferences();await loadServerTable('sources');if(String(value('sourceId'))===String(id))reopenSource(id)},
  user:async id=>{await refreshReferences();ensureAdminUsersLoaded(true).catch(()=>{});await loadServerTable('users');if(String(value('userId'))===String(id))reopenUser(id)},
  template:async id=>{await refreshReferences();await Promise.all([loadServerTable('templates'),loadServerTable('vacancies'),loadServerTable('vacancyPresets')]);if(Drawer.isOpen('templateDrawer')&&String(value('templateId'))===String(id))await reopenTemplate(id)},
  vacancy_preset:async id=>{await refreshReferences();await loadServerTable('vacancyPresets');renderVacancyStageTools();if(Drawer.isOpen('vacancyPresetDrawer')&&String(value('vacancyPresetId'))===String(id))await reopenVacancyPreset(id)}
};

async function entityAction(type,id,action,button){
  if(action==='delete'){
    const ok=await showConfirm('Удалить запись? Она будет в корзине 30 дней — за это время её можно восстановить. Потом она удалится из базы окончательно.','Удаление');
    if(!ok)return;
  }
  await runUiTask({button,label:'…'},async()=>{
    await rpc(ENTITY_ACTIONS[action].rpc,{type,id});
    if(ENTITY_AFTER[type])await ENTITY_AFTER[type](id);
    showToast(ENTITY_ACTIONS[action].done);
  }).catch(()=>{});
}

// Строка таблицы перерисовывается по данным сервера; для формы ищем запись по id.
function tableItem(tableId,idKey,id){
  const table=serverTables[tableId];
  return (table&&table.data&&table.data.items||[]).find(item=>String(item[idKey])===String(id))||null;
}

async function findInTable(tableId,idKey,id){
  let item=tableItem(tableId,idKey,id);
  if(item)return item;
  // Запись могла сменить состояние и уйти на другой «таб» — ищем во всех состояниях.
  const table=serverTables[tableId];
  for(const state of ['active','archived','deleted']){
    const data=await rpc(table.rpcName,{page:1,pageSize:100,filters:{state}}).catch(()=>null);
    item=data&&data.items.find(row=>String(row[idKey])===String(id));
    if(item)return item;
  }
  return null;
}

function historyButton(type,id,title){
  return id?iconBtn('history','История изменений','openHistory(\''+type+'\',\''+escJs(id)+'\',\''+escJs(title||'')+'\')'):'';
}

function formActions(containerId,buttons){
  el(containerId).innerHTML=buttons.filter(Boolean).join('');
}

// ---------- Таблицы ----------

// Статус вакансии в шапке панели: сегменты «Открыта / На паузе / Закрыта», текущий выбран.
// Недоступные переходы (см. vacancyStatusTransitions) и любые переходы для архивной вакансии отключены.
const VACANCY_STATUS_SEGMENTS=[['Открыта','active'],['На паузе','archived'],['Закрыта','deleted']];
const VACANCY_STATUS_ICONS={'Открыта':'check','На паузе':'clock','Закрыта':'x-circle'};

function vacancyStatusSwitch(vacancy){
  if(!vacancy)return '';
  const allowed=(state.vacancyStatusTransitions||{})[vacancy['Статус']]||[];
  const editable=vacancy.state==='active';
  const id=escJs(vacancy['Vacancy ID']);
  return '<div class="segmented vacancy-status-switch" role="radiogroup" aria-label="Статус вакансии" data-drawer-ignore>'+
    VACANCY_STATUS_SEGMENTS.map(([status,tone])=>{
      const current=status===vacancy['Статус'];
      const disabled=!current&&!(editable&&allowed.includes(status));
      return '<label class="segmented-option" data-state="'+tone+'"'+(disabled?' data-tip="Переход недоступен"':'')+'>'+
        '<input type="radio" name="vacancyStatus" value="'+escapeHtml(status)+'"'+(current?' checked':'')+(disabled?' disabled':'')+
        ' onchange="setVacancyStatusUi(\''+id+'\',\''+escJs(status)+'\')"><span>'+icon(VACANCY_STATUS_ICONS[status],'icon-sm')+escapeHtml(status)+'</span></label>';
    }).join('')+'</div>';
}

const vacancyTable=createServerTable({
  id:'vacancies',
  containerId:'vacancyTable',
  rpcName:'listVacancies',
  emptyText:'Вакансий пока нет',
  emptyHint:'Создайте первую кнопкой «Новая вакансия».',
  defaultSort:{key:'number',dir:'desc'},
  rowId:item=>item['Vacancy ID'],
  isSelected:item=>String(item['Vacancy ID'])===String(value('vacancyId')),
  onRowClick:item=>editVacancy(item['Vacancy ID'],item),
  columns:[
    {label:'№',sort:'number',width:'64px',filter:{key:'number',type:'number'},render:item=>escapeHtml(item['№'])},
    {label:'Вакансия',sort:'name',filter:{key:'name',type:'text'},render:item=>escapeHtml(item['Вакансия'])+' '+stateBadge(item)},
    {label:'Статус',sort:'status',width:'120px',filter:{key:'status',type:'select',options:()=>['Открыта','На паузе','Закрыта']},render:item=>vacancyStatusChip(item['Статус'])},
    {label:'Кандидаты',sort:'candidates',width:'90px',render:item=>escapeHtml(item.candidateCount||0)},
    {label:'Публикации',width:'150px',render:item=>vacancyLinksHtml(item.links||[])},
    {label:'Этапы',sort:'templates',render:item=>templateChips(item.templates||[],item.requiredStages||[])},
    {label:'',width:'76px',render:item=>'<div class="row-actions">'+lifecycleButtons('vacancy',item['Vacancy ID'],item.state,true)+'</div>'}
  ]
});

// Шаблоны вакансий, где используется шаблон вопросов (в панели шаблона вопросов).
function presetUsageHtml(usages){
  if(!usages.length)return '';
  return '<div class="preset-usage"><span class="muted">Шаблоны вакансий:</span>'+
    usages.map(u=>'<span class="mini-chip status-'+statusKey(u.stage)+'">№'+escapeHtml(u.number)+' '+escapeHtml(u.name)+' · '+escapeHtml(u.stage)+(u.required?' *':'')+'</span>').join('')+
  '</div>';
}

function templateUsageChips(usages){
  if(!usages.length)return '<span class="muted">Не используется</span>';
  return '<div class="chip-wrap">'+
    usages.slice(0,3).map(u=>
      '<span class="mini-chip status-'+statusKey(u.stage)+'">№'+escapeHtml(u.number)+' '+escapeHtml(u.name)+' · '+escapeHtml(u.stage)+(u.required?' *':'')+'</span>'
    ).join('')+
    (usages.length>3?'<span class="more-chip">+'+(usages.length-3)+'</span>':'')+
  '</div>';
}

const templateTable=createServerTable({
  id:'templates',
  containerId:'templateTable',
  rpcName:'listTemplates',
  emptyText:'Шаблонов пока нет',
  emptyHint:'Создайте первый шаблон кнопкой «Новый шаблон».',
  defaultSort:{key:'number',dir:'desc'},
  rowId:item=>item['Template ID'],
  isSelected:item=>String(item['Template ID'])===String(value('templateId')),
  onRowClick:item=>editTemplate(item['Template ID'],item),
  columns:[
    {label:'№',sort:'number',width:'64px',filter:{key:'number',type:'number'},render:item=>escapeHtml(item['№'])},
    {label:'Шаблон',sort:'name',filter:{key:'name',type:'text'},render:item=>escapeHtml(item['Название'])+' '+stateBadge(item)},
    {label:'Теги',filter:{key:'tag',type:'text'},render:item=>tagChipsHtml(item.tags)||'<span class="muted">—</span>'},
    {label:'Вопросы',sort:'questions',width:'90px',render:item=>escapeHtml((item.questions||[]).length)},
    {label:'Используется в вакансиях',sort:'usage',render:item=>templateUsageChips(item.vacancies||[])},
    {label:'',width:'76px',render:item=>'<div class="row-actions">'+lifecycleButtons('template',item['Template ID'],item.state,true)+'</div>'}
  ]
});

const sourceTable=createServerTable({
  id:'sources',
  containerId:'sourceTable',
  rpcName:'listSources',
  emptyText:'Источников пока нет',
  emptyHint:'Добавьте, откуда приходят кандидаты: LinkedIn, hh, рекомендации…',
  defaultSort:{key:'name',dir:'asc'},
  rowId:item=>item['Source ID'],
  isSelected:item=>String(item['Source ID'])===String(value('sourceId')),
  onRowClick:item=>editSource(item['Source ID'],item),
  columns:[
    {label:'№',sort:'number',width:'64px',filter:{key:'number',type:'number'},render:item=>escapeHtml(item['№'])},
    {label:'Источник',sort:'name',filter:{key:'name',type:'text'},render:item=>'<div class="source-name-cell">'+sourceIconHtml(item)+'<span>'+escapeHtml(item['Название'])+'</span> '+stateBadge(item)+'</div>'},
    {label:'',width:'76px',render:item=>'<div class="row-actions">'+lifecycleButtons('source',item['Source ID'],item.state,true)+'</div>'}
  ]
});

function userAccessSwitch(user){
  const self=state.currentUser&&String(state.currentUser['User ID'])===String(user['User ID']);
  const disabled=self||user.state!=='active';
  const tip=self?'Это вы':user.state!=='active'?'Сначала верните из архива':(user.accessStatus==='active'?'Закрыть доступ':'Открыть доступ');
  return '<label class="switch" data-tip="'+escapeHtml(tip)+'" onclick="event.stopPropagation()">'+
    '<input type="checkbox"'+(user.accessStatus==='active'?' checked':'')+(disabled?' disabled':'')+
    ' aria-label="Доступ в ATS" onchange="setUserAccess(\''+escJs(user['User ID'])+'\',this.checked,this)">'+
    '<span class="switch-track"></span></label>'+
    (user.accessStatus==='pending'&&user['Запрос доступа']?' <span class="state-badge state-archived" data-tip="Пытался войти '+escapeHtml(user['Запрос доступа'])+'">Ждёт</span>':'');
}

// Этапы вакансии в таблице: шаблоны по этапам и обязательные этапы без шаблона (* — обязательный).
function templateChips(templates,requiredStages=[]){
  const chips=(state.pipelineStatuses||[]).flatMap(stage=>{
    const bound=templates.filter(t=>t.stage===stage);
    if(bound.length)return bound.map(t=>
      '<span class="mini-chip status-'+statusKey(t.stage)+'">№'+escapeHtml(t.number)+' '+escapeHtml(t.name)+(t.required?' *':'')+'</span>'
    );
    return requiredStages.includes(stage)
      ?['<span class="mini-chip status-'+statusKey(stage)+'" data-tip="Обязательный этап без шаблона — при переводе спросим только итог">'+escapeHtml(stage)+' · итог *</span>']
      :[];
  });
  if(!chips.length)return '<span class="muted">Нет шаблонов</span>';
  return '<div class="chip-wrap">'+chips.slice(0,4).join('')+
    (chips.length>4?'<span class="more-chip">+'+(chips.length-4)+'</span>':'')+
  '</div>';
}

// Подпись вкладки для заголовка окна; совпадающая с названием страницы не повторяется.
function adminTabLabel(route){
  const group=PAGE_TABS[route.tabs];
  const tab=group&&group.tabs.find(item=>item.key===route.tab);
  return tab&&tab.label!==route.title?tab.label:'';
}

function renderPageTabs(route){
  const nav=el('settingsTabs');
  if(!nav)return;
  const group=PAGE_TABS[route.tabs];
  nav.hidden=!group;
  if(!group)return;
  nav.setAttribute('aria-label',group.label);
  nav.innerHTML=group.tabs.filter(tab=>!tab.adminOnly||isAdminUser()).map(tab=>{
    const active=tab.key===route.tab;
    return '<a class="tab'+(active?' active':'')+'" href="#/'+tab.route+'"'+(active?' aria-current="page"':'')+'>'+
      icon(tab.icon,'icon-sm')+'<span>'+escapeHtml(tab.label)+'</span></a>';
  }).join('');
}

function showAdminSection(path){
  const route=ADMIN_ROUTES[path]||ADMIN_ROUTES.vacancies;
  document.querySelectorAll('.admin-page-section').forEach(section=>
    section.classList.toggle('active',section.id==='admin-'+route.section)
  );
  el('adminPageTitle').textContent=route.title;
  el('adminPageDescription').textContent=route.description;
  renderPageTabs(route);
}

function upsertById(collection,idKey,entity){
  const index=collection.findIndex(item=>String(item[idKey])===String(entity[idKey]));
  if(index>=0)collection[index]=entity;
  else collection.push(entity);
}

// Лента комментариев: одна на форму, пересоздаётся при смене записи.
const commentThreads={};

function mountCommentThread(key,containerId,entityType,entityId){
  const container=el(containerId);
  if(commentThreads[key]){commentThreads[key].destroy();delete commentThreads[key]}
  container.innerHTML='';
  if(!entityId||typeof CommentThread==='undefined')return;
  commentThreads[key]=CommentThread.mount(container,{entityType,entityId,currentUser:state.currentUser});
}

function setVacancyNameError(message){
  const node=el('vacancyNameError');
  node.textContent=message||'';
  node.hidden=!message;
  el('vacancyName').classList.toggle('input-error',!!message);
  if(message){
    el('vacancyName').setAttribute('aria-invalid','true');
    el('vacancyName').setAttribute('aria-describedby','vacancyNameError');
    el('vacancyName').focus();
  }else{
    el('vacancyName').removeAttribute('aria-invalid');
    el('vacancyName').removeAttribute('aria-describedby');
  }
}

// ---------- Публикации вакансии: ссылки на hh, Telegram, LinkedIn… ----------

function vacancyLinkHost(url){
  try{return new URL(url).hostname.replace(/^www\./,'')}catch(error){return ''}
}

// Иконки публикаций в таблице: до 5 штук, остальное — «+N».
function vacancyLinksHtml(links){
  if(!links.length)return '<span class="muted">—</span>';
  const shown=links.slice(0,5).map(link=>{
    const label=link.name||vacancyLinkHost(link.url)||link.url;
    return '<a class="pub-link" href="'+escapeHtml(link.url)+'" target="_blank" rel="noopener" data-tip="'+escapeHtml(label)+'" aria-label="'+escapeHtml(label)+' (откроется в новой вкладке)" onclick="event.stopPropagation()">'+
      brandIconHtml(detectBrandKey(link.url+' '+(link.name||'')))+'</a>';
  }).join('');
  return '<span class="pub-links">'+shown+(links.length>5?'<span class="more-chip">+'+(links.length-5)+'</span>':'')+'</span>';
}

function vacancyLinkRow(link={},readOnly=false){
  const url=link.url||'';
  return '<div class="vacancy-link-row">'+
    '<span class="vacancy-link-icon">'+brandIconHtml(url?detectBrandKey(url+' '+(link.name||'')):'other')+'</span>'+
    '<input class="vacancy-link-url" type="url" inputmode="url" spellcheck="false" placeholder="https://hh.kz/vacancy/…" aria-label="Ссылка на публикацию" value="'+escapeHtml(url)+'"'+(readOnly?' readonly':'')+' oninput="updateVacancyLinkRow(this)">'+
    '<input class="vacancy-link-name" placeholder="Подпись (необязательно)" aria-label="Подпись ссылки" value="'+escapeHtml(link.name||'')+'"'+(readOnly?' readonly':'')+' oninput="updateVacancyLinkRow(this)">'+
    '<a class="icon-btn icon-btn-sm vacancy-link-open" href="'+escapeHtml(url||'#')+'" target="_blank" rel="noopener" data-tip="Открыть" aria-label="Открыть ссылку"'+(/^https?:\/\//i.test(url)?'':' hidden')+'>'+icon('external','icon-sm')+'</a>'+
    (readOnly?'':iconBtn('trash','Удалить ссылку','this.closest(\'.vacancy-link-row\').remove();Drawer.markDirty(\'vacancyDrawer\');updateVacancyLinksEmpty()','icon-btn-sm icon-btn-danger'))+
  '</div>';
}

function renderVacancyLinks(links,readOnly){
  el('vacancyLinks').innerHTML=links.map(link=>vacancyLinkRow(link,readOnly)).join('');
  el('vacancyLinkAdd').hidden=!!readOnly;
  updateVacancyLinksEmpty();
}

function updateVacancyLinksEmpty(){
  el('vacancyLinksEmpty').hidden=!!el('vacancyLinks').children.length;
}

function addVacancyLink(){
  el('vacancyLinks').insertAdjacentHTML('beforeend',vacancyLinkRow());
  updateVacancyLinksEmpty();
  const rows=el('vacancyLinks').querySelectorAll('.vacancy-link-url');
  rows[rows.length-1].focus();
}

function updateVacancyLinkRow(input){
  const row=input.closest('.vacancy-link-row');
  const url=row.querySelector('.vacancy-link-url').value.trim();
  const name=row.querySelector('.vacancy-link-name').value.trim();
  row.querySelector('.vacancy-link-icon').innerHTML=brandIconHtml(url?detectBrandKey(url+' '+name):'other');
  const open=row.querySelector('.vacancy-link-open');
  open.hidden=!/^https?:\/\/\S+\.\S+/i.test(url);
  open.href=url||'#';
}

// null — есть ошибки (показаны у полей).
function collectVacancyLinks(){
  const errors=[];
  const links=[...document.querySelectorAll('#vacancyLinks .vacancy-link-row')].map(row=>{
    const urlInput=row.querySelector('.vacancy-link-url');
    const url=urlInput.value.trim();
    const name=row.querySelector('.vacancy-link-name').value.trim();
    if(!url&&!name)return null;
    if(!/^https?:\/\/\S+\.\S+/i.test(url))errors.push({field:urlInput,message:'Ссылка должна начинаться с https:// или http://'});
    return {url,name};
  }).filter(Boolean);
  return UiKit.showFieldErrors(errors)?links:null;
}

function editVacancy(id,item){
  const vacancy=item||tableItem('vacancies','Vacancy ID',id)||state.vacancies.find(x=>String(x['Vacancy ID'])===String(id));
  if(!vacancy)return;
  // В справочнике и в ответе сохранения этапов нет — без них форма стёрла бы привязки шаблонов.
  if(!Array.isArray(vacancy.templates)){
    loadVacancyRow(vacancy).then(row=>{
      if(row)editVacancy(id,row);
      else showToast('Вакансия недоступна.','error');
    }).catch(error=>showToast(error&&error.message?error.message:String(error),'error'));
    return;
  }
  Drawer.open('vacancyDrawer');
  currentVacancy=vacancy;
  vacancyPresetSource=null;

  el('vacancyId').value=id;
  el('vacancyName').value=vacancy['Вакансия']||'';
  el('vacancyName').readOnly=vacancy.state==='deleted';
  el('vacancyFormTitle').textContent='№'+(vacancy['№']||'—')+' · '+vacancy['Вакансия'];
  el('vacancyLifecycleNote').innerHTML=lifecycleNote(vacancy);
  setVacancyNameError('');
  renderVacancyLinks(vacancy.links||[],vacancy.state==='deleted');
  renderVacancyFormActions(vacancy);
  renderVacancyStages(vacancy.templates||[],vacancy.state==='deleted',vacancy.requiredStages||[]);
  renderVacancyStageTools();
  el('vacancyPresetNote').innerHTML=vacancyPresetOriginNote(vacancy);
  mountCommentThread('vacancy','vacancyComments','vacancy',id);
  rerenderServerTable('vacancies');
  Drawer.markClean('vacancyDrawer');
}

async function reopenVacancy(id){
  const item=await findInTable('vacancies','Vacancy ID',id);
  if(item)editVacancy(id,item);
  else resetVacancyForm();
}

async function saveVacancyForm(button){
  const name=value('vacancyName').trim();
  if(!name){
    setVacancyNameError('Укажите название вакансии.');
    return;
  }

  const id=value('vacancyId');
  const duplicate=state.vacancies.find(v=>
    String(v['Vacancy ID'])!==String(id)&&
    String(v['Вакансия']||'').trim().toLowerCase()===name.toLowerCase()
  );
  if(duplicate){
    setVacancyNameError('Вакансия с таким названием уже существует (№'+(duplicate['№']||'—')+').');
    return;
  }

  const links=collectVacancyLinks();
  if(!links)return;
  const templates=collectVacancyTemplates();
  // Новая вакансия помнит шаблон, из которого взяты этапы (только для справки).
  const presetId=!id&&vacancyPresetSource||undefined;

  await runUiTask({button,formId:'vacancyForm',label:'Сохранение…'},async()=>{
    try{
      const {vacancy}=await rpc('saveVacancy',{id,name,links,templates,presetId});
      upsertById(state.vacancies,'Vacancy ID',vacancy);
      populateGlobalFilters();
      // Этапы вакансии нужны доске (вопросы при переводе), а шаблонам вакансий — счётчик вакансий.
      await refreshReferences();
      if(presetId)loadServerTable('vacancyPresets');
      if(!id){
        // Новая запись: форма закрывается, строка — сверху таблицы с подсветкой.
        markFresh('vacancies',vacancy);
        Drawer.markClean('vacancyDrawer');
        Drawer.close('vacancyDrawer');
        await loadServerTable('vacancies');
        showToast('Вакансия «'+vacancy['Вакансия']+'» создана.');
        return;
      }
      await loadServerTable('vacancies');
      editVacancy(vacancy['Vacancy ID'],tableItem('vacancies','Vacancy ID',vacancy['Vacancy ID'])||vacancy);
      showToast('Вакансия сохранена.');
    }catch(error){
      if(/уже существует/.test(error.message))setVacancyNameError(error.message);
      throw error;
    }
  }).catch(()=>{});
}

async function setVacancyStatusUi(id,status,button){
  await runUiTask({button,label:'…'},async()=>{
    const {vacancy}=await rpc('setVacancyStatus',{id,status});
    upsertById(state.vacancies,'Vacancy ID',vacancy);
    populateGlobalFilters();
    await loadServerTable('vacancies');
    // Форма остаётся как есть (несохранённые правки не теряются): обновляется только шапка со статусом.
    if(String(value('vacancyId'))===String(id)){
      currentVacancy={...(currentVacancy||{}),...(tableItem('vacancies','Vacancy ID',id)||vacancy)};
      renderVacancyFormActions(currentVacancy);
    }
    showToast('Статус вакансии: «'+status+'».');
  }).catch(()=>{
    if(currentVacancy&&String(value('vacancyId'))===String(id))renderVacancyFormActions(currentVacancy);
  });
}

// Строка таблицы вакансий (с этапами) по номеру — когда вакансии нет на загруженной странице.
async function loadVacancyRow(vacancy){
  const data=await rpc('listVacancies',{page:1,pageSize:5,filters:{number:vacancy['№'],state:'all'}});
  return (data.items||[]).find(row=>String(row['Vacancy ID'])===String(vacancy['Vacancy ID']))||null;

// ---------- Шаблоны вакансий ----------
// Шаблон вакансии — готовые этапы: шаблон вопросов и обязательность на каждом этапе. Новая вакансия
// получает их копию («Из шаблона…» в форме вакансии или «Создать вакансию» в шаблоне); дальше
// вакансия и шаблон меняются независимо. «В шаблон» сохраняет этапы формы вакансии новым шаблоном.

let currentVacancyPreset=null;
// Шаблон, из которого заполнены этапы новой вакансии (уходит в saveVacancy как presetId).
let vacancyPresetSource=null;

function vacancyPresetLabel(preset){
  return '№'+(preset['№']||'—')+' · '+preset['Название'];
}

function findVacancyPreset(id){
  return (state.vacancyPresets||[]).find(preset=>String(preset['Preset ID'])===String(id))||null;
}

// Этапы для копирования: шаблон вопросов не из активных (в архиве) не переносится — этап остаётся
// с прежней обязательностью, но без вопросов (иначе сервер не сохранит новую привязку).
function copyStageBindings(bindings,requiredStages){
  const active=new Set((state.templates||[]).map(t=>String(t['Template ID'])));
  const skipped=(bindings||[]).filter(binding=>!active.has(String(binding.id)));
  return {
    bindings:(bindings||[]).filter(binding=>active.has(String(binding.id))),
    requiredStages:[...new Set([...(requiredStages||[]),...(bindings||[]).filter(binding=>binding.required).map(binding=>binding.stage)])],
    skipped
  };
}

function presetNoteHtml(text,skipped){
  const lost=(skipped||[]).map(binding=>'«'+binding.stage+'»: №'+(binding.number||'—')+' · '+(binding.name||'шаблон'));
  return '<div class="preset-note">'+icon('copy','icon-sm')+'<span>'+escapeHtml(text)+
    (lost.length?' <strong>Шаблоны вопросов в архиве не перенесены — этапы остались без вопросов:</strong> '+escapeHtml(lost.join('; '))+'.':'')+
  '</span></div>';
}

function vacancyPresetOriginNote(vacancy){
  const preset=vacancy&&vacancy.presetId&&findVacancyPreset(vacancy.presetId);
  return preset?presetNoteHtml('Вакансия создана из шаблона «'+vacancyPresetLabel(preset)+'». Изменения шаблона на неё не влияют.'):'';
}

// «Из шаблона…» и «В шаблон» в заголовке раздела «Этапы» формы вакансии.
function renderVacancyStageTools(){
  const root=el('vacancyStageTools');
  if(!root)return;
  if(currentVacancy&&currentVacancy.state==='deleted'){root.innerHTML='';return}
  const presets=state.vacancyPresets||[];
  root.innerHTML=
    (presets.length
      ?'<span class="stage-preset-pick" data-drawer-ignore><select aria-label="Заполнить этапы из шаблона вакансии" onchange="pickVacancyPreset(this)">'+
          option('','Из шаблона…')+presets.map(preset=>option(preset['Preset ID'],vacancyPresetLabel(preset))).join('')+
        '</select></span>'
      :'')+
    '<button type="button" class="button button-secondary button-small" data-tip="Сохранить этапы как шаблон вакансии" onclick="saveVacancyAsPreset()">'+icon('copy')+'<span>В шаблон</span></button>';
}

async function pickVacancyPreset(select){
  const presetId=select.value;
  // Список работает как меню действий: после выбора снова «Из шаблона…».
  select.value='';
  if(!presetId)return;
  // Шаблон могли изменить или убрать в архив после загрузки страницы — берём свежие справочники.
  await refreshReferences().catch(()=>{});
  renderVacancyStageTools();
  const preset=findVacancyPreset(presetId);
  if(!preset){showToast('Шаблон вакансии больше недоступен (в архиве или удалён).','error');return}
  if(collectVacancyTemplates().length){
    const ok=await showConfirm('Этапы вакансии заменятся этапами шаблона «'+preset['Название']+'». Изменения вступят в силу после сохранения вакансии.','Этапы из шаблона',{danger:false,confirmLabel:'Заменить'});
    if(!ok)return;
  }
  applyVacancyPreset(preset);
}

function applyVacancyPreset(preset){
  const copy=copyStageBindings(preset.templates||[],preset.requiredStages||[]);
  renderVacancyStages(copy.bindings,false,copy.requiredStages);
  if(!value('vacancyId'))vacancyPresetSource=preset['Preset ID'];
  el('vacancyPresetNote').innerHTML=presetNoteHtml('Этапы заполнены из шаблона «'+vacancyPresetLabel(preset)+'». Дальше вакансия и шаблон меняются независимо.',copy.skipped);
  Drawer.markDirty('vacancyDrawer');
}

// Этапы формы вакансии (в т. ч. несохранённые) — в новый шаблон вакансии. Панель шаблона
// открывается поверх вакансии: переход в другой раздел закрыл бы форму без вопроса о правках.
function saveVacancyAsPreset(){
  const stages=collectVacancyTemplates();
  if(!stages.length){
    showToast('Сначала настройте этапы: выберите шаблоны вопросов или отметьте обязательные этапы.','error');
    return;
  }
  const known=new Map([
    ...((currentVacancy&&currentVacancy.templates)||[]).map(t=>[String(t.id),t]),
    ...(state.templates||[]).map(t=>[String(t['Template ID']),{number:t['№'],name:t['Название']}])
  ]);
  const bindings=stages.filter(stage=>stage.templateId).map(stage=>({
    ...(known.get(String(stage.templateId))||{}),id:stage.templateId,stage:stage.stage,required:stage.required
  }));
  const copy=copyStageBindings(bindings,stages.filter(stage=>stage.required).map(stage=>stage.stage));
  fillVacancyPresetForm(null,{name:value('vacancyName').trim(),...copy});
}

const vacancyPresetTable=createServerTable({
  id:'vacancyPresets',
  containerId:'vacancyPresetTable',
  rpcName:'listVacancyPresets',
  emptyText:'Шаблонов вакансий пока нет',
  emptyHint:'Создайте шаблон кнопкой «Новый шаблон» или сохраните этапы вакансии кнопкой «В шаблон».',
  defaultSort:{key:'number',dir:'desc'},
  rowId:item=>item['Preset ID'],
  isSelected:item=>String(item['Preset ID'])===String(value('vacancyPresetId')),
  onRowClick:item=>editVacancyPreset(item['Preset ID'],item),
  columns:[
    {label:'№',sort:'number',width:'64px',filter:{key:'number',type:'number'},render:item=>escapeHtml(item['№'])},
    {label:'Шаблон',sort:'name',filter:{key:'name',type:'text'},render:item=>escapeHtml(item['Название'])+' '+stateBadge(item)},
    {label:'Этапы',sort:'stages',render:item=>templateChips(item.templates||[],item.requiredStages||[])},
    {label:'Вакансий',sort:'vacancies',width:'96px',render:item=>escapeHtml(item.vacancyCount||0)},
    {label:'',width:'76px',render:item=>'<div class="row-actions">'+
      (item.state==='active'?iconBtn('plus','Создать вакансию по шаблону','event.stopPropagation();createVacancyFromPreset(\''+escJs(item['Preset ID'])+'\')','icon-btn-sm'):'')+
      lifecycleButtons('vacancy_preset',item['Preset ID'],item.state,true)+'</div>'}
  ]
});

function renderVacancyPresetFormActions(preset){
  const readOnly=preset&&preset.state==='deleted';
  formActions('vacancyPresetFormActions',[
    preset?historyButton('vacancy_preset',preset['Preset ID'],vacancyPresetLabel(preset)):'',
    preset?lifecycleButtons('vacancy_preset',preset['Preset ID'],preset.state):'',
    // На телефоне подпись прячется (btn-label) — остаётся значок с подсказкой.
    preset&&preset.state==='active'
      ?'<button type="button" class="button button-secondary" data-tip="Создать вакансию по шаблону" onclick="createVacancyFromPreset(\''+escJs(preset['Preset ID'])+'\')">'+icon('plus')+'<span class="btn-label">Создать вакансию</span></button>'
      :'',
    readOnly?'':textBtn('save','Сохранить','saveVacancyPresetForm(this)')
  ]);
}

function onVacancyPresetDrawerClose(){
  currentVacancyPreset=null;
  el('vacancyPresetId').value='';
  rerenderServerTable('vacancyPresets');
}

// prefill — этапы из формы вакансии («В шаблон»): { name, bindings, requiredStages, skipped }.
function fillVacancyPresetForm(preset,prefill){
  const readOnly=!!(preset&&preset.state==='deleted');
  Drawer.open('vacancyPresetDrawer');
  currentVacancyPreset=preset;
  el('vacancyPresetId').value=preset?preset['Preset ID']:'';
  el('vacancyPresetName').value=preset?preset['Название']||'':(prefill&&prefill.name)||'';
  el('vacancyPresetName').readOnly=readOnly;
  el('vacancyPresetFormTitle').textContent=preset?vacancyPresetLabel(preset):'Новый шаблон вакансии';
  el('vacancyPresetLifecycleNote').innerHTML=preset?lifecycleNote(preset):'';
  el('vacancyPresetUsage').textContent=preset?'Создано вакансий из шаблона: '+(preset.vacancyCount||0)+'.':'';
  renderVacancyPresetFormActions(preset);
  renderStageEditor(
    'vacancyPresetStageList',
    preset?preset.templates||[]:(prefill&&prefill.bindings)||[],
    readOnly,
    preset?preset.requiredStages||[]:(prefill&&prefill.requiredStages)||[]
  );
  el('vacancyPresetNoteForm').innerHTML=prefill?presetNoteHtml('Этапы взяты из формы вакансии.',prefill.skipped):'';
  rerenderServerTable('vacancyPresets');
  Drawer.markClean('vacancyPresetDrawer');
  // Предзаполненный шаблон ещё не сохранён — закрытие спросит подтверждение.
  if(prefill)Drawer.markDirty('vacancyPresetDrawer');
  if(!preset){
    el('vacancyPresetName').focus();
    el('vacancyPresetName').select();
  }
}

function resetVacancyPresetForm(){fillVacancyPresetForm(null)}

function editVacancyPreset(id,item){
  const preset=item||tableItem('vacancyPresets','Preset ID',id);
  if(!preset)return;
  clearFresh('vacancyPresets',id);
  fillVacancyPresetForm(preset);
}

async function reopenVacancyPreset(id){
  const item=await findInTable('vacancyPresets','Preset ID',id);
  if(item)fillVacancyPresetForm(item);
  else{Drawer.markClean('vacancyPresetDrawer');Drawer.close('vacancyPresetDrawer')}
}

function collectStageBindings(listId){
  return [...el(listId).querySelectorAll('.stage-row')].map(row=>({
    stage:row.dataset.stage,
    templateId:row.querySelector('.stage-template').value,
    required:row.querySelector('.stage-required-input').checked
  })).filter(binding=>binding.templateId||binding.required);
}

async function saveVacancyPresetForm(button){
  const name=value('vacancyPresetName').trim();
  const id=value('vacancyPresetId');
  if(!UiKit.showFieldErrors(name?[]:[{field:'vacancyPresetName',message:'Укажите название шаблона.'}]))return;
  // В справочнике только активные шаблоны; совпадение с архивным поймает сервер (409).
  const duplicate=(state.vacancyPresets||[]).find(preset=>
    String(preset['Preset ID'])!==String(id)&&String(preset['Название']||'').trim().toLowerCase()===name.toLowerCase()
  );
  if(duplicate){
    UiKit.showFieldErrors([{field:'vacancyPresetName',message:'Шаблон с таким названием уже существует ('+vacancyPresetLabel(duplicate)+').'}]);
    return;
  }
  const templates=collectStageBindings('vacancyPresetStageList');

  await runUiTask({button,formId:'vacancyPresetForm',label:'Сохранение…'},async()=>{
    try{
      const {preset}=await rpc('saveVacancyPreset',{id,name,templates});
      await refreshReferences();
      // Форма вакансии под панелью («В шаблон»): новый шаблон появится в «Из шаблона…».
      renderVacancyStageTools();
      if(!id){
        markFresh('vacancyPresets',preset);
        Drawer.markClean('vacancyPresetDrawer');
        Drawer.close('vacancyPresetDrawer');
        // Кнопка «В шаблон» перерисована — фокус на новую, иначе он теряется на <body>.
        const back=Drawer.isOpen('vacancyDrawer')&&el('vacancyStageTools').querySelector('button');
        if(back)back.focus({preventScroll:true});
        await loadServerTable('vacancyPresets');
        showToast('Шаблон вакансии «'+preset['Название']+'» создан.');
        return;
      }
      await loadServerTable('vacancyPresets');
      fillVacancyPresetForm(tableItem('vacancyPresets','Preset ID',id)||preset);
      showToast('Шаблон вакансии сохранён.');
    }catch(error){
      if(/уже существует/.test(error.message))UiKit.showFieldErrors([{field:'vacancyPresetName',message:error.message}]);
      throw error;
    }
  }).catch(()=>{});
}

// «Создать вакансию» по шаблону: раздел «Вакансии» и новая вакансия с копией этапов. Этапы — из свежих
// справочников (шаблон могли изменить после загрузки страницы), иначе — из строки, которую видит пользователь.
async function createVacancyFromPreset(id){
  const shown=tableItem('vacancyPresets','Preset ID',id)||
    (currentVacancyPreset&&String(currentVacancyPreset['Preset ID'])===String(id)?currentVacancyPreset:null);
  if(!(await Drawer.requestClose('vacancyPresetDrawer')))return;
  await refreshReferences().catch(()=>{});
  const preset=findVacancyPreset(id)||shown;
  if(!preset||(preset.state&&preset.state!=='active')){
    showToast('Шаблон вакансии недоступен — обновите список.','error');
    return;
  }
  homeAfterRoute('vacancies',()=>resetVacancyForm(preset));
}

// ---------- Шаблоны интервью ----------

// Этапы вакансии: у каждого этапа воронки — шаблон вопросов (не больше одного) и обязательность.
// Обязательный этап: при переходе нужен итог, а с шаблоном — ещё ответы на вопросы; обязательным
// можно сделать и этап без шаблона — тогда при переходе спрашивается только итог. Сохраняется вместе с вакансией.
const STAGE_REQUIRED_NO_TEMPLATE='Шаблона нет — при переводе на этап спросим только итог одним текстом, без вопросов.';

// Редактор этапов (вакансия и шаблон вакансии): listId — контейнер .stage-list,
// счётчик «этапов с шаблоном» — элемент из его data-count.
function renderStageEditor(listId,bindings,readOnly,requiredStages=[]){
  const byStage=new Map((bindings||[]).map(binding=>[binding.stage,binding]));
  const templates=state.templates||[];
  el(listId).innerHTML=(state.pipelineStatuses||[]).map(stage=>{
    const binding=byStage.get(stage)||{};
    const templateId=binding.id||'';
    const required=!!binding.required||requiredStages.includes(stage);
    const known=templates.some(t=>String(t['Template ID'])===String(templateId));
    const dis=readOnly?' disabled':'';
    return '<div class="stage-row" data-stage="'+escapeHtml(stage)+'" style="--st:var(--status-'+statusKey(stage)+')">'+
      '<span class="stage-row-name">'+statusChip(stage,true)+'</span>'+
      '<span class="stage-template-cell">'+
        '<select class="stage-template" aria-label="Шаблон вопросов этапа «'+escapeHtml(stage)+'»"'+dis+' onchange="syncStageRow(this,true)">'+
          option('','Без шаблона')+
          templates.map(t=>option(t['Template ID'],'№'+(t['№']||'—')+' · '+t['Название']+' · '+(t.questions||[]).length+' вопр.',String(t['Template ID'])===String(templateId))).join('')+
          (templateId&&!known?option(templateId,'№'+(binding.number||'—')+' · '+(binding.name||'Шаблон')+' (в архиве)',true):'')+
        '</select>'+
        // Просмотр вопросов доступен и в форме только для чтения.
        '<button type="button" class="icon-btn icon-btn-sm stage-questions-toggle" data-tip="Вопросы шаблона" aria-label="Показать вопросы шаблона этапа «'+escapeHtml(stage)+'»" aria-expanded="false" onclick="toggleStageQuestions(this)">'+icon('eye','icon-sm')+'</button>'+
      '</span>'+
      '<span class="stage-required-cell">'+
        '<label class="checkbox-line stage-required" data-tip="Итог при переводе на этап обязателен; с шаблоном — ещё и ответы"><input type="checkbox" class="stage-required-input"'+(required?' checked':'')+dis+' onchange="syncStageRow(this,true)"><span>Обязательный</span></label>'+
        '<span class="stage-required-warn" role="img" aria-label="'+escapeHtml(STAGE_REQUIRED_NO_TEMPLATE)+'" data-tip="'+escapeHtml(STAGE_REQUIRED_NO_TEMPLATE)+'" hidden>'+icon('alert','icon-sm')+'</span>'+
      '</span>'+
      '<small class="stage-row-note" hidden>'+escapeHtml(STAGE_REQUIRED_NO_TEMPLATE)+'</small>'+
      '<div class="stage-row-questions" hidden></div>'+
    '</div>';
  }).join('');
  el(listId).querySelectorAll('.stage-row').forEach(row=>syncStageRow(row));
  updateStageCount(listId);
}

function renderVacancyStages(bindings,readOnly,requiredStages=[]){
  renderStageEditor('vacancyStageList',bindings,readOnly,requiredStages);
}

// Предупреждение «обязательный без шаблона» — значок у флажка и пояснение под строкой.
// userChange — правка пользователем: выбор в UiSelect приходит не «доверенным» событием,
// и Drawer сам не помечает форму изменённой.
function syncStageRow(node,userChange){
  const row=node.closest('.stage-row');
  const warn=!row.querySelector('.stage-template').value&&row.querySelector('.stage-required-input').checked;
  row.querySelector('.stage-required-warn').hidden=!warn;
  row.querySelector('.stage-row-note').hidden=!warn;
  syncStageQuestions(row);
  updateStageCount(row.closest('.stage-list').id);
  const drawer=userChange&&row.closest('.drawer');
  if(drawer)Drawer.markDirty(drawer.id);
}

// ---------- Вопросы шаблона на этапе (просмотр) ----------
// «Глаз» у выбора шаблона раскрывает под строкой вопросы с предпочтительными ответами.

function stageQuestionsHtml(template){
  const questions=template.questions||[];
  const archived=template.state&&template.state!=='active'
    ?'<div class="stage-questions-note">'+icon('archive','icon-sm')+'<span>Шаблон в архиве — при переводе на этап эти вопросы не задаются.</span></div>'
    :'';
  if(!questions.length)return archived+'<span class="muted">В шаблоне нет вопросов.</span>';
  return archived+'<ol class="stage-questions">'+questions.map(question=>
    '<li><span class="stage-question-text">'+escapeHtml(question.text)+'</span>'+
      ((question.answers||[]).length
        ?'<span class="stage-question-answers">'+question.answers.map(answer=>'<span>'+escapeHtml(answer)+'</span>').join('')+'</span>'
        :'')+
    '</li>'
  ).join('')+'</ol>';
}

// Активные шаблоны — из справочника; привязанный архивный ищется в таблице шаблонов.
async function stageTemplateById(id){
  return (state.templates||[]).find(t=>String(t['Template ID'])===String(id))||
    await findInTable('templates','Template ID',id);
}

async function renderStageQuestions(row){
  const box=row.querySelector('.stage-row-questions');
  const id=row.querySelector('.stage-template').value;
  box.dataset.templateId=id;
  box.innerHTML='<span class="muted">Загрузка вопросов…</span>';
  const template=await stageTemplateById(id).catch(()=>null);
  // Пока шаблон загружался, на этапе могли выбрать другой.
  if(box.dataset.templateId!==id)return;
  box.innerHTML=template?stageQuestionsHtml(template):'<span class="muted">Шаблон не найден.</span>';
}

function setStageQuestionsOpen(row,open){
  const button=row.querySelector('.stage-questions-toggle');
  const box=row.querySelector('.stage-row-questions');
  button.setAttribute('aria-expanded',String(open));
  button.setAttribute('aria-label',(open?'Скрыть':'Показать')+' вопросы шаблона этапа «'+row.dataset.stage+'»');
  box.hidden=!open;
  if(open)renderStageQuestions(row);
}

function toggleStageQuestions(button){
  const row=button.closest('.stage-row');
  setStageQuestionsOpen(row,row.querySelector('.stage-row-questions').hidden);
}

// Без шаблона смотреть нечего; при смене шаблона открытый список перерисовывается.
function syncStageQuestions(row){
  const id=row.querySelector('.stage-template').value;
  const button=row.querySelector('.stage-questions-toggle');
  const box=row.querySelector('.stage-row-questions');
  button.disabled=!id;
  if(!id){
    if(!box.hidden)setStageQuestionsOpen(row,false);
    return;
  }
  if(!box.hidden&&box.dataset.templateId!==id)renderStageQuestions(row);
}

function updateStageCount(listId){
  const list=el(listId);
  const counter=list&&el(list.dataset.count);
  if(counter)counter.textContent=[...list.querySelectorAll('.stage-template')].filter(select=>select.value).length;
}

function updateVacancyStagesCount(){
  updateStageCount('vacancyStageList');
}

function collectVacancyTemplates(){
  return [...document.querySelectorAll('#vacancyStageList .stage-row')].map(row=>({
    stage:row.dataset.stage,
    templateId:row.querySelector('.stage-template').value,
    required:row.querySelector('.stage-required-input').checked
  })).filter(binding=>binding.templateId||binding.required);
}

// Вероятный ответ — строка списка под вопросом, текст переносится целиком.
function answerItem(answer,readOnly){
  return '<li class="answer-item" data-value="'+escapeHtml(answer)+'">'+
    '<span class="answer-text">'+escapeHtml(answer)+'</span>'+
    (readOnly?'':'<button class="icon-btn icon-btn-sm" type="button" data-tip="Убрать ответ" aria-label="Убрать ответ" onclick="this.parentElement.remove();Drawer.markDirty(\'templateDrawer\')">'+icon('close','icon-sm')+'</button>')+
  '</li>';
}

function questionBlock(question,readOnly){
  const item=typeof question==='string'?{text:question,answers:[]}:(question||{text:'',answers:[]});
  return '<div class="question-block">'+
    '<div class="question-editor-row">'+
      '<span class="question-number"></span>'+
      // textarea растёт по тексту; Enter не переносит строку, а ведёт к вводу ответа.
      '<textarea class="template-question" rows="1" placeholder="Текст вопроса" aria-label="Текст вопроса"'+(readOnly?' readonly':'')+' oninput="fitQuestionText(this)" onkeydown="if(event.key===\'Enter\'){event.preventDefault();const next=this.closest(\'.question-block\').querySelector(\'.answer-add-input\');if(next)next.focus()}">'+escapeHtml(item.text||'')+'</textarea>'+
      (readOnly?'':'<button class="icon-btn icon-btn-sm icon-btn-danger" type="button" data-tip="Удалить вопрос" aria-label="Удалить вопрос" onclick="this.closest(\'.question-block\').remove();renumberTemplateQuestions();Drawer.markDirty(\'templateDrawer\')">'+icon('trash','icon-sm')+'</button>')+
    '</div>'+
    '<div class="answer-editor">'+
      '<ul class="answer-list" aria-label="Вероятные ответы">'+(item.answers||[]).map(answer=>answerItem(answer,readOnly)).join('')+'</ul>'+
      (readOnly?'':'<div class="answer-add">'+
        '<input class="answer-add-input" placeholder="Вероятный ответ — Enter, чтобы добавить" aria-label="Вероятный ответ" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addAnswerItem(this)}">'+
        '<button class="icon-btn icon-btn-sm" type="button" data-tip="Добавить вероятный ответ" aria-label="Добавить вероятный ответ" onclick="addAnswerItem(this.previousElementSibling)">'+icon('plus','icon-sm')+'</button>'+
      '</div>')+
    '</div>'+
  '</div>';
}

// Высота поля вопроса — по тексту. Там, где CSS field-sizing:content работает, JS не нужен.
const QUESTION_FIELD_SIZING=typeof CSS!=='undefined'&&CSS.supports&&CSS.supports('field-sizing','content');
function fitQuestionText(textarea){
  if(QUESTION_FIELD_SIZING)return;
  textarea.style.height='auto';
  textarea.style.height=(textarea.scrollHeight+textarea.offsetHeight-textarea.clientHeight)+'px';
}

function addAnswerItem(input){
  const answer=input.value.trim();
  if(!answer)return;
  const list=input.closest('.answer-editor').querySelector('.answer-list');
  const exists=[...list.querySelectorAll('.answer-item')].some(item=>item.dataset.value.toLowerCase()===answer.toLowerCase());
  if(!exists){list.insertAdjacentHTML('beforeend',answerItem(answer));Drawer.markDirty('templateDrawer')}
  input.value='';
  input.focus();
}

function addTemplateQuestion(question,readOnly){
  el('templateQuestionsList').insertAdjacentHTML('beforeend',questionBlock(question||{text:'',answers:[]},readOnly));
  const inputs=el('templateQuestionsList').querySelectorAll('.template-question');
  const input=inputs[inputs.length-1];
  fitQuestionText(input);
  renumberTemplateQuestions();
  if(!question){
    input.focus();
    input.scrollIntoView({block:'nearest'});
  }
}

function renumberTemplateQuestions(){
  const blocks=el('templateQuestionsList').querySelectorAll('.question-block');
  blocks.forEach((block,index)=>{
    block.querySelector('.question-number').textContent=index+1;
  });
  el('templateQuestionCount').textContent=blocks.length;
}

function collectTemplateQuestions(){
  return [...el('templateQuestionsList').querySelectorAll('.question-block')].map(block=>{
    // Невнесённый в список ответ из поля ввода тоже сохраняется.
    const add=block.querySelector('.answer-add-input');
    const pending=add?add.value.trim():'';
    const answers=[...block.querySelectorAll('.answer-item')].map(item=>item.dataset.value);
    if(pending&&!answers.includes(pending))answers.push(pending);
    return {text:block.querySelector('.template-question').value.trim(),answers};
  }).filter(question=>question.text);
}

// ---------- Теги шаблона ----------
// Тег — название и цвет из палитры. Уже использованный в других шаблонах тег подставляется со своим цветом.
const TAG_COLOR_LABELS={blue:'Синий',green:'Зелёный',amber:'Жёлтый',red:'Красный',purple:'Фиолетовый',teal:'Бирюзовый',pink:'Розовый',gray:'Серый'};
const MAX_TEMPLATE_TAGS=10;
let templateTagsDraft=[];

function tagColors(){return state.templateTagColors&&state.templateTagColors.length?state.templateTagColors:Object.keys(TAG_COLOR_LABELS)}
function tagChip(tag){return '<span class="tag-chip" data-color="'+escapeHtml(tag.color||'gray')+'">'+escapeHtml(tag.name)+'</span>'}
function tagChipsHtml(tags){return (tags||[]).length?'<span class="tag-list">'+tags.map(tagChip).join('')+'</span>':''}

function knownTemplateTags(){
  const map=new Map();
  (state.templates||[]).forEach(t=>(t.tags||[]).forEach(tag=>{
    const key=tag.name.toLowerCase();
    if(!map.has(key))map.set(key,tag);
  }));
  return [...map.values()].sort((a,b)=>a.name.localeCompare(b.name,'ru'));
}

function renderTemplateTags(readOnly){
  const colors=tagColors();
  const chips=templateTagsDraft.map((tag,index)=>
    '<span class="tag-chip tag-chip-edit" data-color="'+escapeHtml(tag.color)+'">'+
      (readOnly?'':
        '<details class="tag-color-picker" ontoggle="closeOtherTagPickers(this)">'+
          '<summary data-tip="Цвет тега" aria-label="Цвет тега «'+escapeHtml(tag.name)+'»"><span class="tag-dot"></span></summary>'+
          '<div class="tag-color-popover">'+colors.map(color=>
            '<button type="button" class="tag-swatch" data-color="'+color+'" aria-label="'+TAG_COLOR_LABELS[color]+'" data-tip="'+TAG_COLOR_LABELS[color]+'" aria-pressed="'+(color===tag.color)+'" onclick="setTemplateTagColor('+index+',\''+color+'\')"></button>'
          ).join('')+'</div>'+
        '</details>')+
      '<span>'+escapeHtml(tag.name)+'</span>'+
      (readOnly?'':'<button type="button" class="tag-remove" data-tip="Убрать тег" aria-label="Убрать тег «'+escapeHtml(tag.name)+'»" onclick="removeTemplateTag('+index+')">'+icon('close','icon-sm')+'</button>')+
    '</span>'
  ).join('');
  const suggestions=knownTemplateTags().filter(known=>!templateTagsDraft.some(tag=>tag.name.toLowerCase()===known.name.toLowerCase()));
  el('templateTags').innerHTML=
    (chips?'<div class="tag-list">'+chips+'</div>':(readOnly?'<span class="muted">Тегов нет</span>':''))+
    (readOnly?'':
      '<div class="tag-add">'+
        '<input id="templateTagInput" list="templateTagOptions" maxlength="40" placeholder="Новый тег — Enter, чтобы добавить" aria-label="Новый тег" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addTemplateTag(this.value)}">'+
        '<datalist id="templateTagOptions">'+suggestions.map(tag=>'<option value="'+escapeHtml(tag.name)+'"></option>').join('')+'</datalist>'+
        iconBtn('plus','Добавить тег','addTemplateTag(el(\'templateTagInput\').value)','icon-btn-sm')+
      '</div>');
}

function closeOtherTagPickers(current){
  if(!current.open)return;
  document.querySelectorAll('#templateTags details[open]').forEach(node=>{if(node!==current)node.open=false});
}

// Палитра цвета закрывается кликом мимо неё и по Esc.
document.addEventListener('click',event=>{
  document.querySelectorAll('.tag-color-picker[open]').forEach(node=>{if(!node.contains(event.target))node.open=false});
});
document.addEventListener('keydown',event=>{
  if(event.key!=='Escape')return;
  const open=document.querySelector('.tag-color-picker[open]');
  if(!open)return;
  event.stopPropagation();
  open.open=false;
  open.querySelector('summary').focus();
},true);

function addTemplateTag(raw){
  const name=String(raw||'').trim().replace(/\s+/g,' ').slice(0,40);
  if(!name)return;
  if(templateTagsDraft.some(tag=>tag.name.toLowerCase()===name.toLowerCase())){el('templateTagInput').value='';return}
  if(templateTagsDraft.length>=MAX_TEMPLATE_TAGS){showToast('Не больше '+MAX_TEMPLATE_TAGS+' тегов.','error');return}
  const known=knownTemplateTags().find(tag=>tag.name.toLowerCase()===name.toLowerCase());
  const used=new Set(templateTagsDraft.map(tag=>tag.color));
  const color=known?known.color:(tagColors().find(c=>c!=='gray'&&!used.has(c))||'gray');
  templateTagsDraft.push({name:known?known.name:name,color});
  Drawer.markDirty('templateDrawer');
  renderTemplateTags(false);
  el('templateTagInput').focus();
}

function setTemplateTagColor(index,color){
  if(!templateTagsDraft[index])return;
  templateTagsDraft[index].color=color;
  Drawer.markDirty('templateDrawer');
  renderTemplateTags(false);
}

function removeTemplateTag(index){
  templateTagsDraft.splice(index,1);
  Drawer.markDirty('templateDrawer');
  renderTemplateTags(false);
}

// ---------- Форма шаблона (боковая панель) ----------

function renderTemplateFormActions(template){
  const readOnly=template&&template.state==='deleted';
  formActions('templateFormActions',[
    template?historyButton('template',template['Template ID'],template['Название']):'',
    template?lifecycleButtons('template',template['Template ID'],template.state):'',
    readOnly?'':textBtn('save','Сохранить','saveTemplateForm(this)')
  ]);
}

function onTemplateDrawerClose(){
  el('templateId').value='';
  templateTagsDraft=[];
  rerenderServerTable('templates');
}

function fillTemplateForm(template){
  const readOnly=!!(template&&template.state==='deleted');
  Drawer.open('templateDrawer');
  el('templateId').value=template?template['Template ID']:'';
  el('templateName').value=template?template['Название']||'':'';
  el('templateName').readOnly=readOnly;
  el('templateFormTitle').textContent=template?'№'+(template['№']||'—')+' · '+template['Название']:'Новый шаблон';
  el('templateLifecycleNote').innerHTML=template?lifecycleNote(template):'';
  el('templateUsage').innerHTML=template
    ? templateUsageChips(template.vacancies||[])+presetUsageHtml(template.presets||[])
    : '<span class="muted">Шаблон выбирают в карточке вакансии — в разделе «Этапы».</span>';
  renderTemplateFormActions(template);

  templateTagsDraft=((template&&template.tags)||[]).map(tag=>({...tag}));
  renderTemplateTags(readOnly);

  el('templateQuestionsList').innerHTML='';
  const questions=template?template.questions||[]:[];
  if(questions.length)questions.forEach(question=>addTemplateQuestion(question,readOnly));
  else addTemplateQuestion({text:'',answers:[]},readOnly);
  el('templateQuestionAdd').hidden=readOnly;

  rerenderServerTable('templates');
  Drawer.markClean('templateDrawer');
  if(!template)el('templateName').focus();
}

function resetTemplateForm(){fillTemplateForm(null)}

function editTemplate(id,item){
  const template=item||tableItem('templates','Template ID',id);
  if(!template)return;
  clearFresh('templates',id);
  fillTemplateForm(template);
}

async function reopenTemplate(id){
  const item=await findInTable('templates','Template ID',id);
  if(item)fillTemplateForm(item);
  else{Drawer.markClean('templateDrawer');Drawer.close('templateDrawer')}
}

function collectTemplateTags(){
  // Невнесённый тег из поля ввода тоже сохраняется.
  const pending=el('templateTagInput')?el('templateTagInput').value.trim():'';
  if(pending)addTemplateTag(pending);
  return templateTagsDraft.map(tag=>({name:tag.name,color:tag.color}));
}

async function saveTemplateForm(button){
  const name=value('templateName').trim();
  const questions=collectTemplateQuestions();

  if(!UiKit.showFieldErrors(name?[]:[{field:'templateName',message:'Укажите название шаблона.'}]))return;
  if(!questions.length){showToast('Добавьте хотя бы один вопрос.','error');return}
  const tags=collectTemplateTags();

  await runUiTask({button,formId:'templateForm',label:'Сохранение…'},async()=>{
    const id=value('templateId');
    const {template}=await rpc('saveInterviewTemplate',{id,name,questions,tags});
    await refreshReferences();
    if(!id){
      // Новая запись: панель закрывается, строка — сверху таблицы с подсветкой.
      markFresh('templates',template);
      Drawer.markClean('templateDrawer');
      Drawer.close('templateDrawer');
      await Promise.all([loadServerTable('templates'),loadServerTable('vacancies'),loadServerTable('vacancyPresets')]);
      showToast('Шаблон «'+template['Название']+'» создан. Выберите его на нужном этапе в карточке вакансии.');
      return;
    }
    // Вакансии и шаблоны вакансий показывают названия своих шаблонов, поэтому перечитываем и их.
    await Promise.all([loadServerTable('templates'),loadServerTable('vacancies'),loadServerTable('vacancyPresets')]);
    fillTemplateForm(tableItem('templates','Template ID',id)||template);
    showToast('Шаблон вопросов сохранён.');
  }).catch(()=>{});
}

// ---------- Источники ----------

// Иконка в форме источника: «Авто» (по названию), пресет или своя картинка.
// data: undefined — не менять, '' — убрать свою картинку, data URL — новая картинка.
let sourceIconDraft={key:'',customUrl:'',data:undefined};

function resetSourceIconDraft(source){
  sourceIconDraft={key:source&&source.iconKey||'',customUrl:source&&source.iconUrl||'',data:undefined};
  renderSourceIconPicker();
}

function sourceIconCustomSrc(){
  if(sourceIconDraft.data)return sourceIconDraft.data;
  return sourceIconDraft.data===''?'':sourceIconDraft.customUrl;
}

function renderSourceFormIcon(){
  const node=el('sourceFormIcon');
  if(!node)return;
  const custom=sourceIconCustomSrc();
  const preview={'Название':value('sourceName'),iconKey:sourceIconDraft.key,iconUrl:custom};
  paintSourceIcon(node,preview);
  const auto=el('sourceIconAutoPreview');
  if(auto)auto.innerHTML=brandIconHtml(detectBrandKey(value('sourceName')));
}

function renderSourceIconPicker(){
  const root=el('sourceIconPicker');
  if(!root)return;
  const readOnly=el('sourceName').readOnly;
  const custom=sourceIconCustomSrc();
  const tile=(key,inner,label,pressed)=>
    '<button type="button" class="icon-tile'+(pressed?' is-selected':'')+'" aria-pressed="'+pressed+'" data-tip="'+escapeHtml(label)+'" aria-label="'+escapeHtml(label)+'"'+
    (readOnly?' disabled':'')+' onclick="pickSourceIcon(\''+key+'\')">'+inner+'</button>';
  const keys=(state.sourceIconKeys&&state.sourceIconKeys.length?state.sourceIconKeys:Object.keys(BRANDS)).filter(key=>BRANDS[key]);
  root.innerHTML=
    tile('','<span class="icon-tile-auto" id="sourceIconAutoPreview">'+brandIconHtml(detectBrandKey(value('sourceName')))+'</span><span class="icon-tile-caption">Авто</span>','Авто — по названию',!custom&&!sourceIconDraft.key)+
    keys.map(key=>tile(key,brandIconHtml(key),BRANDS[key].label,!custom&&sourceIconDraft.key===key)).join('')+
    (custom
      ? '<div class="icon-tile icon-tile-custom is-selected" role="group" aria-label="Своя картинка">'+
          '<span class="brand-icon brand-custom"><img src="'+escapeHtml(custom)+'" alt="Своя картинка"></span>'+
          (readOnly?'':'<span class="icon-tile-actions">'+
            iconBtn('edit','Изменить картинку','editSourceIcon()','icon-btn-sm')+
            iconBtn('close','Убрать свою картинку','removeSourceIcon()','icon-btn-sm')+
          '</span>')+
        '</div>'
      : '<button type="button" class="icon-tile icon-tile-upload" data-tip="Загрузить свою картинку" aria-label="Загрузить свою картинку"'+(readOnly?' disabled':'')+' onclick="editSourceIcon()">'+icon('upload')+'<span class="icon-tile-caption">Своя</span></button>');
  renderSourceFormIcon();
}

function pickSourceIcon(key){
  sourceIconDraft.key=key;
  if(sourceIconCustomSrc())sourceIconDraft.data='';
  Drawer.markDirty('sourceDrawer');
  renderSourceIconPicker();
}

async function editSourceIcon(){
  if(!window.IconEditor){showToast('Редактор иконок не загрузился. Обновите страницу.','error');return}
  const result=await IconEditor.open({title:'Иконка: '+(value('sourceName')||'новый источник'),src:sourceIconCustomSrc()||undefined});
  if(!result)return;
  sourceIconDraft.data=result;
  Drawer.markDirty('sourceDrawer');
  renderSourceIconPicker();
}

function removeSourceIcon(){
  sourceIconDraft.data='';
  Drawer.markDirty('sourceDrawer');
  renderSourceIconPicker();
}

function renderSourceFormActions(source){
  const readOnly=source&&source.state==='deleted';
  formActions('sourceFormActions',[
    source?historyButton('source',source['Source ID'],source['Название']):'',
    source?lifecycleButtons('source',source['Source ID'],source.state):'',
    readOnly?'':textBtn('save','Сохранить','saveSourceForm(this)')
  ]);
}

function onSourceDrawerClose(){
  el('sourceId').value='';
  rerenderServerTable('sources');
}

function resetSourceForm(){
  Drawer.open('sourceDrawer');
  el('sourceId').value='';
  el('sourceName').value='';
  el('sourceName').readOnly=false;
  el('sourceFormTitle').textContent='Новый источник';
  el('sourceLifecycleNote').innerHTML='';
  renderSourceFormActions(null);
  resetSourceIconDraft(null);
  rerenderServerTable('sources');
  Drawer.markClean('sourceDrawer');
  el('sourceName').focus();
}

function editSource(id,item){
  const source=item||tableItem('sources','Source ID',id)||state.sources.find(x=>String(x['Source ID'])===String(id));
  if(!source)return;
  Drawer.open('sourceDrawer');

  el('sourceId').value=id;
  el('sourceName').value=source['Название']||'';
  el('sourceName').readOnly=source.state==='deleted';
  el('sourceFormTitle').textContent='№'+(source['№']||'—')+' · '+source['Название'];
  el('sourceLifecycleNote').innerHTML=lifecycleNote(source);
  renderSourceFormActions(source);
  resetSourceIconDraft(source);
  rerenderServerTable('sources');
  Drawer.markClean('sourceDrawer');
}

async function reopenSource(id){
  const item=await findInTable('sources','Source ID',id);
  if(item)editSource(id,item);
  else resetSourceForm();
}

async function saveSourceForm(button){
  const name=value('sourceName').trim();
  if(!name){UiKit.showFieldErrors([{field:'sourceName',message:'Укажите название источника.'}]);return}

  const id=value('sourceId');
  const payload={id,name,iconKey:sourceIconDraft.key};
  if(sourceIconDraft.data!==undefined)payload.iconData=sourceIconDraft.data;

  await runUiTask({button,formId:'sourceForm',label:'Сохранение…'},async()=>{
    const {source}=await rpc('saveSource',payload);
    upsertById(state.sources,'Source ID',source);
    populateGlobalFilters();
    if(!id){
      markFresh('sources',source);
      Drawer.markClean('sourceDrawer');
      Drawer.close('sourceDrawer');
      await loadServerTable('sources');
      showToast('Источник «'+source['Название']+'» добавлен.');
      return;
    }
    await loadServerTable('sources');
    editSource(source['Source ID'],tableItem('sources','Source ID',source['Source ID'])||source);
    showToast('Источник сохранён.');
  }).catch(()=>{});
}

// ---------- Пользователи (они же ответственные) ----------

function renderUserStageOptions(selected){
  if(!el('userStages'))return;
  const current=selected!==undefined
    ? selected
    : [...document.querySelectorAll('.user-stage:checked')].map(x=>x.value);

  el('userStages').innerHTML=(state.pipelineStatuses||[]).map(stage=>
    '<label class="stage-toggle stage-'+statusKey(stage)+'">'+
      '<input type="checkbox" class="user-stage" value="'+escapeHtml(stage)+'" '+(current.includes(stage)?'checked':'')+'>'+
      '<span>'+escapeHtml(stage)+'</span>'+
    '</label>'
  ).join('');
}

function renderUserFormActions(user){
  const readOnly=user&&user.state==='deleted';
  formActions('userFormActions',[
    user?historyButton('user',user['User ID'],user['ФИО']||user.Email):'',
    user?lifecycleButtons('user',user['User ID'],user.state):'',
    readOnly?'':textBtn('save','Сохранить','saveUserForm(this)')
  ]);
}

function onUserDrawerClose(){
  el('userId').value='';
  rerenderServerTable('users');
}

function setUserFormReadOnly(readOnly){
  ['userLastName','userFirstName','userMiddleName','userTelegram'].forEach(id=>el(id).readOnly=readOnly);
  document.querySelectorAll('#userForm input[type=checkbox]').forEach(box=>box.disabled=readOnly);
}

function resetUserForm(){
  Drawer.open('userDrawer');
  el('userId').value='';
  ['userLastName','userFirstName','userMiddleName','userEmail','userTelegram'].forEach(id=>el(id).value='');
  renderUserTelegramStatus(null);
  el('userEmail').readOnly=false;
  el('userEmailHint').textContent='Любой домен. Человек войдёт через Google с этим адресом.';
  el('userActive').checked=true;
  el('userNewAccessField').hidden=false;
  el('userAdmin').checked=false;
  el('userFormTitle').textContent='Новый пользователь';
  el('userLifecycleNote').innerHTML='';
  el('userMeta').hidden=true;
  setUserFormReadOnly(false);
  renderUserStageOptions([]);
  renderUserFormActions(null);
  rerenderServerTable('users');
  Drawer.markClean('userDrawer');
  el('userLastName').focus();
}

function editUser(user){
  Drawer.open('userDrawer');
  el('userId').value=user['User ID'];
  el('userLastName').value=user['Фамилия']||'';
  el('userFirstName').value=user['Имя']||'';
  el('userMiddleName').value=user['Отчество']||'';
  el('userEmail').value=user.Email;
  el('userTelegram').value=user.telegram||'';
  renderUserTelegramStatus(user);
  el('userEmail').readOnly=!user.emailEditable;
  el('userEmailHint').textContent=user.emailEditable
    ?'Пользователь ещё не входил — email можно исправить.'
    :'Email подтверждён входом через Google и не меняется.';
  // Доступ переключается в списке; в форме — только для нового пользователя.
  el('userNewAccessField').hidden=true;
  el('userAdmin').checked=!!user.isAdmin;
  el('userFormTitle').textContent=user['ФИО']||user.Email;
  el('userLifecycleNote').innerHTML=lifecycleNote(user);
  setUserFormReadOnly(user.state==='deleted');
  renderUserStageOptions(user.stages||[]);
  renderUserFormActions(user);

  const rows=[
    ['Доступ',user['Статус доступа']],
    ['Последний вход',fmtDate(user['Последний вход'])],
    ['Доступ выдан',fmtDate(user['Доступ выдан'])],
    ['Запрос доступа',user.accessStatus==='active'?'':fmtDate(user['Запрос доступа'])],
    ['Добавлен',fmtDate(user['Добавлен'])]
  ].filter(([,text])=>text);
  el('userMeta').innerHTML=rows.map(([label,text])=>'<div class="user-meta-row"><span>'+escapeHtml(label)+'</span><span>'+escapeHtml(text)+'</span></div>').join('');
  el('userMeta').hidden=!rows.length;
  rerenderServerTable('users');
  Drawer.markClean('userDrawer');
}

function renderUserTelegramStatus(user){
  const badge=el('userTelegramStatus');
  if(!user||!user.telegram){badge.hidden=true;return}
  badge.hidden=false;
  badge.className='state-badge '+(user.telegramVerified?'state-ok':'state-archived');
  badge.textContent=user.telegramVerified?'Подтверждён':'Не подтверждён';
}

async function reopenUser(id){
  const item=await findInTable('users','User ID',id);
  if(item)editUser(item);
  else resetUserForm();
}

async function afterUserChange(user){
  await loadServerTable('users');
  // Ответственные для форм кандидатов и список для упоминаний.
  refreshReferences().catch(()=>{});
  ensureAdminUsersLoaded(true).catch(()=>{});
  if(user&&String(value('userId'))===String(user['User ID']))editUser(tableItem('users','User ID',user['User ID'])||user);
}

async function saveUserForm(button){
  const id=value('userId');
  const lastName=value('userLastName').trim();
  const firstName=value('userFirstName').trim();
  const userErrors=[
    [!lastName,'userLastName','Укажите фамилию.'],
    [!firstName,'userFirstName','Укажите имя.'],
    [!value('userEmail').trim(),'userEmail','Укажите email Google Account.']
  ].filter(([bad])=>bad).map(([,field,message])=>({field,message}));
  if(!UiKit.showFieldErrors(userErrors))return;
  if(!el('userEmail').readOnly&&!validateEmailField(el('userEmail')))return;

  await runUiTask({button,formId:'userForm',label:'Сохранение…'},async()=>{
    const {user}=await rpc('saveUser',{
      id,
      email:value('userEmail').trim(),
      lastName,
      firstName,
      middleName:value('userMiddleName').trim(),
      stages:[...document.querySelectorAll('.user-stage:checked')].map(x=>x.value),
      isActive:el('userActive').checked,
      isAdmin:el('userAdmin').checked,
      telegram:value('userTelegram').trim()
    });
    if(!id){
      markFresh('users',user);
      Drawer.markClean('userDrawer');
      Drawer.close('userDrawer');
      await afterUserChange(user);
      showToast('Пользователь '+(user['ФИО']||user.Email)+' добавлен.');
      return;
    }
    el('userId').value=user['User ID'];
    await afterUserChange(user);
    showToast('Пользователь сохранён.');
  }).catch(()=>{});
}

async function setUserAccess(id,isActive,input){
  const row=tableItem('users','User ID',id);
  if(!isActive&&row){
    const ok=await showConfirm('Закрыть доступ пользователю '+row.Email+'? Он будет разлогинен при следующем действии.','Закрытие доступа');
    if(!ok){input.checked=true;return}
  }
  input.disabled=true;
  try{
    const {user}=await rpc('setUserAccess',{id,isActive});
    await afterUserChange(user);
    showToast(isActive?'Доступ открыт: '+user.Email:'Доступ закрыт: '+user.Email);
  }catch(error){
    input.checked=!isActive;
    showToast(error.message,'error');
  }finally{
    input.disabled=false;
  }
}
</script>
