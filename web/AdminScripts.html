<script>
// ---------- Серверные таблицы ----------
// Фильтрация, сортировка и пагинация выполняются в БД: таблица отправляет
// { page, pageSize, sort, filters } в RPC и рисует полученную страницу.

const PAGE_SIZES=[10,20,50,100];
const serverTables={};

function createServerTable(config){
  const table={
    ...config,
    query:{page:1,pageSize:20,sort:{...config.defaultSort},filters:{}},
    data:null,
    requestId:0,
    mounted:false,
    filterTimer:null
  };
  serverTables[config.id]=table;
  return table;
}

function mountServerTable(table){
  const root=el(table.containerId);
  if(!root||table.mounted)return;

  const header=table.columns.map(column=>{
    const sortable=!!column.sort;
    const sortCall='serverTableSort(\''+table.id+'\',\''+column.sort+'\')';
    return '<th'+(sortable?' class="sortable" tabindex="0" aria-sort="none" onclick="'+sortCall+'" onkeydown="if(event.key===\'Enter\'||event.key===\' \'){event.preventDefault();'+sortCall+'}"':'')+
      ' data-sort-key="'+escapeHtml(column.sort||'')+'"'+(column.width?' style="width:'+column.width+'"':'')+'>'+
      (column.label?'<span>'+escapeHtml(column.label)+'</span>':'<span class="sr-only">Действия</span>')+
      (sortable?' '+icon('sort','icon-sm sort-icon'):'')+
    '</th>';
  }).join('');

  const filters=table.columns.map(column=>{
    const filter=column.filter;
    if(!filter)return '<th class="no-filter"></th>';
    const label=' data-label="'+escapeHtml(column.label||'')+'"';
    const handler='serverTableFilter(\''+table.id+'\',\''+filter.key+'\',this.value)';
    if(filter.type==='select'){
      return '<th'+label+'><select class="filter-input" aria-label="Фильтр: '+escapeHtml(column.label||'')+'" onchange="'+handler+'">'+
        option('','Все')+filter.options().map(item=>typeof item==='object'?option(item.value,item.label):option(item,item)).join('')+
      '</select></th>';
    }
    const name=column.label||'значению';
    return '<th'+label+'><input class="filter-input" type="'+(filter.type==='number'?'number':'search')+'" '+
      'placeholder="'+(filter.type==='number'?'№':'Поиск')+'" aria-label="Фильтр по '+escapeHtml(name.toLowerCase())+'" oninput="'+handler+'"></th>';
  }).join('');

  root.innerHTML=
    '<div class="table-scroll">'+
      '<table class="data-table">'+
        '<thead><tr>'+header+'</tr><tr class="filter-row">'+filters+'</tr></thead>'+
        '<tbody></tbody>'+
      '</table>'+
    '</div>'+
    '<div class="table-pagination"></div>';

  table.mounted=true;
}

async function loadServerTable(id){
  const table=serverTables[id];
  if(!table)return;
  mountServerTable(table);

  const root=el(table.containerId);
  const requestId=++table.requestId;
  root.classList.add('table-loading');

  try{
    const data=await rpc(table.rpcName,table.query);
    // Ответ на устаревший запрос (фильтр успели изменить) не рисуем.
    if(requestId!==table.requestId)return;
    table.data=data;
    table.query.page=data.page;
    renderServerTableBody(table);
  }catch(error){
    if(requestId===table.requestId){
      showToast(error&&error.message?error.message:String(error),'error');
    }
  }finally{
    if(requestId===table.requestId)root.classList.remove('table-loading');
  }
}

// Только что созданные записи: закреплены сверху первой страницы и подсвечены,
// пока их не откроют (или до перезагрузки страницы).
const freshRecords={vacancies:new Map(),sources:new Map(),users:new Map(),templates:new Map()};

function markFresh(tableId,item){
  const table=serverTables[tableId];
  if(table&&freshRecords[tableId])freshRecords[tableId].set(String(table.rowId(item)),item);
}

function isFresh(tableId,id){
  const bucket=freshRecords[tableId];
  return !!(bucket&&bucket.has(String(id)));
}

function clearFresh(tableId,id){
  const bucket=freshRecords[tableId];
  if(bucket&&bucket.delete(String(id)))rerenderServerTable(tableId);
}

function tableItemsWithFresh(table){
  const data=table.data;
  const bucket=freshRecords[table.id];
  const stateFilter=table.query.filters.state||'active';
  if(!bucket||!bucket.size||data.page!==1||!['active','all'].includes(stateFilter))return data.items;
  const pinnedIds=new Set(bucket.keys());
  const pinned=[...bucket.values()].map(item=>
    data.items.find(row=>String(table.rowId(row))===String(table.rowId(item)))||item
  ).filter(item=>!item.state||item.state==='active');
  return [...pinned,...data.items.filter(row=>!pinnedIds.has(String(table.rowId(row))))];
}

function renderServerTableBody(table){
  const root=el(table.containerId);
  const data=table.data;
  if(!root||!data)return;
  renderStateSwitches(table.id);

  root.querySelectorAll('th[data-sort-key]').forEach(th=>{
    const key=th.dataset.sortKey;
    if(!key)return;
    const active=table.query.sort.key===key;
    if(active)th.dataset.sort=table.query.sort.dir;
    else delete th.dataset.sort;
    th.setAttribute('aria-sort',active?(table.query.sort.dir==='asc'?'ascending':'descending'):'none');
    const use=th.querySelector('.sort-icon use');
    if(use)use.setAttribute('href','#i-'+(active?(table.query.sort.dir==='asc'?'sort-asc':'sort-desc'):'sort'));
  });

  const items=tableItemsWithFresh(table);
  root.querySelector('tbody').innerHTML=items.length
    ? items.map(item=>{
        const selected=table.isSelected&&table.isSelected(item);
        const fresh=isFresh(table.id,table.rowId(item));
        const stateClass=(item.state&&item.state!=='active'?' row-'+item.state:'')+(fresh?' row-fresh':'')+(table.rowClass?' '+table.rowClass(item):'');
        return '<tr class="clickable-row'+(selected?' selected-row':'')+stateClass+'" tabindex="0"'+(selected?' aria-selected="true"':'')+
          ' onkeydown="if(event.key===\'Enter\'&&event.target===this)this.click()"'+
          ' onclick="serverTableRowClick(\''+table.id+'\',\''+escJs(table.rowId(item))+'\')">'+
          table.columns.map((column,index)=>'<td data-label="'+escapeHtml(column.label||'')+'">'+
            (index===0&&fresh?'<span class="fresh-badge">Новая</span>':'')+column.render(item)+'</td>').join('')+
        '</tr>';
      }).join('')
    : '<tr><td class="table-empty" colspan="'+table.columns.length+'">'+serverTableEmptyHtml(table)+'</td></tr>';

  const from=data.total?(data.page-1)*data.pageSize+1:0;
  const to=Math.min(data.page*data.pageSize,data.total);
  const lastPage=Math.max(Math.ceil(data.total/data.pageSize),1);
  const nav=(name,tip,page,disabled)=>
    '<button class="icon-btn icon-btn-sm" data-tip="'+tip+'" aria-label="'+tip+'"'+(disabled?' disabled':'')+
    ' onclick="serverTableGo(\''+table.id+'\','+page+')">'+icon(name,'icon-sm')+'</button>';

  root.querySelector('.table-pagination').innerHTML=
    '<span class="pagination-info">'+from+'–'+to+' из '+data.total+'</span>'+
    '<select class="page-size" aria-label="Строк на странице" onchange="serverTablePageSize(\''+table.id+'\',this.value)">'+
      PAGE_SIZES.map(size=>option(size,size+' на стр.',size===data.pageSize)).join('')+
    '</select>'+
    nav('chevrons-left','Первая страница',1,data.page<=1)+
    nav('chevron-left','Предыдущая страница',data.page-1,data.page<=1)+
    '<span class="pagination-info">'+data.page+' / '+lastPage+'</span>'+
    nav('chevron-right','Следующая страница',data.page+1,data.page>=lastPage)+
    nav('chevrons-right','Последняя страница',lastPage,data.page>=lastPage);
}

// Пустая таблица объясняет почему: фильтры, архив/корзина или записей ещё нет.
function serverTableEmptyHtml(table){
  const filters={...table.query.filters};
  const stateFilter=filters.state||'active';
  delete filters.state;
  let title=table.emptyText||'Записей пока нет';
  let text='';
  if(Object.keys(filters).length){title='Ничего не найдено';text='Измените или очистите фильтры в шапке таблицы.'}
  else if(stateFilter==='archived')title='В архиве пусто';
  else if(stateFilter==='deleted'){title='Корзина пуста';text='Удалённые записи хранятся здесь 30 дней.'}
  else if(table.emptyHint)text=table.emptyHint;
  return '<div class="table-empty-state">'+icon(Object.keys(filters).length?'search':'inbox')+
    '<strong>'+escapeHtml(title)+'</strong>'+(text?'<span>'+escapeHtml(text)+'</span>':'')+'</div>';
}

function serverTableSort(id,key){
  const table=serverTables[id];
  const sort=table.query.sort;
  table.query.sort={key,dir:sort.key===key&&sort.dir==='asc'?'desc':'asc'};
  table.query.page=1;
  loadServerTable(id);
}

function serverTableFilter(id,key,rawValue){
  const table=serverTables[id];
  const filterValue=String(rawValue||'').trim();
  if(filterValue)table.query.filters[key]=filterValue;
  else delete table.query.filters[key];
  table.query.page=1;
  clearTimeout(table.filterTimer);
  table.filterTimer=setTimeout(()=>loadServerTable(id),300);
}

function serverTableGo(id,page){
  serverTables[id].query.page=page;
  loadServerTable(id);
}

function serverTablePageSize(id,size){
  const table=serverTables[id];
  table.query.pageSize=Number(size)||20;
  table.query.page=1;
  loadServerTable(id);
}

function serverTableRowClick(id,rowId){
  const table=serverTables[id];
  if(isFresh(id,rowId)){freshRecords[id].delete(String(rowId))}
  const item=(table.data&&table.data.items||[]).find(row=>String(table.rowId(row))===String(rowId));
  if(item&&table.onRowClick)table.onRowClick(item);
}

function rerenderServerTable(id){
  const table=serverTables[id];
  if(table&&table.data)renderServerTableBody(table);
}

// ---------- Состояние записей: активные / архив / корзина ----------

const STATE_LABELS={active:'Активные',archived:'Архив',deleted:'Корзина',all:'Все'};
const STATE_ICONS={active:'i-dot',archived:'i-archive',deleted:'i-trash',all:'i-list'};

function stateCountHtml(count){
  return '<span class="seg-count'+(Number(count)?'':' is-zero')+'">'+count+'</span>';
}

// Переключатель состояния с количеством записей в каждом (с учётом фильтров таблицы).
function renderStateSwitches(onlyId){
  document.querySelectorAll('.state-switch[data-table]').forEach(root=>{
    const id=root.dataset.table;
    if(onlyId&&id!==onlyId)return;
    const table=serverTables[id];
    if(!table)return;
    const current=table.query.filters.state||'active';
    const counts=table.data&&table.data.counts||{};
    // Корзину видят только администраторы: удалять и восстанавливать могут только они.
    const states=isAdminUser()?['active','archived','deleted','all']:['active','archived','all'];
    root.setAttribute('role','radiogroup');
    root.setAttribute('aria-label','Показать записи');
    root.innerHTML=states.map(state=>
      '<label class="segmented-option" data-state="'+state+'"><input type="radio" name="state-'+id+'" value="'+state+'"'+(state===current?' checked':'')+
      ' onchange="setTableState(\''+id+'\',this.value)"><span><svg class="icon seg-icon" aria-hidden="true"><use href="#'+STATE_ICONS[state]+'"/></svg>'+STATE_LABELS[state]+
      (counts[state]!==undefined?stateCountHtml(counts[state]):'')+'</span></label>'
    ).join('');
  });
}

function setTableState(id,state){
  const table=serverTables[id];
  table.query.filters.state=state;
  table.query.page=1;
  loadServerTable(id);
}

function stateBadge(item){
  if(item.state==='archived')return '<span class="state-badge state-archived">В архиве</span>';
  if(item.state==='deleted')return '<span class="state-badge state-deleted" data-tip="Удалится окончательно '+escapeHtml(fmtDate(item.purgeAt))+'">Удалится через '+escapeHtml(item.daysUntilPurge)+' дн.</span>';
  return '';
}

// Кнопки жизненного цикла для записи в зависимости от её состояния.
function lifecycleButtons(type,id,state,small){
  const size=small?' icon-btn-sm':'';
  const call=action=>'event.stopPropagation();entityAction(\''+type+'\',\''+escJs(id)+'\',\''+action+'\',this)';
  if(state==='deleted'){
    return isAdminUser()?iconBtn('restore','Восстановить из корзины',call('restore'),size.trim()):'';
  }
  if(state==='archived'){
    return iconBtn('unarchive','Вернуть из архива',call('unarchive'),size.trim())+
      (isAdminUser()?iconBtn('trash','Удалить (корзина, 30 дней)',call('delete'),(size+' icon-btn-danger').trim()):'');
  }
  return iconBtn('archive','В архив',call('archive'),size.trim());
}

function lifecycleNote(item){
  if(!item||item.state==='active')return '';
  if(item.state==='archived'){
    return '<div class="lifecycle-note">'+icon('archive','icon-sm')+'<span>В архиве с '+escapeHtml(fmtDate(item.archivedAt))+'. Удалить можно только архивную запись.</span></div>';
  }
  return '<div class="lifecycle-note deleted">'+icon('trash','icon-sm')+'<span>В корзине. Будет удалено окончательно '+escapeHtml(fmtDate(item.purgeAt))+' (через '+escapeHtml(item.daysUntilPurge)+' дн.). До этого её можно восстановить.</span></div>';
}

const ENTITY_ACTIONS={
  archive:{rpc:'archiveEntity',done:'Отправлено в архив.'},
  unarchive:{rpc:'unarchiveEntity',done:'Возвращено из архива.'},
  delete:{rpc:'deleteEntity',done:'Перемещено в корзину. Восстановить можно в течение 30 дней.'},
  restore:{rpc:'restoreEntity',done:'Восстановлено из корзины (в архив).'}
};

const ENTITY_AFTER={
  vacancy:async id=>{await refreshReferences();await loadServerTable('vacancies');if(String(value('vacancyId'))===String(id))await reopenVacancy(id)},
  source:async id=>{await refreshReferences();await loadServerTable('sources');if(String(value('sourceId'))===String(id))reopenSource(id)},
  user:async id=>{await refreshReferences();ensureAdminUsersLoaded(true).catch(()=>{});await loadServerTable('users');if(String(value('userId'))===String(id))reopenUser(id)},
  template:async()=>{await refreshReferences();await Promise.all([loadServerTable('templates'),loadServerTable('vacancies')]);closeTemplateModal()}
};

async function entityAction(type,id,action,button){
  if(action==='delete'){
    const ok=await showConfirm('Удалить запись? Она будет в корзине 30 дней — за это время её можно восстановить. Потом она удалится из базы окончательно.','Удаление');
    if(!ok)return;
  }
  await runUiTask({button,label:'…'},async()=>{
    await rpc(ENTITY_ACTIONS[action].rpc,{type,id});
    if(ENTITY_AFTER[type])await ENTITY_AFTER[type](id);
    showToast(ENTITY_ACTIONS[action].done);
  }).catch(()=>{});
}

// Строка таблицы перерисовывается по данным сервера; для формы ищем запись по id.
function tableItem(tableId,idKey,id){
  const table=serverTables[tableId];
  return (table&&table.data&&table.data.items||[]).find(item=>String(item[idKey])===String(id))||null;
}

async function findInTable(tableId,idKey,id){
  let item=tableItem(tableId,idKey,id);
  if(item)return item;
  // Запись могла сменить состояние и уйти на другой «таб» — ищем во всех состояниях.
  const table=serverTables[tableId];
  for(const state of ['active','archived','deleted']){
    const data=await rpc(table.rpcName,{page:1,pageSize:100,filters:{state}}).catch(()=>null);
    item=data&&data.items.find(row=>String(row[idKey])===String(id));
    if(item)return item;
  }
  return null;
}

function historyButton(type,id,title){
  return id?iconBtn('history','История изменений','openHistory(\''+type+'\',\''+escJs(id)+'\',\''+escJs(title||'')+'\')'):'';
}

function formActions(containerId,buttons){
  el(containerId).innerHTML=buttons.filter(Boolean).join('');
}

// ---------- Таблицы ----------

// Статус вакансии в шапке панели: сегменты «Открыта / На паузе / Закрыта», текущий выбран.
// Недоступные переходы (см. vacancyStatusTransitions) и любые переходы для архивной вакансии отключены.
const VACANCY_STATUS_SEGMENTS=[['Открыта','active'],['На паузе','archived'],['Закрыта','deleted']];
const VACANCY_STATUS_ICONS={'Открыта':'check','На паузе':'clock','Закрыта':'x-circle'};

function vacancyStatusSwitch(vacancy){
  if(!vacancy)return '';
  const allowed=(state.vacancyStatusTransitions||{})[vacancy['Статус']]||[];
  const editable=vacancy.state==='active';
  const id=escJs(vacancy['Vacancy ID']);
  return '<div class="segmented vacancy-status-switch" role="radiogroup" aria-label="Статус вакансии" data-drawer-ignore>'+
    VACANCY_STATUS_SEGMENTS.map(([status,tone])=>{
      const current=status===vacancy['Статус'];
      const disabled=!current&&!(editable&&allowed.includes(status));
      return '<label class="segmented-option" data-state="'+tone+'"'+(disabled?' data-tip="Переход недоступен"':'')+'>'+
        '<input type="radio" name="vacancyStatus" value="'+escapeHtml(status)+'"'+(current?' checked':'')+(disabled?' disabled':'')+
        ' onchange="setVacancyStatusUi(\''+id+'\',\''+escJs(status)+'\')"><span>'+icon(VACANCY_STATUS_ICONS[status],'icon-sm')+escapeHtml(status)+'</span></label>';
    }).join('')+'</div>';
}

function vacancyStatusButtons(item,small){
  if(item.state!=='active')return '';
  const next=(state.vacancyStatusTransitions||{})[item['Статус']]||[];
  // Кнопка называет действие («Приостановить»), а не целевой статус — иначе её путают с самим статусом.
  const actions={'Открыта':['check','Открыть'],'На паузе':['clock','Приостановить'],'Закрыта':['x-circle','Закрыть']};
  return '<span class="status-actions">'+next.map(status=>{
    const [name,verb]=actions[status]||['arrow-right',status];
    return '<button type="button" class="status-action" data-tip="Статус станет «'+escapeHtml(status)+'»" onclick="event.stopPropagation();setVacancyStatusUi(\''+escJs(item['Vacancy ID'])+'\',\''+escJs(status)+'\',this)">'+
      icon(name,'icon-sm')+'<span>'+escapeHtml(verb)+'</span></button>';
  }
  ).join('')+'</span>';
}

const vacancyTable=createServerTable({
  id:'vacancies',
  containerId:'vacancyTable',
  rpcName:'listVacancies',
  emptyText:'Вакансий пока нет',
  emptyHint:'Создайте первую кнопкой «Новая вакансия».',

  rowId:item=>item['Vacancy ID'],
  isSelected:item=>String(item['Vacancy ID'])===String(value('vacancyId')),
  onRowClick:item=>editVacancy(item['Vacancy ID'],item),
  columns:[
    {label:'№',sort:'number',width:'64px',filter:{key:'number',type:'number'},render:item=>escapeHtml(item['№'])},
    {label:'Вакансия',sort:'name',filter:{key:'name',type:'text'},render:item=>escapeHtml(item['Вакансия'])+' '+stateBadge(item)},
    {label:'Статус',sort:'status',width:'250px',filter:{key:'status',type:'select',options:()=>['Открыта','На паузе','Закрыта']},render:item=>
      '<div class="chip-wrap">'+vacancyStatusChip(item['Статус'])+vacancyStatusButtons(item,true)+'</div>'},
    {label:'Кандидаты',sort:'candidates',width:'90px',render:item=>escapeHtml(item.candidateCount||0)},
    {label:'Публикации',width:'150px',render:item=>vacancyLinksHtml(item.links||[])},
    {label:'Шаблоны',sort:'templates',render:item=>templateChips(item.templates||[])},
    {label:'',width:'76px',render:item=>'<div class="row-actions">'+lifecycleButtons('vacancy',item['Vacancy ID'],item.state,true)+'</div>'}
  ]
});

function templateUsageChips(usages){
  if(!usages.length)return '<span class="muted">Не используется</span>';
  return '<div class="chip-wrap">'+
    usages.slice(0,3).map(u=>
      '<span class="mini-chip status-'+statusKey(u.stage)+'">№'+escapeHtml(u.number)+' '+escapeHtml(u.name)+' · '+escapeHtml(u.stage)+(u.required?' *':'')+'</span>'
    ).join('')+
    (usages.length>3?'<span class="more-chip">+'+(usages.length-3)+'</span>':'')+
  '</div>';
}

const templateTable=createServerTable({

  containerId:'templateTable',
  rpcName:'listTemplates',
  emptyText:'Шаблонов пока нет',
  emptyHint:'Создайте первый шаблон кнопкой «Новый шаблон».',

    {label:'Вопросы',sort:'questions',width:'90px',render:item=>escapeHtml((item.questions||[]).length)},
    {label:'Используется в вакансиях',sort:'usage',render:item=>templateUsageChips(item.vacancies||[])},
    {label:'',width:'76px',render:item=>'<div class="row-actions">'+lifecycleButtons('template',item['Template ID'],item.state,true)+'</div>'}

const sourceTable=createServerTable({
  id:'sources',
  containerId:'sourceTable',
  rpcName:'listSources',
  emptyText:'Источников пока нет',
  emptyHint:'Добавьте, откуда приходят кандидаты: LinkedIn, hh, рекомендации…',

  rowId:item=>item['Source ID'],
  isSelected:item=>String(item['Source ID'])===String(value('sourceId')),
  onRowClick:item=>editSource(item['Source ID'],item),
  columns:[
    {label:'№',sort:'number',width:'64px',filter:{key:'number',type:'number'},render:item=>escapeHtml(item['№'])},

    {label:'',width:'76px',render:item=>'<div class="row-actions">'+lifecycleButtons('source',item['Source ID'],item.state,true)+'</div>'}

function userAccessSwitch(user){

function upsertById(collection,idKey,entity){
  const index=collection.findIndex(item=>String(item[idKey])===String(entity[idKey]));
  if(index>=0)collection[index]=entity;
  else collection.push(entity);
}

// Лента комментариев: одна на форму, пересоздаётся при смене записи.
const commentThreads={};

function mountCommentThread(key,containerId,entityType,entityId){
  const container=el(containerId);

function vacancyLinkHost(url){
  try{return new URL(url).hostname.replace(/^www\./,'')}catch(error){return ''}
}

// Иконки публикаций в таблице: до 5 штук, остальное — «+N».
function vacancyLinksHtml(links){
  if(!links.length)return '<span class="muted">—</span>';
  const shown=links.slice(0,5).map(link=>{
    const label=link.name||vacancyLinkHost(link.url)||link.url;
    return '<a class="pub-link" href="'+escapeHtml(link.url)+'" target="_blank" rel="noopener" data-tip="'+escapeHtml(label)+'" aria-label="'+escapeHtml(label)+' (откроется в новой вкладке)" onclick="event.stopPropagation()">'+
      brandIconHtml(detectBrandKey(link.url+' '+(link.name||'')))+'</a>';
  }).join('');
  return '<span class="pub-links">'+shown+(links.length>5?'<span class="more-chip">+'+(links.length-5)+'</span>':'')+'</span>';
}

function vacancyLinkRow(link={},readOnly=false){
  const url=link.url||'';
  return '<div class="vacancy-link-row">'+
    '<span class="vacancy-link-icon">'+brandIconHtml(url?detectBrandKey(url+' '+(link.name||'')):'other')+'</span>'+
    '<input class="vacancy-link-url" type="url" inputmode="url" spellcheck="false" placeholder="https://hh.kz/vacancy/…" aria-label="Ссылка на публикацию" value="'+escapeHtml(url)+'"'+(readOnly?' readonly':'')+' oninput="updateVacancyLinkRow(this)">'+
    '<input class="vacancy-link-name" placeholder="Подпись (необязательно)" aria-label="Подпись ссылки" value="'+escapeHtml(link.name||'')+'"'+(readOnly?' readonly':'')+' oninput="updateVacancyLinkRow(this)">'+
    '<a class="icon-btn icon-btn-sm vacancy-link-open" href="'+escapeHtml(url||'#')+'" target="_blank" rel="noopener" data-tip="Открыть" aria-label="Открыть ссылку"'+(/^https?:\/\//i.test(url)?'':' hidden')+'>'+icon('external','icon-sm')+'</a>'+
    (readOnly?'':iconBtn('trash','Удалить ссылку','this.closest(\'.vacancy-link-row\').remove();Drawer.markDirty(\'vacancyDrawer\');updateVacancyLinksEmpty()','icon-btn-sm icon-btn-danger'))+
  '</div>';

}

function updateVacancyLinkRow(input){
  const row=input.closest('.vacancy-link-row');
  const url=row.querySelector('.vacancy-link-url').value.trim();
  const name=row.querySelector('.vacancy-link-name').value.trim();
  row.querySelector('.vacancy-link-icon').innerHTML=brandIconHtml(url?detectBrandKey(url+' '+name):'other');
  const open=row.querySelector('.vacancy-link-open');
  open.hidden=!/^https?:\/\/\S+\.\S+/i.test(url);
  open.href=url||'#';

// null — есть ошибки (показаны у полей).
function collectVacancyLinks(){
  const errors=[];
  const links=[...document.querySelectorAll('#vacancyLinks .vacancy-link-row')].map(row=>{
    const urlInput=row.querySelector('.vacancy-link-url');
    const url=urlInput.value.trim();
    const name=row.querySelector('.vacancy-link-name').value.trim();
    if(!url&&!name)return null;
    if(!/^https?:\/\/\S+\.\S+/i.test(url))errors.push({field:urlInput,message:'Ссылка должна начинаться с https:// или http://'});
    return {url,name};
  }).filter(Boolean);
  return UiKit.showFieldErrors(errors)?links:null;
}

function editVacancy(id,item){
  const vacancy=item||tableItem('vacancies','Vacancy ID',id)||state.vacancies.find(x=>String(x['Vacancy ID'])===String(id));
  if(!vacancy)return;
  Drawer.open('vacancyDrawer');

  if(item)editVacancy(id,item);
  else resetVacancyForm();
}

async function saveVacancyForm(button){
  const name=value('vacancyName').trim();
  if(!name){
    setVacancyNameError('Укажите название вакансии.');
    return;
  }

  const id=value('vacancyId');
  const duplicate=state.vacancies.find(v=>
    String(v['Vacancy ID'])!==String(id)&&
    String(v['Вакансия']||'').trim().toLowerCase()===name.toLowerCase()
  );
  if(duplicate){
    setVacancyNameError('Вакансия с таким названием уже существует (№'+(duplicate['№']||'—')+').');
    return;
  }

  const links=collectVacancyLinks();
  if(!links)return;
  const templates=collectVacancyTemplates();
  if(!templates)return;

  await runUiTask({button,formId:'vacancyForm',label:'Сохранение…'},async()=>{
    try{
      const {vacancy}=await rpc('saveVacancy',{id,name,links,templates});
      upsertById(state.vacancies,'Vacancy ID',vacancy);
      populateGlobalFilters();
      if(!id){
        // Новая запись: форма закрывается, строка — сверху таблицы с подсветкой.
        markFresh('vacancies',vacancy);
        Drawer.markClean('vacancyDrawer');
        Drawer.close('vacancyDrawer');
        await loadServerTable('vacancies');
        showToast('Вакансия «'+vacancy['Вакансия']+'» создана.');
        return;
      }
      await loadServerTable('vacancies');
      editVacancy(vacancy['Vacancy ID'],tableItem('vacancies','Vacancy ID',vacancy['Vacancy ID'])||vacancy);
      showToast('Вакансия сохранена.');
    }catch(error){
      if(/уже существует/.test(error.message))setVacancyNameError(error.message);
      throw error;
    }
  }).catch(()=>{});
}

async function setVacancyStatusUi(id,status,button){
  await runUiTask({button,label:'…'},async()=>{
    const {vacancy}=await rpc('setVacancyStatus',{id,status});
    upsertById(state.vacancies,'Vacancy ID',vacancy);
    populateGlobalFilters();
    await loadServerTable('vacancies');
    // Форма остаётся как есть (несохранённые правки не теряются): обновляется только шапка со статусом.
    if(String(value('vacancyId'))===String(id)){
      currentVacancy={...(currentVacancy||{}),...(tableItem('vacancies','Vacancy ID',id)||vacancy)};
      renderVacancyFormActions(currentVacancy);
    }
    showToast('Статус вакансии: «'+status+'».');
  }).catch(()=>{
    if(currentVacancy&&String(value('vacancyId'))===String(id))renderVacancyFormActions(currentVacancy);
  });
}

// Привязки шаблонов вакансии: строка «этап → шаблон, обязательный ли». Сохраняются вместе с вакансией.

// null — есть ошибки (показаны у полей). Полностью пустые строки пропускаются.
function collectVacancyTemplates(){
  const errors=[];
  const requiredStages=new Set();
  const seen=new Set();
  const bindings=[...document.querySelectorAll('#vacancyTemplateList .binding-row')].map(row=>{
    const stageSelect=row.querySelector('.binding-stage');
    const templateSelect=row.querySelector('.binding-template');
    const stage=stageSelect.value;
    const templateId=templateSelect.value;
    const required=row.querySelector('.binding-required-input').checked;
    if(!stage&&!templateId)return null;
    if(!stage)errors.push({field:stageSelect,message:'Выберите этап.'});
    if(!templateId)errors.push({field:templateSelect,message:'Выберите шаблон.'});
    if(stage&&templateId){
      const key=stage+'|'+templateId;
      if(seen.has(key))errors.push({field:templateSelect,message:'Этот шаблон уже выбран для этапа.'});
      seen.add(key);
      if(required){
        if(requiredStages.has(stage))errors.push({field:stageSelect,message:'На этапе может быть только один обязательный шаблон.'});
        requiredStages.add(stage);
      }
    }
    return {stage,templateId,required};
  }).filter(Boolean);
  return UiKit.showFieldErrors(errors)?bindings:null;
}

function answerChip(answer){
  return '<span class="answer-chip" data-value="'+escapeHtml(answer)+'">'+
    '<span>'+escapeHtml(answer)+'</span>'+
    '<button class="icon-btn icon-btn-sm" type="button" data-tip="Убрать ответ" aria-label="Убрать ответ" onclick="this.parentElement.remove()">'+icon('close','icon-sm')+'</button>'+
  '</span>';
}

function questionBlock(question){
  const item=typeof question==='string'?{text:question,answers:[]}:(question||{text:'',answers:[]});
  return '<div class="question-block">'+
    '<div class="question-editor-row">'+
      '<span class="question-number"></span>'+
      '<input class="template-question" placeholder="Текст вопроса" value="'+escapeHtml(item.text||'')+'">'+
      '<button class="icon-btn icon-btn-sm icon-btn-danger" type="button" data-tip="Удалить вопрос" aria-label="Удалить вопрос" onclick="this.closest(\'.question-block\').remove();renumberTemplateQuestions()">'+icon('trash','icon-sm')+'</button>'+
    '</div>'+
    '<div class="answer-editor">'+
      '<div class="answer-chips">'+(item.answers||[]).map(answerChip).join('')+'</div>'+
      '<div class="answer-add">'+
        '<input class="answer-add-input" placeholder="Предпочтительный ответ — Enter, чтобы добавить" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addAnswerChip(this)}">'+
        '<button class="icon-btn icon-btn-sm" type="button" data-tip="Добавить предпочтительный ответ" aria-label="Добавить предпочтительный ответ" onclick="addAnswerChip(this.previousElementSibling)">'+icon('plus','icon-sm')+'</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function addAnswerChip(input){
  const answer=input.value.trim();
  if(!answer)return;
  const chips=input.closest('.answer-editor').querySelector('.answer-chips');
  const exists=[...chips.querySelectorAll('.answer-chip')].some(chip=>chip.dataset.value.toLowerCase()===answer.toLowerCase());
  if(!exists)chips.insertAdjacentHTML('beforeend',answerChip(answer));
  input.value='';
  input.focus();
}

function addTemplateQuestion(question){
  el('templateQuestionsList').insertAdjacentHTML('beforeend',questionBlock(question||{text:'',answers:[]}));
  renumberTemplateQuestions();
  if(!question){
    const inputs=el('templateQuestionsList').querySelectorAll('.template-question');
    inputs[inputs.length-1].focus();
  }
}

function renumberTemplateQuestions(){
  el('templateQuestionsList').querySelectorAll('.question-block').forEach((block,index)=>{
    block.querySelector('.question-number').textContent=(index+1)+'.';
  });
}

function collectTemplateQuestions(){
  return [...el('templateQuestionsList').querySelectorAll('.question-block')].map(block=>{
    // Невнесённый в список ответ из поля ввода тоже сохраняется.
    const pending=block.querySelector('.answer-add-input').value.trim();
    const answers=[...block.querySelectorAll('.answer-chip')].map(chip=>chip.dataset.value);
    if(pending&&!answers.includes(pending))answers.push(pending);
    return {text:block.querySelector('.template-question').value.trim(),answers};
  }).filter(question=>question.text);
}

function openTemplateModal(id,item){
  const template=id?(item||tableItem('templates','Template ID',id)):null;
  if(id&&!template)return;
  if(id)clearFresh('templates',id);
  const readOnly=template&&template.state==='deleted';

  el('templateId').value=template?template['Template ID']:'';
  el('templateName').value=template?template['Название']||'':'';
  el('templateName').readOnly=!!readOnly;
  el('templateModalTitle').textContent=template?'№'+(template['№']||'—')+' · '+template['Название']:'Новый шаблон';
  el('templateModalUsage').innerHTML=template?
    (template.usage?'Используется в вакансиях: '+escapeHtml(template.usage):'Пока не привязан к вакансиям')+' '+stateBadge(template):
    'К вакансии шаблон привязывается в её карточке — на нужном этапе.';

  formActions('templateFormActions',[
    template?historyButton('template',template['Template ID'],template['Название']):'',
    template?lifecycleButtons('template',template['Template ID'],template.state):'',
    readOnly?'':textBtn('save','Сохранить','saveTemplateForm(this)'),
    '<span class="toolbar-divider" aria-hidden="true"></span>',
    '<button type="button" class="icon-btn" data-modal-close data-tip="Закрыть (Esc)" aria-label="Закрыть" onclick="closeTemplateModal()">'+icon('close')+'</button>'
  ]);

  el('templateQuestionsList').innerHTML='';
  const questions=template?template.questions||[]:[];
  if(questions.length)questions.forEach(question=>addTemplateQuestion(question));
  else addTemplateQuestion({text:'',answers:[]});

  el('templateModal').classList.add('open');
  rerenderServerTable('templates');
  el('templateName').focus();
}

function closeTemplateModal(){
  el('templateModal').classList.remove('open');
  rerenderServerTable('templates');
}

async function saveTemplateForm(button){
  const name=value('templateName').trim();
  const questions=collectTemplateQuestions();

  if(!UiKit.showFieldErrors(name?[]:[{field:'templateName',message:'Укажите название шаблона.'}]))return;
  if(!questions.length){showToast('Добавьте хотя бы один вопрос.','error');return}

  await runUiTask({button,formId:'templateForm',label:'Сохранение…'},async()=>{
    const created=!value('templateId');
    const {template}=await rpc('saveInterviewTemplate',{id:value('templateId'),name,questions});
    if(created&&template)markFresh('templates',template);
    await refreshReferences();
    closeTemplateModal();
    // Вакансии показывают названия своих шаблонов, поэтому перечитываем и их.
    await Promise.all([loadServerTable('templates'),loadServerTable('vacancies')]);
    showToast('Шаблон вопросов сохранён.');
  }).catch(()=>{});
}

// ---------- Источники ----------

// Иконка в форме источника: «Авто» (по названию), пресет или своя картинка.
// data: undefined — не менять, '' — убрать свою картинку, data URL — новая картинка.
let sourceIconDraft={key:'',customUrl:'',data:undefined};

function resetSourceIconDraft(source){
  sourceIconDraft={key:source&&source.iconKey||'',customUrl:source&&source.iconUrl||'',data:undefined};
  renderSourceIconPicker();
}

function sourceIconCustomSrc(){
  if(sourceIconDraft.data)return sourceIconDraft.data;
  return sourceIconDraft.data===''?'':sourceIconDraft.customUrl;
}

function renderSourceFormIcon(){
  const node=el('sourceFormIcon');
  if(!node)return;
  const custom=sourceIconCustomSrc();
  const preview={'Название':value('sourceName'),iconKey:sourceIconDraft.key,iconUrl:custom};
  paintSourceIcon(node,preview);
  const auto=el('sourceIconAutoPreview');
  if(auto)auto.innerHTML=brandIconHtml(detectBrandKey(value('sourceName')));
}

function renderSourceIconPicker(){
  const root=el('sourceIconPicker');
  if(!root)return;
  const readOnly=el('sourceName').readOnly;
  const custom=sourceIconCustomSrc();
  const tile=(key,inner,label,pressed)=>
    '<button type="button" class="icon-tile'+(pressed?' is-selected':'')+'" aria-pressed="'+pressed+'" data-tip="'+escapeHtml(label)+'" aria-label="'+escapeHtml(label)+'"'+
    (readOnly?' disabled':'')+' onclick="pickSourceIcon(\''+key+'\')">'+inner+'</button>';
  const keys=(state.sourceIconKeys&&state.sourceIconKeys.length?state.sourceIconKeys:Object.keys(BRANDS)).filter(key=>BRANDS[key]);
  root.innerHTML=
    tile('','<span class="icon-tile-auto" id="sourceIconAutoPreview">'+brandIconHtml(detectBrandKey(value('sourceName')))+'</span><span class="icon-tile-caption">Авто</span>','Авто — по названию',!custom&&!sourceIconDraft.key)+
    keys.map(key=>tile(key,brandIconHtml(key),BRANDS[key].label,!custom&&sourceIconDraft.key===key)).join('')+
    (custom
      ? '<div class="icon-tile icon-tile-custom is-selected" role="group" aria-label="Своя картинка">'+
          '<span class="brand-icon brand-custom"><img src="'+escapeHtml(custom)+'" alt="Своя картинка"></span>'+
          (readOnly?'':'<span class="icon-tile-actions">'+
            iconBtn('edit','Изменить картинку','editSourceIcon()','icon-btn-sm')+
            iconBtn('close','Убрать свою картинку','removeSourceIcon()','icon-btn-sm')+
          '</span>')+
        '</div>'
      : '<button type="button" class="icon-tile icon-tile-upload" data-tip="Загрузить свою картинку" aria-label="Загрузить свою картинку"'+(readOnly?' disabled':'')+' onclick="editSourceIcon()">'+icon('upload')+'<span class="icon-tile-caption">Своя</span></button>');
  renderSourceFormIcon();
}

function pickSourceIcon(key){
  sourceIconDraft.key=key;
  if(sourceIconCustomSrc())sourceIconDraft.data='';
  Drawer.markDirty('sourceDrawer');
  renderSourceIconPicker();
}

async function editSourceIcon(){
  if(!window.IconEditor){showToast('Редактор иконок не загрузился. Обновите страницу.','error');return}
  const result=await IconEditor.open({title:'Иконка: '+(value('sourceName')||'новый источник'),src:sourceIconCustomSrc()||undefined});
  if(!result)return;
  sourceIconDraft.data=result;
  Drawer.markDirty('sourceDrawer');
  renderSourceIconPicker();
}

function removeSourceIcon(){
  sourceIconDraft.data='';
  Drawer.markDirty('sourceDrawer');
  renderSourceIconPicker();
}

function renderSourceFormActions(source){
  const readOnly=source&&source.state==='deleted';
  formActions('sourceFormActions',[
    source?historyButton('source',source['Source ID'],source['Название']):'',
    source?lifecycleButtons('source',source['Source ID'],source.state):'',
    readOnly?'':textBtn('save','Сохранить','saveSourceForm(this)')
  ]);
}

function onSourceDrawerClose(){
  el('sourceId').value='';
  rerenderServerTable('sources');
}

function resetSourceForm(){
  Drawer.open('sourceDrawer');
  el('sourceId').value='';
  el('sourceName').value='';
  el('sourceName').readOnly=false;
  el('sourceFormTitle').textContent='Новый источник';
  el('sourceLifecycleNote').innerHTML='';
  renderSourceFormActions(null);
  resetSourceIconDraft(null);
  rerenderServerTable('sources');
  Drawer.markClean('sourceDrawer');
  el('sourceName').focus();
}

function editSource(id,item){
  const source=item||tableItem('sources','Source ID',id)||state.sources.find(x=>String(x['Source ID'])===String(id));
  if(!source)return;
  Drawer.open('sourceDrawer');

  el('sourceId').value=id;
  el('sourceName').value=source['Название']||'';
  el('sourceName').readOnly=source.state==='deleted';
  el('sourceFormTitle').textContent='№'+(source['№']||'—')+' · '+source['Название'];
  el('sourceLifecycleNote').innerHTML=lifecycleNote(source);
  renderSourceFormActions(source);
  resetSourceIconDraft(source);
  rerenderServerTable('sources');
  Drawer.markClean('sourceDrawer');
}

async function reopenSource(id){
  const item=await findInTable('sources','Source ID',id);
  if(item)editSource(id,item);
  else resetSourceForm();
}

async function saveSourceForm(button){
  const name=value('sourceName').trim();
  if(!name){UiKit.showFieldErrors([{field:'sourceName',message:'Укажите название источника.'}]);return}

  const id=value('sourceId');
  const payload={id,name,iconKey:sourceIconDraft.key};
  if(sourceIconDraft.data!==undefined)payload.iconData=sourceIconDraft.data;

  await runUiTask({button,formId:'sourceForm',label:'Сохранение…'},async()=>{
    const {source}=await rpc('saveSource',payload);
    upsertById(state.sources,'Source ID',source);
    populateGlobalFilters();
    if(!id){
      markFresh('sources',source);
      Drawer.markClean('sourceDrawer');
      Drawer.close('sourceDrawer');
      await loadServerTable('sources');
      showToast('Источник «'+source['Название']+'» добавлен.');
      return;
    }
    await loadServerTable('sources');
    editSource(source['Source ID'],tableItem('sources','Source ID',source['Source ID'])||source);
    showToast('Источник сохранён.');
  }).catch(()=>{});
}

// ---------- Пользователи (они же ответственные) ----------

function renderUserStageOptions(selected){
  if(!el('userStages'))return;
  const current=selected!==undefined
    ? selected
    : [...document.querySelectorAll('.user-stage:checked')].map(x=>x.value);

  el('userStages').innerHTML=(state.pipelineStatuses||[]).map(stage=>
    '<label class="stage-toggle stage-'+statusKey(stage)+'">'+
      '<input type="checkbox" class="user-stage" value="'+escapeHtml(stage)+'" '+(current.includes(stage)?'checked':'')+'>'+
      '<span>'+escapeHtml(stage)+'</span>'+
    '</label>'
  ).join('');
}

function renderUserFormActions(user){
  const readOnly=user&&user.state==='deleted';
  formActions('userFormActions',[
    user?historyButton('user',user['User ID'],user['ФИО']||user.Email):'',
    user?lifecycleButtons('user',user['User ID'],user.state):'',
    readOnly?'':textBtn('save','Сохранить','saveUserForm(this)')
  ]);
}

function onUserDrawerClose(){
  el('userId').value='';
  rerenderServerTable('users');
}

function setUserFormReadOnly(readOnly){
  ['userLastName','userFirstName','userMiddleName','userTelegram'].forEach(id=>el(id).readOnly=readOnly);
  document.querySelectorAll('#userForm input[type=checkbox]').forEach(box=>box.disabled=readOnly);
}

function resetUserForm(){
  Drawer.open('userDrawer');
  el('userId').value='';
  ['userLastName','userFirstName','userMiddleName','userEmail','userTelegram'].forEach(id=>el(id).value='');
  renderUserTelegramStatus(null);
  el('userEmail').readOnly=false;
  el('userEmailHint').textContent='Любой домен. Человек войдёт через Google с этим адресом.';
  el('userActive').checked=true;
  el('userNewAccessField').hidden=false;
  el('userAdmin').checked=false;
  el('userFormTitle').textContent='Новый пользователь';
  el('userLifecycleNote').innerHTML='';
  el('userMeta').hidden=true;
  setUserFormReadOnly(false);
  renderUserStageOptions([]);
  renderUserFormActions(null);
  rerenderServerTable('users');
  Drawer.markClean('userDrawer');
  el('userLastName').focus();
}

function editUser(user){
  Drawer.open('userDrawer');
  el('userId').value=user['User ID'];
  el('userLastName').value=user['Фамилия']||'';
  el('userFirstName').value=user['Имя']||'';
  el('userMiddleName').value=user['Отчество']||'';
  el('userEmail').value=user.Email;
  el('userTelegram').value=user.telegram||'';
  renderUserTelegramStatus(user);
  el('userEmail').readOnly=!user.emailEditable;
  el('userEmailHint').textContent=user.emailEditable
    ?'Пользователь ещё не входил — email можно исправить.'
    :'Email подтверждён входом через Google и не меняется.';
  // Доступ переключается в списке; в форме — только для нового пользователя.
  el('userNewAccessField').hidden=true;
  el('userAdmin').checked=!!user.isAdmin;
  el('userFormTitle').textContent=user['ФИО']||user.Email;
  el('userLifecycleNote').innerHTML=lifecycleNote(user);
  setUserFormReadOnly(user.state==='deleted');
  renderUserStageOptions(user.stages||[]);
  renderUserFormActions(user);

  const rows=[
    ['Доступ',user['Статус доступа']],
    ['Последний вход',fmtDate(user['Последний вход'])],
    ['Доступ выдан',fmtDate(user['Доступ выдан'])],
    ['Запрос доступа',user.accessStatus==='active'?'':fmtDate(user['Запрос доступа'])],
    ['Добавлен',fmtDate(user['Добавлен'])]
  ].filter(([,text])=>text);
  el('userMeta').innerHTML=rows.map(([label,text])=>'<div class="user-meta-row"><span>'+escapeHtml(label)+'</span><span>'+escapeHtml(text)+'</span></div>').join('');
  el('userMeta').hidden=!rows.length;
  rerenderServerTable('users');
  Drawer.markClean('userDrawer');
}

function renderUserTelegramStatus(user){
  const badge=el('userTelegramStatus');
  if(!user||!user.telegram){badge.hidden=true;return}
  badge.hidden=false;
  badge.className='state-badge '+(user.telegramVerified?'state-ok':'state-archived');
  badge.textContent=user.telegramVerified?'Подтверждён':'Не подтверждён';
}

async function reopenUser(id){
  const item=await findInTable('users','User ID',id);
  if(item)editUser(item);
  else resetUserForm();
}

async function afterUserChange(user){
  await loadServerTable('users');
  // Ответственные для форм кандидатов и список для упоминаний.
  refreshReferences().catch(()=>{});
  ensureAdminUsersLoaded(true).catch(()=>{});
  if(user&&String(value('userId'))===String(user['User ID']))editUser(tableItem('users','User ID',user['User ID'])||user);
}

async function saveUserForm(button){
  const id=value('userId');
  const lastName=value('userLastName').trim();
  const firstName=value('userFirstName').trim();
  const userErrors=[
    [!lastName,'userLastName','Укажите фамилию.'],
    [!firstName,'userFirstName','Укажите имя.'],
    [!value('userEmail').trim(),'userEmail','Укажите email Google Account.']
  ].filter(([bad])=>bad).map(([,field,message])=>({field,message}));
  if(!UiKit.showFieldErrors(userErrors))return;
  if(!el('userEmail').readOnly&&!validateEmailField(el('userEmail')))return;

  await runUiTask({button,formId:'userForm',label:'Сохранение…'},async()=>{
    const {user}=await rpc('saveUser',{
      id,
      email:value('userEmail').trim(),
      lastName,
      firstName,
      middleName:value('userMiddleName').trim(),
      stages:[...document.querySelectorAll('.user-stage:checked')].map(x=>x.value),
      isActive:el('userActive').checked,
      isAdmin:el('userAdmin').checked,
      telegram:value('userTelegram').trim()
    });
    if(!id){
      markFresh('users',user);
      Drawer.markClean('userDrawer');
      Drawer.close('userDrawer');
      await afterUserChange(user);
      showToast('Пользователь '+(user['ФИО']||user.Email)+' добавлен.');
      return;
    }
    el('userId').value=user['User ID'];
    await afterUserChange(user);
    showToast('Пользователь сохранён.');
  }).catch(()=>{});
}

async function setUserAccess(id,isActive,input){
  const row=tableItem('users','User ID',id);
  if(!isActive&&row){
    const ok=await showConfirm('Закрыть доступ пользователю '+row.Email+'? Он будет разлогинен при следующем действии.','Закрытие доступа');
    if(!ok){input.checked=true;return}
  }
  input.disabled=true;
  try{
    const {user}=await rpc('setUserAccess',{id,isActive});
    await afterUserChange(user);
    showToast(isActive?'Доступ открыт: '+user.Email:'Доступ закрыт: '+user.Email);
  }catch(error){
    input.checked=!isActive;
    showToast(error.message,'error');
  }finally{
    input.disabled=false;
  }
}
</script>
