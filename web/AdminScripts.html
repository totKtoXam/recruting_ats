<script>
// ---------- Серверные таблицы ----------
// Фильтрация, сортировка и пагинация выполняются в БД: таблица отправляет
// { page, pageSize, sort, filters } в RPC и рисует полученную страницу.

const PAGE_SIZES=[10,20,50,100];
const serverTables={};

function createServerTable(config){
  const table={
    ...config,
    query:{page:1,pageSize:20,sort:{...config.defaultSort},filters:{}},
    data:null,
    requestId:0,
    mounted:false,
    filterTimer:null
  };
  serverTables[config.id]=table;
  return table;
}

function mountServerTable(table){
  const root=el(table.containerId);
  if(!root||table.mounted)return;

  const header=table.columns.map(column=>{
    const sortable=!!column.sort;
    return '<th'+(sortable?' class="sortable" onclick="serverTableSort(\''+table.id+'\',\''+column.sort+'\')"':'')+
      ' data-sort-key="'+escapeHtml(column.sort||'')+'"'+(column.width?' style="width:'+column.width+'"':'')+'>'+
      '<span>'+escapeHtml(column.label||'')+'</span>'+
      (sortable?' '+icon('sort','icon-sm sort-icon'):'')+
    '</th>';
  }).join('');

  const filters=table.columns.map(column=>{
    const filter=column.filter;
    if(!filter)return '<th></th>';
    const handler='serverTableFilter(\''+table.id+'\',\''+filter.key+'\',this.value)';
    if(filter.type==='select'){
      return '<th><select class="filter-input" onchange="'+handler+'">'+
        option('','Все')+filter.options().map(item=>option(item,item)).join('')+
      '</select></th>';
    }
    return '<th><input class="filter-input" type="'+(filter.type==='number'?'number':'search')+'" '+
      'placeholder="Фильтр" oninput="'+handler+'"></th>';
  }).join('');

  root.innerHTML=
    '<div class="table-scroll">'+
      '<table class="data-table">'+
        '<thead><tr>'+header+'</tr><tr class="filter-row">'+filters+'</tr></thead>'+
        '<tbody></tbody>'+
      '</table>'+
    '</div>'+
    '<div class="table-pagination"></div>';

  table.mounted=true;
}

async function loadServerTable(id){
  const table=serverTables[id];
  if(!table)return;
  mountServerTable(table);

  const root=el(table.containerId);
  const requestId=++table.requestId;
  root.classList.add('table-loading');

  try{
    const data=await rpc(table.rpcName,table.query);
    // Ответ на устаревший запрос (фильтр успели изменить) не рисуем.
    if(requestId!==table.requestId)return;
    table.data=data;
    table.query.page=data.page;
    renderServerTableBody(table);
  }catch(error){
    if(requestId===table.requestId){
      showToast(error&&error.message?error.message:String(error),'error');
    }
  }finally{
    if(requestId===table.requestId)root.classList.remove('table-loading');
  }
}

function renderServerTableBody(table){
  const root=el(table.containerId);
  const data=table.data;
  if(!root||!data)return;

  root.querySelectorAll('th[data-sort-key]').forEach(th=>{
    const key=th.dataset.sortKey;
    if(!key)return;
    const active=table.query.sort.key===key;
    if(active)th.dataset.sort=table.query.sort.dir;
    else delete th.dataset.sort;
    const use=th.querySelector('.sort-icon use');
    if(use)use.setAttribute('href','#i-'+(active?(table.query.sort.dir==='asc'?'sort-asc':'sort-desc'):'sort'));
  });

  root.querySelector('tbody').innerHTML=data.items.length
    ? data.items.map(item=>{
        const selected=table.isSelected&&table.isSelected(item);
        return '<tr class="clickable-row'+(selected?' selected-row':'')+'" onclick="serverTableRowClick(\''+table.id+'\',\''+escJs(table.rowId(item))+'\')">'+
          table.columns.map(column=>'<td>'+column.render(item)+'</td>').join('')+
        '</tr>';
      }).join('')
    : '<tr><td class="table-empty" colspan="'+table.columns.length+'">Ничего не найдено</td></tr>';

  const from=data.total?(data.page-1)*data.pageSize+1:0;
  const to=Math.min(data.page*data.pageSize,data.total);
  const lastPage=Math.max(Math.ceil(data.total/data.pageSize),1);
  const nav=(name,tip,page,disabled)=>
    '<button class="icon-btn icon-btn-sm" data-tip="'+tip+'" aria-label="'+tip+'"'+(disabled?' disabled':'')+
    ' onclick="serverTableGo(\''+table.id+'\','+page+')">'+icon(name,'icon-sm')+'</button>';

  root.querySelector('.table-pagination').innerHTML=
    '<span class="pagination-info">'+from+'–'+to+' из '+data.total+'</span>'+
    '<select class="page-size" aria-label="Строк на странице" onchange="serverTablePageSize(\''+table.id+'\',this.value)">'+
      PAGE_SIZES.map(size=>option(size,size+' на стр.',size===data.pageSize)).join('')+
    '</select>'+
    nav('chevrons-left','Первая страница',1,data.page<=1)+
    nav('chevron-left','Предыдущая страница',data.page-1,data.page<=1)+
    '<span class="pagination-info">'+data.page+' / '+lastPage+'</span>'+
    nav('chevron-right','Следующая страница',data.page+1,data.page>=lastPage)+
    nav('chevrons-right','Последняя страница',lastPage,data.page>=lastPage);
}

function serverTableSort(id,key){
  const table=serverTables[id];
  const sort=table.query.sort;
  table.query.sort={key,dir:sort.key===key&&sort.dir==='asc'?'desc':'asc'};
  table.query.page=1;
  loadServerTable(id);
}

function serverTableFilter(id,key,rawValue){
  const table=serverTables[id];
  const filterValue=String(rawValue||'').trim();
  if(filterValue)table.query.filters[key]=filterValue;
  else delete table.query.filters[key];
  table.query.page=1;
  clearTimeout(table.filterTimer);
  table.filterTimer=setTimeout(()=>loadServerTable(id),300);
}

function serverTableGo(id,page){
  serverTables[id].query.page=page;
  loadServerTable(id);
}

function serverTablePageSize(id,size){
  const table=serverTables[id];
  table.query.pageSize=Number(size)||20;
  table.query.page=1;
  loadServerTable(id);
}

function serverTableRowClick(id,rowId){
  const table=serverTables[id];
  const item=(table.data&&table.data.items||[]).find(row=>String(table.rowId(row))===String(rowId));
  if(item&&table.onRowClick)table.onRowClick(item);
}

function rerenderServerTable(id){
  const table=serverTables[id];
  if(table&&table.data)renderServerTableBody(table);
}

const vacancyTable=createServerTable({
  id:'vacancies',
  containerId:'vacancyTable',
  rpcName:'listVacancies',
  defaultSort:{key:'number',dir:'desc'},
  rowId:item=>item['Vacancy ID'],
  isSelected:item=>String(item['Vacancy ID'])===String(value('vacancyId')),
  onRowClick:item=>editVacancy(item['Vacancy ID'],item),
  columns:[
    {label:'№',sort:'number',width:'72px',filter:{key:'number',type:'number'},render:item=>escapeHtml(item['№'])},
    {label:'Вакансия',sort:'name',filter:{key:'name',type:'text'},render:item=>escapeHtml(item['Вакансия'])},
    {label:'Статус',sort:'status',width:'140px',filter:{key:'status',type:'select',options:()=>['Открыта','На паузе','Закрыта']},render:item=>vacancyStatusChip(item['Статус'])},
    {label:'Шаблоны',sort:'templates',render:item=>templateChips(item.templates||[])}
  ]
});

const sourceTable=createServerTable({
  id:'sources',
  containerId:'sourceTable',
  rpcName:'listSources',
  defaultSort:{key:'name',dir:'asc'},
  rowId:item=>item['Source ID'],
  isSelected:item=>String(item['Source ID'])===String(value('sourceId')),
  onRowClick:item=>editSource(item['Source ID'],item),
  columns:[
    {label:'№',sort:'number',width:'72px',filter:{key:'number',type:'number'},render:item=>escapeHtml(item['№'])},
    {label:'Источник',sort:'name',filter:{key:'name',type:'text'},render:item=>'<div class="source-name-cell">'+sourceIconHtml(item['Название'])+'<span>'+escapeHtml(item['Название'])+'</span></div>'}
  ]
});

const responsibleTable=createServerTable({
  id:'responsibles',
  containerId:'responsibleTable',
  rpcName:'listResponsibles',
  defaultSort:{key:'lastName',dir:'asc'},
  rowId:item=>item['Responsible ID'],
  isSelected:item=>String(item['Responsible ID'])===String(value('responsibleId')),
  onRowClick:item=>editResponsible(item['Responsible ID'],item),
  columns:[
    {label:'№',sort:'number',width:'72px',filter:{key:'number',type:'number'},render:item=>escapeHtml(item['№'])},
    {label:'Фамилия',sort:'lastName',filter:{key:'lastName',type:'text'},render:item=>escapeHtml(item['Фамилия'])},
    {label:'Имя',sort:'firstName',filter:{key:'firstName',type:'text'},render:item=>escapeHtml(item['Имя'])},
    {label:'Отчество',sort:'middleName',filter:{key:'middleName',type:'text'},render:item=>escapeHtml(item['Отчество'])},
    {label:'Email',sort:'email',filter:{key:'email',type:'text'},render:item=>escapeHtml(item['Email'])},
    {label:'Пользователь',sort:'user',filter:{key:'user',type:'text'},render:item=>escapeHtml(item['Пользователь']||'—')},
    {label:'Этапы',sort:'stages',filter:{key:'stage',type:'select',options:()=>state.pipelineStatuses||[]},render:item=>'<div class="chip-wrap">'+(item.stages||[]).map(stage=>statusChip(stage,true)).join('')+'</div>'}
  ]
});

const ADMIN_TABLES=['vacancies','sources','responsibles'];

function templateChips(templates){
  if(!templates.length)return '<span class="muted">Нет шаблонов</span>';
  return '<div class="chip-wrap">'+
    templates.slice(0,4).map(t=>
      '<span class="mini-chip status-'+statusKey(t.stage)+'">№'+escapeHtml(t.number)+' '+escapeHtml(t.name)+(t.required?' *':'')+'</span>'
    ).join('')+
    (templates.length>4?'<span class="more-chip">+'+(templates.length-4)+'</span>':'')+
  '</div>';
}

// ---------- Общее ----------

let adminInitialized=false;

function initAdmin(){
  if(adminInitialized)return;
  adminInitialized=true;
  // Модальное окно шаблона лежит в разметке админки, но должно жить в <body>,
  // иначе оно скрыто вместе с разделом, когда открыта доска кандидатов.
  document.body.appendChild(el('templateModal'));
}

function adminVisible(){
  return !el('viewAdmin').hidden;
}

function renderAdminAll(){
  initAdmin();

  if(!state.loaded.references){
    ['vacancyTable','sourceTable','responsibleTable'].forEach(id=>{
      if(el(id))el(id).innerHTML='<div class="empty-state compact">Данные загружаются в фоне…</div>';
    });
    return;
  }

  renderResponsibleUserOptions();
  renderResponsibleStageOptions();
  renderTemplateStageOptions();
  renderVacancyTemplatesForSelected();
  renderSourceFormIcon();

  // Таблицы загружаются при первом открытии админ-панели.
  if(adminVisible()){
    ADMIN_TABLES.forEach(id=>{
      if(!serverTables[id].data)loadServerTable(id);
    });
  }
}

function reloadAdminTables(){
  return Promise.all(ADMIN_TABLES.map(id=>loadServerTable(id)));
}

async function refreshAdminPage(button){
  await runUiTask({button,pageId:'viewAdmin',label:'Обновление…'},async()=>{
    await refreshAll();
    await reloadAdminTables();
    showToast('Справочники обновлены.');
  }).catch(()=>{});
}

// Раздел админки выбирается пунктом бокового меню (см. ADMIN_ROUTES).
function showAdminSection(path){
  const route=ADMIN_ROUTES[path]||ADMIN_ROUTES.vacancies;
  document.querySelectorAll('.admin-page-section').forEach(section=>
    section.classList.toggle('active',section.id==='admin-'+route.section)
  );
  el('adminPageTitle').textContent=route.title;
  el('adminPageDescription').textContent=route.description;
}

function upsertById(collection,idKey,entity){
  const index=collection.findIndex(item=>String(item[idKey])===String(entity[idKey]));
  if(index>=0)collection[index]=entity;
  else collection.push(entity);
}

// ---------- Вакансии ----------

function setVacancyNameError(message){
  const node=el('vacancyNameError');
  node.textContent=message||'';
  node.hidden=!message;
  el('vacancyName').classList.toggle('input-error',!!message);
}

function resetVacancyForm(){
  el('vacancyId').value='';
  el('vacancyName').value='';
  el('vacancyStatus').value='Открыта';
  el('vacancyComment').value='';
  el('vacancyFormTitle').textContent='Новая вакансия';
  el('vacancyDeleteButton').hidden=true;
  setVacancyNameError('');
  rerenderServerTable('vacancies');
  renderVacancyTemplatesForSelected();
  el('vacancyName').focus();
}

function editVacancy(id,item){
  const vacancy=item||state.vacancies.find(x=>String(x['Vacancy ID'])===String(id));
  if(!vacancy)return;

  el('vacancyId').value=id;
  el('vacancyName').value=vacancy['Вакансия']||'';
  el('vacancyStatus').value=vacancy['Статус']||'Открыта';
  el('vacancyComment').value=vacancy['Комментарий']||'';
  el('vacancyFormTitle').textContent='№'+(vacancy['№']||'—')+' · '+vacancy['Вакансия'];
  el('vacancyDeleteButton').hidden=false;
  setVacancyNameError('');
  rerenderServerTable('vacancies');
  renderVacancyTemplatesForSelected();
}

async function saveVacancyForm(button){
  const name=value('vacancyName').trim();
  if(!name){
    setVacancyNameError('Укажите название вакансии.');
    return;
  }

  const id=value('vacancyId');
  const duplicate=state.vacancies.find(v=>
    String(v['Vacancy ID'])!==String(id)&&
    String(v['Вакансия']||'').trim().toLowerCase()===name.toLowerCase()
  );
  if(duplicate){
    setVacancyNameError('Вакансия с таким названием уже существует (№'+(duplicate['№']||'—')+').');
    return;
  }

  await runUiTask({button,formId:'vacancyForm',label:'Сохранение…'},async()=>{
    try{
      const {vacancy}=await rpc('saveVacancy',{id,name,status:value('vacancyStatus'),comment:value('vacancyComment')});
      upsertById(state.vacancies,'Vacancy ID',vacancy);
      editVacancy(vacancy['Vacancy ID'],vacancy);
      populateGlobalFilters();
      await loadServerTable('vacancies');
      showToast('Вакансия сохранена.');
    }catch(error){
      if(/уже существует/.test(error.message))setVacancyNameError(error.message);
      throw error;
    }
  }).catch(()=>{});
}

async function deleteVacancyUi(id,button){
  if(!id)return;
  const vacancy=state.vacancies.find(x=>String(x['Vacancy ID'])===String(id));
  const ok=await showConfirm(
    'Удалить вакансию «'+(vacancy?vacancy['Вакансия']:'')+'» вместе с её шаблонами? Записи останутся в базе как удалённые.',
    'Удаление вакансии'
  );
  if(!ok)return;

  await runUiTask({button,label:'Удаление…'},async()=>{
    await rpc('deleteVacancy',id);
    state.vacancies=state.vacancies.filter(v=>String(v['Vacancy ID'])!==String(id));
    state.interviewTemplates=state.interviewTemplates.filter(t=>String(t['Vacancy ID'])!==String(id));
    if(String(value('vacancyId'))===String(id))resetVacancyForm();
    populateGlobalFilters();
    await loadServerTable('vacancies');
    showToast('Вакансия удалена.');
  }).catch(()=>{});
}

// ---------- Шаблоны интервью ----------

function renderTemplateStageOptions(selected){
  if(!el('templateStage'))return;
  const current=selected!==undefined?selected:value('templateStage');
  el('templateStage').innerHTML=option('','Выберите этап')+
    (state.pipelineStatuses||[]).map(status=>option(status,status,status===current)).join('');
}

function vacancyTemplates(vacancyId){
  const order=state.pipelineStatuses||[];
  return state.interviewTemplates
    .filter(t=>String(t['Vacancy ID'])===String(vacancyId))
    .sort((a,b)=>order.indexOf(a['Этап'])-order.indexOf(b['Этап'])||(a['№']||0)-(b['№']||0));
}

function renderVacancyTemplatesForSelected(){
  const vacancyId=value('vacancyId');
  const list=el('vacancyTemplateList');
  const empty=el('vacancyTemplateEmpty');

  el('templateAddButton').disabled=!vacancyId;

  if(!vacancyId){
    empty.hidden=false;
    empty.textContent='Сначала сохраните или выберите вакансию.';
    list.innerHTML='';
    el('vacancyTemplateCount').textContent='0';
    return;
  }

  const templates=vacancyTemplates(vacancyId);
  el('vacancyTemplateCount').textContent=templates.length;
  empty.hidden=templates.length>0;
  empty.textContent='Шаблонов пока нет.';

  const selected=el('templateModal').classList.contains('open')?value('templateId'):'';

  list.innerHTML=templates.map(t=>
    '<div class="template-row'+(String(selected)===String(t['Template ID'])?' selected-template':'')+'" onclick="openTemplateModal(\''+escJs(t['Template ID'])+'\')">'+
      '<div class="template-row-main">'+
        '<strong>№'+escapeHtml(t['№']||'—')+' · '+escapeHtml(t['Название'])+'</strong>'+
        '<div class="chip-wrap">'+
          statusChip(t['Этап'],true)+
          (t.required?'<span class="mini-chip">Обязательный</span>':'')+
          '<span class="muted">'+(t.questions||[]).length+' вопр.</span>'+
        '</div>'+
      '</div>'+
      '<button class="icon-btn icon-btn-sm icon-btn-danger" data-tip="Удалить шаблон" aria-label="Удалить шаблон" onclick="event.stopPropagation();deleteTemplateUi(\''+escJs(t['Template ID'])+'\',this)">'+icon('trash','icon-sm')+'</button>'+
    '</div>'
  ).join('');
}

function answerChip(answer){
  return '<span class="answer-chip" data-value="'+escapeHtml(answer)+'">'+
    '<span>'+escapeHtml(answer)+'</span>'+
    '<button class="icon-btn icon-btn-sm" type="button" data-tip="Убрать ответ" aria-label="Убрать ответ" onclick="this.parentElement.remove()">'+icon('close','icon-sm')+'</button>'+
  '</span>';
}

function questionBlock(question){
  const item=typeof question==='string'?{text:question,answers:[]}:(question||{text:'',answers:[]});
  return '<div class="question-block">'+
    '<div class="question-editor-row">'+
      '<span class="question-number"></span>'+
      '<input class="template-question" placeholder="Текст вопроса" value="'+escapeHtml(item.text||'')+'">'+
      '<button class="icon-btn icon-btn-sm icon-btn-danger" type="button" data-tip="Удалить вопрос" aria-label="Удалить вопрос" onclick="this.closest(\'.question-block\').remove();renumberTemplateQuestions()">'+icon('trash','icon-sm')+'</button>'+
    '</div>'+
    '<div class="answer-editor">'+
      '<div class="answer-chips">'+(item.answers||[]).map(answerChip).join('')+'</div>'+
      '<div class="answer-add">'+
        '<input class="answer-add-input" placeholder="Вероятный ответ — Enter, чтобы добавить" onkeydown="if(event.key===\'Enter\'){event.preventDefault();addAnswerChip(this)}">'+
        '<button class="icon-btn icon-btn-sm" type="button" data-tip="Добавить вероятный ответ" aria-label="Добавить вероятный ответ" onclick="addAnswerChip(this.previousElementSibling)">'+icon('plus','icon-sm')+'</button>'+
      '</div>'+
    '</div>'+
  '</div>';
}

function addAnswerChip(input){
  const answer=input.value.trim();
  if(!answer)return;
  const chips=input.closest('.answer-editor').querySelector('.answer-chips');
  const exists=[...chips.querySelectorAll('.answer-chip')].some(chip=>chip.dataset.value.toLowerCase()===answer.toLowerCase());
  if(!exists)chips.insertAdjacentHTML('beforeend',answerChip(answer));
  input.value='';
  input.focus();
}

function addTemplateQuestion(question){
  el('templateQuestionsList').insertAdjacentHTML('beforeend',questionBlock(question||{text:'',answers:[]}));
  renumberTemplateQuestions();
  if(!question){
    const inputs=el('templateQuestionsList').querySelectorAll('.template-question');
    inputs[inputs.length-1].focus();
  }
}

function renumberTemplateQuestions(){
  el('templateQuestionsList').querySelectorAll('.question-block').forEach((block,index)=>{
    block.querySelector('.question-number').textContent=(index+1)+'.';
  });
}

function collectTemplateQuestions(){
  return [...el('templateQuestionsList').querySelectorAll('.question-block')].map(block=>{
    // Невнесённый в список ответ из поля ввода тоже сохраняется.
    const pending=block.querySelector('.answer-add-input').value.trim();
    const answers=[...block.querySelectorAll('.answer-chip')].map(chip=>chip.dataset.value);
    if(pending&&!answers.includes(pending))answers.push(pending);
    return {text:block.querySelector('.template-question').value.trim(),answers};
  }).filter(question=>question.text);
}

function openTemplateModal(id){
  const vacancyId=value('vacancyId');
  if(!vacancyId)return;

  const template=id?state.interviewTemplates.find(x=>String(x['Template ID'])===String(id)):null;
  const vacancy=state.vacancies.find(v=>String(v['Vacancy ID'])===String(vacancyId));

  el('templateId').value=template?template['Template ID']:'';
  el('templateName').value=template?template['Название']||'':'';
  el('templateRequired').checked=!!(template&&template.required);
  renderTemplateStageOptions(template?template['Этап']:'');
  el('templateModalTitle').textContent=template?'№'+(template['№']||'—')+' · '+template['Название']:'Новый шаблон';
  el('templateModalVacancy').textContent=vacancy?'Вакансия: '+vacancy['Вакансия']:'';
  el('templateDeleteButton').hidden=!template;

  el('templateQuestionsList').innerHTML='';
  const questions=template?template.questions||[]:[];
  if(questions.length)questions.forEach(question=>addTemplateQuestion(question));
  else addTemplateQuestion({text:'',answers:[]});

  el('templateModal').classList.add('open');
  renderVacancyTemplatesForSelected();
  el('templateName').focus();
}

function closeTemplateModal(){
  el('templateModal').classList.remove('open');
  renderVacancyTemplatesForSelected();
}

async function saveTemplateForm(button){
  const vacancyId=value('vacancyId');
  const name=value('templateName').trim();
  const stage=value('templateStage');
  const required=el('templateRequired').checked;
  const questions=collectTemplateQuestions();

  if(!vacancyId){showToast('Сначала сохраните вакансию.','error');return}
  if(!name){showToast('Укажите название шаблона.','error');return}
  if(!stage){showToast('Выберите этап.','error');return}
  if(!questions.length){showToast('Добавьте хотя бы один вопрос.','error');return}

  await runUiTask({button,formId:'templateForm',label:'Сохранение…'},async()=>{
    const {template}=await rpc('saveInterviewTemplate',{id:value('templateId'),name,vacancyId,stage,required,questions});
    upsertById(state.interviewTemplates,'Template ID',template);
    closeTemplateModal();
    await loadServerTable('vacancies');
    showToast('Шаблон интервью сохранён.');
  }).catch(()=>{});
}

async function deleteTemplateUi(id,button){
  if(!id)return;
  const template=state.interviewTemplates.find(x=>String(x['Template ID'])===String(id));
  const ok=await showConfirm('Удалить шаблон «'+(template?template['Название']:'')+'»?','Удаление шаблона');
  if(!ok)return;

  await runUiTask({button,label:'Удаление…'},async()=>{
    await rpc('deleteInterviewTemplate',id);
    state.interviewTemplates=state.interviewTemplates.filter(t=>String(t['Template ID'])!==String(id));
    if(String(value('templateId'))===String(id))closeTemplateModal();
    renderVacancyTemplatesForSelected();
    await loadServerTable('vacancies');
    showToast('Шаблон удалён.');
  }).catch(()=>{});
}

// ---------- Источники ----------

function renderSourceFormIcon(){
  const node=el('sourceFormIcon');
  if(!node)return;
  const brand=sourceBrand(value('sourceName'));
  node.className='brand-icon brand-'+brand.key;
  node.textContent=brand.text;
}

function resetSourceForm(){
  el('sourceId').value='';
  el('sourceName').value='';
  el('sourceFormTitle').textContent='Новый источник';
  el('sourceDeleteButton').hidden=true;
  renderSourceFormIcon();
  rerenderServerTable('sources');
  el('sourceName').focus();
}

function editSource(id,item){
  const source=item||state.sources.find(x=>String(x['Source ID'])===String(id));
  if(!source)return;

  el('sourceId').value=id;
  el('sourceName').value=source['Название']||'';
  el('sourceFormTitle').textContent='№'+(source['№']||'—')+' · '+source['Название'];
  el('sourceDeleteButton').hidden=false;
  renderSourceFormIcon();
  rerenderServerTable('sources');
}

async function saveSourceForm(button){
  const name=value('sourceName').trim();
  if(!name){showToast('Укажите название источника.','error');return}

  await runUiTask({button,formId:'sourceForm',label:'Сохранение…'},async()=>{
    const {source}=await rpc('saveSource',{id:value('sourceId'),name});
    upsertById(state.sources,'Source ID',source);
    editSource(source['Source ID'],source);
    populateGlobalFilters();
    await loadServerTable('sources');
    showToast('Источник сохранён.');
  }).catch(()=>{});
}

async function deleteSourceUi(id,button){
  if(!id)return;
  const source=state.sources.find(x=>String(x['Source ID'])===String(id));
  const ok=await showConfirm('Удалить источник «'+(source?source['Название']:'')+'»?','Удаление источника');
  if(!ok)return;

  await runUiTask({button,label:'Удаление…'},async()=>{
    await rpc('deleteSource',id);
    state.sources=state.sources.filter(s=>String(s['Source ID'])!==String(id));
    if(String(value('sourceId'))===String(id))resetSourceForm();
    populateGlobalFilters();
    await loadServerTable('sources');
    showToast('Источник удалён.');
  }).catch(()=>{});
}

// ---------- Ответственные ----------

function renderResponsibleStageOptions(selected){
  if(!el('responsibleStages'))return;
  const current=selected!==undefined
    ? selected
    : [...document.querySelectorAll('.responsible-stage:checked')].map(x=>x.value);

  el('responsibleStages').innerHTML=(state.pipelineStatuses||[]).map(stage=>
    '<label class="stage-check checkbox-line status-soft-'+statusKey(stage)+'">'+
      '<input type="checkbox" class="responsible-stage" value="'+escapeHtml(stage)+'" '+(current.includes(stage)?'checked':'')+'>'+
      '<span>'+escapeHtml(stage)+'</span>'+
    '</label>'
  ).join('');
}

function userDisplayName(user){
  if(!user)return '—';
  const name=user['ФИО']||user.Email||'Пользователь';
  return user.Email&&user.Email!==name?name+' · '+user.Email:name;
}

function renderResponsibleUserOptions(selected){
  const select=el('responsibleUserId');
  if(!select)return;
  const current=selected!==undefined?String(selected||''):String(select.value||'');
  select.innerHTML=option('','Не привязан',!current)+
    (state.users||[]).map(user=>option(user['User ID'],userDisplayName(user),String(user['User ID'])===current)).join('');
}

function resetResponsibleForm(){
  el('responsibleId').value='';
  el('responsibleLastName').value='';
  el('responsibleFirstName').value='';
  el('responsibleMiddleName').value='';
  el('responsibleEmail').value='';
  el('responsibleFormTitle').textContent='Новый ответственный';
  el('responsibleDeleteButton').hidden=true;
  renderResponsibleUserOptions('');
  renderResponsibleStageOptions([]);
  rerenderServerTable('responsibles');
  el('responsibleLastName').focus();
}

function editResponsible(id,item){
  const responsible=item||state.responsibles.find(x=>String(x['Responsible ID'])===String(id));
  if(!responsible)return;

  el('responsibleId').value=id;
  el('responsibleLastName').value=responsible['Фамилия']||'';
  el('responsibleFirstName').value=responsible['Имя']||'';
  el('responsibleMiddleName').value=responsible['Отчество']||'';
  el('responsibleEmail').value=responsible['Email']||'';
  el('responsibleFormTitle').textContent='№'+(responsible['№']||'—')+' · '+fullNameOf(responsible);
  el('responsibleDeleteButton').hidden=false;
  renderResponsibleUserOptions(responsible['User ID']||'');
  renderResponsibleStageOptions(responsible.stages||[]);
  rerenderServerTable('responsibles');
}

async function saveResponsibleForm(button){
  const lastName=value('responsibleLastName').trim();
  const firstName=value('responsibleFirstName').trim();
  const middleName=value('responsibleMiddleName').trim();
  const stages=[...document.querySelectorAll('.responsible-stage:checked')].map(x=>x.value);

  if(!lastName||!firstName){showToast('Фамилия и имя обязательны.','error');return}
  if(!stages.length){showToast('Выберите хотя бы один этап.','error');return}
  if(!validateEmailField(el('responsibleEmail')))return;

  await runUiTask({button,formId:'responsibleForm',label:'Сохранение…'},async()=>{
    const {responsible}=await rpc('saveResponsible',{
      id:value('responsibleId'),
      lastName,
      firstName,
      middleName,
      email:value('responsibleEmail'),
      userId:value('responsibleUserId'),
      stages
    });
    upsertById(state.responsibles,'Responsible ID',responsible);
    editResponsible(responsible['Responsible ID'],responsible);
    populateGlobalFilters();
    await loadServerTable('responsibles');
    showToast('Ответственный сохранён.');
  }).catch(()=>{});
}

async function deleteResponsibleUi(id,button){
  if(!id)return;
  const responsible=state.responsibles.find(x=>String(x['Responsible ID'])===String(id));
  const ok=await showConfirm('Удалить ответственного «'+(responsible?fullNameOf(responsible):'')+'»?','Удаление ответственного');
  if(!ok)return;

  await runUiTask({button,label:'Удаление…'},async()=>{
    await rpc('deleteResponsible',id);
    state.responsibles=state.responsibles.filter(r=>String(r['Responsible ID'])!==String(id));
    if(String(value('responsibleId'))===String(id))resetResponsibleForm();
    populateGlobalFilters();
    await loadServerTable('responsibles');
    showToast('Ответственный удалён.');
  }).catch(()=>{});
}
</script>
