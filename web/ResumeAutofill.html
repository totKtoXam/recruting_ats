<style>
/* ---------- Автозаполнение карточки кандидата из резюме ---------- */
.resume-fill-wrap{position:relative;flex:0 0 auto}
.resume-fill-btn{
  background:var(--primary-soft);color:var(--primary);border:1px solid var(--primary-border);
  font-weight:600;white-space:nowrap
}
.resume-fill-btn:hover:not(:disabled){background:var(--primary-tint-2);color:var(--primary-strong)}
.resume-fill-btn.is-attention{animation:resume-fill-pulse 1.6s ease-out 2}
@keyframes resume-fill-pulse{
  0%{box-shadow:0 0 0 0 var(--primary-ring)}
  70%{box-shadow:0 0 0 8px transparent}
  100%{box-shadow:0 0 0 0 transparent}
}
.resume-fill-hint{
  position:absolute;right:0;top:calc(100% + 8px);z-index:5;width:min(280px,80vw);
  padding:8px 10px;border-radius:var(--radius);background:var(--text);color:var(--surface);
  font-size:12px;line-height:1.45;box-shadow:var(--shadow-2,0 6px 20px rgba(0,0,0,.18));
  animation:resume-hint-in .25s ease-out;transition:opacity .6s ease,transform .6s ease
}
.resume-fill-hint::before{content:"";position:absolute;right:18px;top:-5px;width:10px;height:10px;background:inherit;transform:rotate(45deg)}
.resume-fill-hint.is-leaving{opacity:0;transform:translateY(-4px)}
@keyframes resume-hint-in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .resume-fill-btn.is-attention{animation:none;box-shadow:0 0 0 3px var(--primary-ring)}
  .resume-fill-hint{animation:none;transition:none}
}

.file-drop.is-dragover{border-color:var(--primary);border-style:solid;background:var(--primary-tint-2);color:var(--primary)}
.candidate-panel{position:relative}
.resume-drop-overlay{
  position:absolute;inset:0;z-index:30;padding:16px;pointer-events:none;
  background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(2px);
  display:flex;align-items:center;justify-content:center;border-radius:inherit
}
.resume-drop-overlay[hidden]{display:none}
.resume-drop-overlay-box{
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;
  width:100%;height:100%;border:2px dashed var(--primary);border-radius:var(--radius);
  background:var(--primary-tint);color:var(--primary);justify-content:center
}
.resume-drop-overlay-box .icon{width:36px;height:36px}
.resume-drop-overlay-box strong{font-size:16px}
.resume-drop-overlay-box small{font-size:13px;color:var(--text-2)}
.file-drop.is-dragover strong{color:var(--primary)}

/* Подставленные значения помечены цветом, пока пользователь их не тронет. */
#candidateWorkspace :is(input,select).is-autofilled{background:var(--primary-tint);border-color:var(--primary-border)}
#candidateWorkspace :is(input,select).is-autofilled-check{background:var(--warning-tint);border-color:var(--warning)}

.autofill-panel{
  margin-bottom:12px;padding:10px 12px;border:1px solid var(--primary-border);border-left-width:3px;
  border-radius:var(--radius);background:var(--surface);font-size:13px;display:flex;flex-direction:column;gap:8px
}
.autofill-panel.is-error{border-color:var(--danger);background:var(--danger-tint)}
.autofill-panel.is-loading{border-style:dashed}
.autofill-head{display:flex;align-items:center;gap:8px}
.autofill-head .icon{width:16px;height:16px;color:var(--primary);flex:0 0 auto}
.autofill-head strong{font-weight:600}
.autofill-title{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.autofill-title small{font-size:12px}
.autofill-head .header-actions{margin-left:auto;flex:0 0 auto}
.autofill-block{display:flex;flex-direction:column;gap:4px}
.autofill-block-title{font-size:11px;text-transform:uppercase;letter-spacing:.05em;font-weight:700;color:var(--muted)}
.autofill-row{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap}
.autofill-row>span{flex:1 1 200px;min-width:0;overflow-wrap:anywhere}
.autofill-row small{display:block;color:var(--muted);font-size:12px}
.autofill-row .text-btn{flex:0 0 auto;padding:2px 8px;font-size:12px}
.autofill-dup{
  padding:8px 10px;border-radius:var(--radius);background:var(--danger-tint);border:1px solid var(--danger-soft);
  display:flex;flex-direction:column;gap:4px
}
.autofill-dup .icon{width:15px;height:15px;color:var(--danger);vertical-align:-3px;margin-right:4px}
.autofill-dup a{font-weight:600}
.autofill-warn{color:var(--warning);display:flex;gap:6px;align-items:flex-start}
.autofill-warn .icon{width:15px;height:15px;flex:0 0 auto;margin-top:1px}
.autofill-event-bad{color:var(--danger)}
.autofill-panel details summary{cursor:pointer;color:var(--text-2);font-size:12px}
.autofill-summary-list{margin:4px 0 0;padding-left:18px;color:var(--text-2);font-size:12px}
.autofill-foot{color:var(--muted);font-size:12px}
.autofill-legend{display:inline-block;width:10px;height:10px;border-radius:2px;vertical-align:-1px;margin:0 2px 0 6px;border:1px solid var(--primary-border);background:var(--primary-tint)}
.autofill-legend.check{border-color:var(--warning);background:var(--warning-tint)}

/* Похожие кандидаты: жёлтый — похожее ФИО, красный — совпали контакты. */
.similar-panel{
  padding:8px 10px;border-radius:var(--radius);border:1px solid var(--warning);background:var(--warning-tint);
  font-size:13px;display:flex;flex-direction:column;gap:4px
}
.similar-panel.is-exact{border-color:var(--danger-soft);background:var(--danger-tint)}
.similar-panel .similar-title{display:flex;align-items:center;gap:6px;font-weight:600}
.similar-panel .similar-title .icon{width:15px;height:15px;flex:0 0 auto;color:var(--warning)}
.similar-panel.is-exact .similar-title .icon{color:var(--danger)}
.similar-row{display:flex;gap:6px;flex-wrap:wrap;align-items:baseline}
.similar-row a{font-weight:600}
.similar-row small{color:var(--muted)}
</style>

<script>
// ---------- Автозаполнение карточки нового кандидата из резюме ----------
// Файл разбирает сервер (rpc parseResume). Подставляются только пустые поля; всё подставленное
// помечено цветом и отменяется одной кнопкой. Ручной ввод никогда не перезаписывается.

const AUTOFILL_INPUTS={
  lastName:'candidateLastName',firstName:'candidateFirstName',middleName:'candidateMiddleName',
  phone:'candidatePhone',email:'candidateEmail',telegram:'candidateTelegram',
  github:'candidateGithub',linkedin:'candidateLinkedin',salary:'candidateSalary'
};
const AUTOFILL_LABELS={
  lastName:'Фамилия',firstName:'Имя',middleName:'Отчество',phone:'Телефон',email:'Email',telegram:'Telegram',
  github:'GitHub',linkedin:'LinkedIn',salary:'ЗП ожидания',name:'ФИО',vacancy:'Вакансия',source:'Источник'
};
const RESUME_EXTENSIONS=['pdf','doc','docx'];

const autofill={busy:false,result:null,applied:[],addedLinks:[],hintTimer:null,dragDepth:0};

function isFieldEmpty(input){
  const v=String(input.value||'').trim();
  return !v||(input.id==='candidatePhone'&&v.replace(/\D/g,'').length<=1);
}

// Показывает кнопку и исчезающую подсказку для нового кандидата; для существующего — скрывает всё.
function resetResumeAutofill(isNew){
  const wrap=el('resumeFillWrap');
  if(!wrap)return;
  clearTimeout(autofill.hintTimer);
  autofill.result=null;autofill.applied=[];autofill.addedLinks=[];autofill.busy=false;
  document.querySelectorAll('#candidateWorkspace .is-autofilled,#candidateWorkspace .is-autofilled-check').forEach(node=>{
    node.classList.remove('is-autofilled','is-autofilled-check');node.removeAttribute('title');
  });
  el('resumeAutofillPanel').hidden=true;
  el('resumeAutofillPanel').innerHTML='';
  el('resumeAutofillPanel').className='autofill-panel';
  if(el('resumeDropOverlay'))hideDropOverlay();
  clearTimeout(similar.timer);
  similar.enabled=isNew;similar.lastKey='';
  renderSimilarCandidates([]);
  wrap.hidden=!isNew;
  const hint=el('resumeFillHint');
  const button=el('resumeFillButton');
  hint.hidden=true;hint.classList.remove('is-leaving');
  button.classList.remove('is-attention');
  if(!isNew)return;
  // Подсказка появляется при каждом открытии формы и сама исчезает.
  setTimeout(()=>{if(!wrap.hidden){button.classList.add('is-attention');hint.hidden=false;}},50);
  autofill.hintTimer=setTimeout(()=>{
    hint.classList.add('is-leaving');
    autofill.hintTimer=setTimeout(()=>{hint.hidden=true;hint.classList.remove('is-leaving');},700);
  },6000);
}

function hideResumeHint(){
  clearTimeout(autofill.hintTimer);
  const hint=el('resumeFillHint');
  if(hint){hint.hidden=true;hint.classList.remove('is-leaving');}
  el('resumeFillButton')?.classList.remove('is-attention');
}

function chooseResumeForAutofill(){
  hideResumeHint();
  el('candidateResumeFile').click();
}

// Выбор файла в поле «Резюме»: показать файл и, для нового кандидата, разобрать его.
function onResumeFileChange(){
  renderSelectedResumeFile();
  const file=el('candidateResumeFile').files[0];
  if(!file)return;
  hideResumeHint();
  if(!value('candidateId')&&!el('resumeFillWrap').hidden)autofillFromResume(file);
}

function resumeDragOver(event){
  if(!event.dataTransfer||![...event.dataTransfer.types].includes('Files'))return;
  event.preventDefault();
  event.dataTransfer.dropEffect='copy';
  el('resumeDropZone').classList.add('is-dragover');
}
function resumeDragLeave(event){
  if(event.currentTarget.contains(event.relatedTarget))return;
  el('resumeDropZone').classList.remove('is-dragover');
}
function resumeDrop(event){
  event.preventDefault();
  el('resumeDropZone').classList.remove('is-dragover');
  acceptDroppedResume(event.dataTransfer&&event.dataTransfer.files[0]);
}

// Принимает брошенный файл как резюме: проверка формата и размера, затем как выбор в поле.
function acceptDroppedResume(file){
  if(!file||el('candidateModal').classList.contains('is-readonly'))return;
  const extension=file.name.includes('.')?file.name.split('.').pop().toLowerCase():'';
  if(!RESUME_EXTENSIONS.includes(extension)){showToast('Допустимые форматы резюме: PDF, DOC, DOCX.','error');return}
  if(file.size>10*1024*1024){showToast('Резюме не должно превышать 10 МБ.','error');return}
  const transfer=new DataTransfer();
  transfer.items.add(file);
  el('candidateResumeFile').files=transfer.files;
  onResumeFileChange();
}

// Файл можно бросить в любое место карточки: над ней появляется оверлей.
// Счётчик dragenter/dragleave нужен, потому что события приходят от каждого вложенного элемента.
const dropOverlay={depth:0};
function draggingFiles(event){return !!(event.dataTransfer&&[...event.dataTransfer.types].includes('Files'))}
function showDropOverlay(){
  const overlay=el('resumeDropOverlay');
  const isNew=!value('candidateId')&&!el('resumeFillWrap').hidden;
  el('resumeDropOverlayTitle').textContent=isNew?'Отпустите резюме здесь':'Отпустите, чтобы добавить новую версию резюме';
  el('resumeDropOverlayText').textContent=isNew?'ФИО и контакты заполнятся автоматически':'Файл будет загружен при сохранении карточки';
  overlay.hidden=false;
}
function hideDropOverlay(){dropOverlay.depth=0;el('resumeDropOverlay').hidden=true;el('resumeDropZone').classList.remove('is-dragover');}
function bindCandidateDrop(){
  const panel=document.querySelector('#candidateModal .candidate-panel');
  if(!panel)return;
  panel.addEventListener('dragenter',event=>{
    if(!draggingFiles(event)||el('candidateModal').classList.contains('is-readonly'))return;
    event.preventDefault();
    dropOverlay.depth++;
    if(el('resumeDropOverlay').hidden)showDropOverlay();
  });
  panel.addEventListener('dragover',event=>{
    if(!draggingFiles(event)||el('candidateModal').classList.contains('is-readonly'))return;
    event.preventDefault();
    event.dataTransfer.dropEffect='copy';
  });
  panel.addEventListener('dragleave',()=>{
    if(!dropOverlay.depth)return;
    dropOverlay.depth--;
    if(dropOverlay.depth<=0)hideDropOverlay();
  });
  panel.addEventListener('drop',event=>{
    const handledByZone=event.defaultPrevented;
    hideDropOverlay();
    if(handledByZone||!draggingFiles(event))return;
    event.preventDefault();
    acceptDroppedResume(event.dataTransfer.files[0]);
  });
}
document.addEventListener('DOMContentLoaded',bindCandidateDrop);
// Пока открыта карточка, файл, брошенный мимо неё, не должен открываться браузером вместо приложения.
document.addEventListener('dragover',event=>{
  if(el('candidateModal')?.classList.contains('open')&&draggingFiles(event))event.preventDefault();
});
document.addEventListener('drop',event=>{
  if(el('candidateModal')?.classList.contains('open')&&!event.defaultPrevented)event.preventDefault();
});

function fileToUpload(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,mimeType:file.type,base64:String(reader.result).split(',')[1]});
    reader.onerror=()=>reject(new Error('Не удалось прочитать файл.'));
    reader.readAsDataURL(file);
  });
}

async function autofillFromResume(file){
  if(autofill.busy)return;
  autofill.busy=true;
  undoResumeAutofill(true);
  renderAutofillPanel({loading:true,fileName:file.name});
  try{
    const upload=await fileToUpload(file);
    const result=await rpc('parseResume',upload);
    autofill.result=result;
    if(result.status!=='ok'){renderAutofillPanel({error:result.message,fileName:file.name});return}
    const filled=applyAutofill(result);
    renderAutofillPanel({result,filled});
  }catch(error){
    renderAutofillPanel({error:error&&error.message?error.message:String(error),fileName:file.name});
  }finally{
    autofill.busy=false;
  }
}
// Подставляет уверенные значения в пустые поля, возвращает число заполненных.
function applyAutofill(result){
  let filled=0;
  const mark=(node,confidence,source,restore)=>{
    node.classList.add(confidence==='high'?'is-autofilled':'is-autofilled-check');
    node.title=(confidence==='high'?'Из резюме':'Из резюме — проверьте')+(source?': «'+source+'»':'');
    autofill.applied.push(restore);
    const clear=()=>{node.classList.remove('is-autofilled','is-autofilled-check');node.removeAttribute('title');};
    node.addEventListener('input',clear,{once:true});
    node.addEventListener('change',clear,{once:true});
    filled++;
  };

  for(const [name,id] of Object.entries(AUTOFILL_INPUTS)){
    const item=result.fields[name];
    const input=el(id);
    if(!item||!input||!isFieldEmpty(input))continue;
    const previous=input.value;
    input.value=item.value;
    if(id==='candidatePhone')maskKzPhone(input);
    if(id==='candidateEmail')normalizeEmailInput(input);
    if(id==='candidateSalary')formatMoneyInput(input,10000000);
    mark(input,item.confidence,item.source,()=>{input.value=previous;if(id==='candidateEmail')input.classList.remove('input-error');});
  }

  // Вакансия и источник подставляются только при точном совпадении; иначе — подсказкой в панели.
  for(const [name,id] of [['vacancy','candidateVacancy'],['source','candidateSource']]){
    const hint=result.hints&&result.hints[name];
    const select=el(id);
    if(!hint||hint.confidence!=='high'||!select||select.value)continue;
    if(![...select.options].some(option=>option.value===String(hint.id)))continue;
    select.value=String(hint.id);
    mark(select,'high',hint.reason,()=>{select.value='';});
  }

  // Ссылки на профили (hh, GitLab, Stack Overflow…) — новыми строками в «Иные ссылки».
  const existing=new Set(collectLinks().map(link=>link.url.toLowerCase()));
  for(const link of result.links||[]){
    if(existing.has(link.url.toLowerCase()))continue;
    const root=el('candidateLinks');
    root.insertAdjacentHTML('beforeend',linkRow(link.name,link.url));
    const row=root.lastElementChild;
    row.querySelectorAll('input').forEach(input=>{input.classList.add('is-autofilled');input.title='Из резюме';});
    autofill.addedLinks.push(row);
    filled++;
  }

  renderSocialPreviews();
  renderCandidateSourceIcon();
  UiKit.clearFieldErrors('candidateWorkspace');
  if(result.duplicates&&result.duplicates.length)renderSimilarCandidates(result.duplicates);
  else checkSimilarCandidates();
  return filled;
}

// Возвращает поля к состоянию до автозаполнения. silent — при повторном разборе, без сообщения.
function undoResumeAutofill(silent){
  const had=autofill.applied.length||autofill.addedLinks.length;
  autofill.applied.forEach(restore=>restore());
  autofill.addedLinks.forEach(row=>row.remove());
  autofill.applied=[];autofill.addedLinks=[];
  document.querySelectorAll('#candidateWorkspace .is-autofilled,#candidateWorkspace .is-autofilled-check').forEach(node=>{
    node.classList.remove('is-autofilled','is-autofilled-check');node.removeAttribute('title');
  });
  renderSocialPreviews();
  renderCandidateSourceIcon();
  if(silent)return;
  el('resumeAutofillPanel').hidden=true;
  if(had)showToast('Автозаполнение отменено. Файл резюме остался выбранным.');
}

function hideAutofillPanel(){el('resumeAutofillPanel').hidden=true}

function applySuggestion(index){
  const suggestion=autofill.result&&autofill.result.suggestions[index];
  if(!suggestion)return;
  const set=(id,value)=>{
    const input=el(id);
    const previous=input.value;
    input.value=value;
    if(id==='candidatePhone')maskKzPhone(input);
    if(id==='candidateEmail')normalizeEmailInput(input);
    if(id==='candidateSalary')formatMoneyInput(input,10000000);
    input.classList.add('is-autofilled-check');
    input.title='Из резюме — проверьте';
    autofill.applied.push(()=>{input.value=previous;});
    const clear=()=>{input.classList.remove('is-autofilled','is-autofilled-check');input.removeAttribute('title');};
    input.addEventListener('input',clear,{once:true});
  };
  if(suggestion.field==='name'){
    set('candidateLastName',suggestion.value.lastName||'');
    set('candidateFirstName',suggestion.value.firstName||'');
    set('candidateMiddleName',suggestion.value.middleName||'');
  }else if(suggestion.field==='vacancy'||suggestion.field==='source'){
    const select=el(suggestion.field==='vacancy'?'candidateVacancy':'candidateSource');
    const previous=select.value;
    select.value=String(suggestion.value);
    select.classList.add('is-autofilled-check');
    autofill.applied.push(()=>{select.value=previous;});
    select.addEventListener('change',()=>select.classList.remove('is-autofilled-check'),{once:true});
  }else{
    set(AUTOFILL_INPUTS[suggestion.field],suggestion.value);
  }
  renderSocialPreviews();
  renderCandidateSourceIcon();
  checkSimilarCandidates();
  const chip=document.querySelector('#resumeAutofillPanel [data-suggestion="'+index+'"]');
  if(chip)chip.replaceWith(Object.assign(document.createElement('span'),{className:'state-badge state-ok',textContent:'Подставлено'}));
}

// Добавляет текст в поле «Комментарий» (первый комментарий нового кандидата).
function appendToCandidateComment(text){
  const current=value('candidateComment');
  setRich('candidateComment',current+textToRichHtml(text));
  showToast('Добавлено в комментарий.');
}
function appendAutofillSummary(){
  const result=autofill.result;
  if(!result)return;
  appendToCandidateComment('Из резюме ('+result.formatLabel+'):\n'+result.summary.map(line=>'• '+line).join('\n'));
}
function appendHhEvent(index){
  const event=autofill.result&&autofill.result.hh&&autofill.result.hh.events[index];
  if(event)appendToCandidateComment('hh: '+hhEventText(event));
}
function appendHhComment(index){
  const comment=autofill.result&&autofill.result.hh&&autofill.result.hh.comments[index];
  if(comment)appendToCandidateComment('Комментарий из hh'+(comment.author?' ('+comment.author+(comment.date?', '+comment.date:'')+')':comment.date?' ('+comment.date+')':'')+': '+comment.text);
}
function appendHhCover(){
  const cover=autofill.result&&autofill.result.hh&&autofill.result.hh.coverLetter;
  if(cover)appendToCandidateComment('Сопроводительное письмо из hh:\n'+cover);
}
function hhEventText(event){
  const kind=/^Отклик/.test(event.kind)?'отклик на вакансию':/отказ/i.test(event.kind)?'получил отказ по вакансии':event.kind.toLowerCase();
  return kind+' «'+event.vacancy+'»'+(event.date?' — '+event.date:'');
}

function renderAutofillPanel({loading,error,result,filled,fileName}){
  const panel=el('resumeAutofillPanel');
  panel.hidden=false;
  panel.className='autofill-panel'+(loading?' is-loading':error?' is-error':'');
  const closeBtn=iconBtn('close','Скрыть','hideAutofillPanel()','icon-btn-sm');

  if(loading){
    panel.innerHTML='<div class="autofill-head"><span class="spinner spinner-dark"></span><strong>Распознаём резюме…</strong><span class="muted">'+escapeHtml(fileName||'')+'</span></div>';
    return;
  }
  if(error){
    panel.innerHTML='<div class="autofill-head">'+icon('alert')+'<strong>Автозаполнение не выполнено</strong><span class="header-actions">'+closeBtn+'</span></div>'+
      '<div>'+escapeHtml(error)+'</div><div class="autofill-foot">Файл остался выбранным как резюме — карточку можно заполнить вручную.</div>';
    return;
  }

  const parts=[];
  const fieldNames=Object.keys(result.fields).filter(name=>el(AUTOFILL_INPUTS[name])&&el(AUTOFILL_INPUTS[name]).classList.contains('is-autofilled')||el(AUTOFILL_INPUTS[name])&&el(AUTOFILL_INPUTS[name]).classList.contains('is-autofilled-check')).map(name=>AUTOFILL_LABELS[name]||name);
  if(el('candidateVacancy').classList.contains('is-autofilled'))fieldNames.push(AUTOFILL_LABELS.vacancy);
  if(el('candidateSource').classList.contains('is-autofilled'))fieldNames.push(AUTOFILL_LABELS.source);
  parts.push('<div class="autofill-head">'+icon('sparkles')+'<div class="autofill-title"><strong>'+(filled?'Заполнено из резюме: '+filled+' '+pluralRu(filled,'поле','поля','полей'):'Из резюме ничего не подставлено')+'</strong>'+
    '<small class="muted">Формат: '+escapeHtml(result.formatLabel)+'</small></div>'+
    '<span class="header-actions">'+(filled?'<button type="button" class="text-btn" onclick="undoResumeAutofill()">'+icon('reset','icon-sm')+' Отменить</button>':'')+closeBtn+'</span></div>');

  if(result.duplicates&&result.duplicates.length){
    parts.push('<div class="autofill-warn">'+icon('alert')+'<span>Похоже, такой кандидат уже есть — см. «Похожие кандидаты» под полями ФИО.</span></div>');
  }

  const badEvents=(result.hh&&result.hh.events||[]).filter(event=>/отказ/i.test(event.kind));
  for(const warning of [...result.warnings,...badEvents.map(event=>'По данным hh кандидат уже '+hhEventText(event)+'.')]){
    parts.push('<div class="autofill-warn">'+icon('alert')+'<span>'+escapeHtml(warning)+'</span></div>');
  }

  const chips=[];
  result.suggestions.forEach((suggestion,index)=>{
    chips.push('<div class="autofill-row"><span><strong>'+escapeHtml(AUTOFILL_LABELS[suggestion.field]||suggestion.field)+':</strong> '+escapeHtml(suggestion.label)+(suggestion.note?'<small>'+escapeHtml(suggestion.note)+'</small>':'')+'</span>'+
      '<button type="button" class="text-btn text-btn-primary" data-suggestion="'+index+'" onclick="applySuggestion('+index+')">Подставить</button></div>');
  });
  for(const name of ['vacancy','source']){
    const hint=result.hints&&result.hints[name];
    const select=el(name==='vacancy'?'candidateVacancy':'candidateSource');
    if(!hint||select.classList.contains('is-autofilled'))continue;
    const index=result.suggestions.push({field:name,value:hint.id,label:hint.name,note:hint.reason})-1;
    chips.push('<div class="autofill-row"><span><strong>'+AUTOFILL_LABELS[name]+':</strong> '+escapeHtml(hint.name)+'<small>'+escapeHtml(hint.reason)+'</small></span>'+
      '<button type="button" class="text-btn text-btn-primary" data-suggestion="'+index+'" onclick="applySuggestion('+index+')">Подставить</button></div>');
  }
  if(result.hints&&result.hints.vacancyText&&!(result.hints.vacancy)){
    chips.push('<div class="autofill-row"><span><strong>Вакансия в hh:</strong> «'+escapeHtml(result.hints.vacancyText)+'»<small>Среди открытых вакансий такой нет — выберите вручную</small></span></div>');
  }
  if(chips.length)parts.push('<div class="autofill-block"><div class="autofill-block-title">Проверьте и подставьте</div>'+chips.join('')+'</div>');

  if(result.hh){
    const rows=[];
    result.hh.events.forEach((event,index)=>{
      rows.push('<div class="autofill-row"><span'+(/отказ/i.test(event.kind)?' class="autofill-event-bad"':'')+'>'+escapeHtml(hhEventText(event))+'</span><button type="button" class="text-btn" onclick="appendHhEvent('+index+')">В комментарий</button></div>');
    });
    result.hh.comments.forEach((comment,index)=>{
      rows.push('<div class="autofill-row"><span>Комментарий рекрутера'+(comment.author?' ('+escapeHtml(comment.author)+')':'')+(comment.date?', '+escapeHtml(comment.date):'')+': «'+escapeHtml(comment.text)+'»</span><button type="button" class="text-btn" onclick="appendHhComment('+index+')">В комментарий</button></div>');
    });
    if(result.hh.coverLetter){
      rows.push('<div class="autofill-row"><span>Сопроводительное письмо: «'+escapeHtml(result.hh.coverLetter.slice(0,140))+(result.hh.coverLetter.length>140?'…':'')+'»</span><button type="button" class="text-btn" onclick="appendHhCover()">В комментарий</button></div>');
    }
    if(rows.length)parts.push('<div class="autofill-block"><div class="autofill-block-title">Из hh</div>'+rows.join('')+'</div>');
  }

  if(result.summary&&result.summary.length){
    parts.push('<details><summary>Кратко из резюме ('+result.summary.length+')</summary><ul class="autofill-summary-list">'+result.summary.map(line=>'<li>'+escapeHtml(line)+'</li>').join('')+'</ul>'+
      '<button type="button" class="text-btn" style="margin-top:4px" onclick="appendAutofillSummary()">'+icon('message','icon-sm')+' Добавить в комментарий</button></details>');
  }

  if(filled)parts.push('<div class="autofill-foot">Поля из резюме отмечены цветом: <span class="autofill-legend"></span>уверенно, <span class="autofill-legend check"></span>проверьте. Отметка снимается при правке.'+(fieldNames.length?' Заполнено: '+escapeHtml(fieldNames.join(', '))+'.':'')+'</div>');
  panel.innerHTML=parts.join('');
}

// ---------- Похожие кандидаты ----------
// Пока заполняется новая карточка, сервер ищет кандидатов с похожим ФИО (расстояние Дамерау — Левенштейна:
// опечатки, лишние пробелы, регистр, латиница/кириллица) и с теми же email, телефоном или Telegram.

const SIMILAR_INPUTS=['candidateLastName','candidateFirstName','candidateMiddleName','candidateEmail','candidatePhone','candidateTelegram'];
const similar={enabled:false,timer:null,lastKey:'',request:0};

function similarInput(){
  return {
    lastName:value('candidateLastName'),firstName:value('candidateFirstName'),middleName:value('candidateMiddleName'),
    email:value('candidateEmail'),phone:value('candidatePhone'),telegram:value('candidateTelegram')
  };
}

function scheduleSimilarCheck(){
  if(!similar.enabled)return;
  clearTimeout(similar.timer);
  similar.timer=setTimeout(checkSimilarCandidates,400);
}

async function checkSimilarCandidates(){
  if(!similar.enabled||value('candidateId'))return;
  const input=similarInput();
  const key=JSON.stringify(input);
  if(key===similar.lastKey)return;
  similar.lastKey=key;
  const request=++similar.request;
  try{
    const matches=await rpc('findSimilarCandidates',input);
    if(request===similar.request&&similar.enabled)renderSimilarCandidates(matches);
  }catch(error){
    // Поиск похожих — вспомогательный: ошибка не должна мешать заполнению.
    if(request===similar.request)renderSimilarCandidates([]);
  }
}

function renderSimilarCandidates(matches){
  const root=el('candidateSimilar');
  if(!root)return;
  if(!matches||!matches.length){root.hidden=true;root.innerHTML='';return}
  const exact=matches.some(match=>match.matchedBy.some(key=>key!=='name'));
  const stateLabel={active:'',archived:' · в архиве',deleted:' · в корзине'};
  const reason=match=>{
    const parts=[];
    if(match.matchedBy.includes('email'))parts.push('тот же email');
    if(match.matchedBy.includes('phone'))parts.push('тот же телефон');
    if(match.matchedBy.includes('telegram'))parts.push('тот же Telegram');
    if(match.matchedBy.includes('name'))parts.push(match.nameScore>=1?'такое же ФИО':'похожее ФИО ('+Math.round(match.nameScore*100)+'%)');
    return parts.join(', ');
  };
  root.className='similar-panel'+(exact?' is-exact':'');
  root.innerHTML='<div class="similar-title">'+icon('alert')+'<span>'+(exact?'Похоже, такой кандидат уже есть':'Похожие кандидаты — проверьте, не дубль ли это')+'</span></div>'+
    matches.map(match=>'<div class="similar-row"><span>№'+match.number+'</span><a href="#/candidate/'+encodeURIComponent(match.id)+'">'+escapeHtml(match.fullName)+'</a>'+
      '<span class="muted">— '+escapeHtml(match.vacancy)+' · '+escapeHtml(match.status)+escapeHtml(stateLabel[match.state]||'')+'</span><small>'+escapeHtml(reason(match))+'</small></div>').join('');
  root.hidden=false;
}

document.addEventListener('DOMContentLoaded',()=>{
  SIMILAR_INPUTS.forEach(id=>{const input=el(id);if(input)input.addEventListener('input',scheduleSimilarCheck);});
});

function pluralRu(n,one,few,many){
  const mod10=n%10,mod100=n%100;
  if(mod10===1&&mod100!==11)return one;
  if(mod10>=2&&mod10<=4&&(mod100<10||mod100>=20))return few;
  return many;
}
