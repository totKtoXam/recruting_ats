<style>
/* ---------- Главная «Мой день» и общие блоки сводок (их же использует «Аналитика») ---------- */
.home-page{display:flex;flex-direction:column;gap:16px;padding:16px var(--page-pad) var(--page-pad);max-width:1600px}
.home-page.is-loading .home-card{opacity:.55;pointer-events:none}
.home-grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.home-card{
  grid-column:span 12;min-width:0;display:flex;flex-direction:column;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);box-shadow:var(--shadow)
}
.home-card.span-8{grid-column:span 8}
.home-card.span-6{grid-column:span 6}
.home-card.span-4{grid-column:span 4}
.home-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:50px;padding:10px 16px;border-bottom:1px solid var(--line-soft)}
.home-card-title{min-width:0}
.home-card-head h3{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:650}
.home-card-head .muted{margin-top:1px}
.home-card-body{padding:12px 16px 16px;flex:1 1 auto;min-width:0}
.home-card-body.flush{padding:0}
.home-card-body .empty-state{margin:0}
.home-card-body.flush .empty-state{margin:12px 16px 16px;width:auto}
.home-card.skeleton{border:0;box-shadow:none;background:var(--surface-3)}

/* Шапка: приветствие и сводка «что требует внимания» */
.home-summary{display:inline-flex;flex-wrap:wrap;align-items:baseline;gap:2px 6px}
.home-summary-link{padding:0;border:0;background:none;color:var(--text);font:inherit;font-weight:600;cursor:pointer;text-decoration:underline;text-decoration-color:var(--line-strong);text-underline-offset:3px}
.home-summary-link:hover{color:var(--primary);text-decoration-color:currentColor}
.home-summary-link:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:4px}
.home-summary-link.is-warning{color:var(--warning)}
#viewHome .page-actions{flex-wrap:nowrap}
.home-summary-sep{color:var(--text-3)}

/* Раскладка: основной список и боковая колонка — без растягивания по высоте соседа */
.home-main{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}
.home-main>.home-card{grid-column:auto}
.home-side{display:flex;flex-direction:column;gap:16px;min-width:0}

/* Горизонтальные столбики: источники, причины, нагрузка, конверсия */
.home-bars{display:flex;flex-direction:column;gap:2px}
.home-bar-row{
  display:grid;grid-template-columns:minmax(120px,40%) minmax(0,1fr) auto;gap:10px;align-items:center;min-height:28px;
  margin:0 -6px;padding:2px 6px;border:0;border-radius:var(--radius);background:transparent;color:inherit;font:inherit;text-align:left;width:calc(100% + 12px)
}
button.home-bar-row{cursor:pointer}
button.home-bar-row:hover{background:var(--hover)}
button.home-bar-row:focus-visible{outline:none;box-shadow:var(--focus-ring)}
.home-bar-label{display:flex;align-items:center;gap:6px;min-width:0;font-size:13px;color:var(--text-2)}
.home-bar-label>span:last-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-bar-label .brand-icon{width:18px;height:18px;flex-basis:18px;font-size:9px}
.home-bar-track{height:10px;border-radius:3px;background:var(--surface-3);overflow:hidden}
.home-bar-fill{display:block;height:100%;border-radius:0 3px 3px 0;background:var(--primary);transition:width var(--dur) var(--ease-out)}
.home-bar-row.is-other .home-bar-fill{background:var(--status-neutral)}
.home-bar-value{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;min-width:24px;text-align:right;white-space:nowrap}
.home-bar-value small{margin-left:4px;font-size:12px;font-weight:500;color:var(--muted)}
.home-foot{margin-top:10px;font-size:12px;color:var(--muted)}

/* Таблицы и списки */
.home-table{width:100%;border-collapse:collapse;font-size:13px}
.home-table th{padding:6px 8px;text-align:left;font-size:12px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap}
.home-table td{padding:7px 8px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.home-table tbody tr:last-child td{border-bottom:0}
.home-table .num{text-align:right;font-variant-numeric:tabular-nums;width:1%;white-space:nowrap}
.home-table th:first-child,.home-table td:first-child{padding-left:16px}
.home-table th:last-child,.home-table td:last-child{padding-right:16px}

.home-list{display:flex;flex-direction:column}
.home-row{
  display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;padding:8px 16px;
  border:0;border-bottom:1px solid var(--line-soft);background:transparent;color:var(--text);font:inherit;text-align:left;cursor:pointer
}
.home-row:last-child{border-bottom:0}
.home-row:hover{background:var(--hover)}
.home-row:focus-visible{outline:none;background:var(--primary-tint)}
.home-row-main{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.home-row-main strong{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-row-main small{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-row-side{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.home-days{min-width:46px;text-align:right;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.home-days.is-stale{color:var(--warning);font-weight:600}
.home-more{padding:8px 16px;border-top:1px solid var(--line-soft)}
.home-done{display:flex;align-items:center;gap:8px;padding:16px;color:var(--muted);font-size:13px}
.home-done .icon{color:var(--success)}

/* Вакансии: кандидаты по этапам; действия — явными кнопками в конце строки */
.home-vacancy-name{display:flex;align-items:center;gap:8px;min-width:0}
.home-vacancy-name strong{min-width:0;max-width:320px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-stage-count{font-weight:600}
.home-stage-count.is-zero{color:var(--text-3);font-weight:400}
.home-row-actions{display:flex;justify-content:flex-end;gap:2px}
.home-table td.home-actions-cell{width:1%;padding-top:3px;padding-bottom:3px;white-space:nowrap}
.home-fresh{color:var(--success);font-weight:600}

/* Лента событий */
.home-event{
  display:flex;gap:10px;align-items:flex-start;width:100%;padding:8px 16px;
  border:0;border-bottom:1px solid var(--line-soft);background:transparent;color:var(--text);font:inherit;text-align:left
}
button.home-event{cursor:pointer}
button.home-event:hover{background:var(--hover)}
button.home-event:focus-visible{outline:none;background:var(--primary-tint)}
.home-event:last-child{border-bottom:0}
.home-event-icon{
  flex:0 0 26px;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  background:var(--surface-3);color:var(--text-2);margin-top:1px
}
.home-event-icon .icon{width:13px;height:13px}
.home-event-icon.act-create{background:var(--success-tint);color:var(--success)}
.home-event-icon.act-delete,.home-event-icon.act-archive{background:var(--warning-tint);color:var(--warning)}
.home-event-body{display:flex;flex-direction:column;min-width:0;font-size:13px;line-height:1.35}
.home-event-body small{font-size:12px;color:var(--muted)}
.home-event-text{overflow-wrap:anywhere}
.home-event-text em{font-style:normal;color:var(--text-2)}
.home-event-diff{display:inline-flex;align-items:center;gap:4px;margin-left:4px;vertical-align:middle}
.home-event-diff .icon{width:12px;height:12px;color:var(--muted)}

.home-notify .notify-kind{flex:0 0 28px}
.home-row-main .notify-link{margin-top:2px}

/* Колонка доски, открытая с главной или из аналитики, коротко подсвечивается */
@keyframes home-column-flash{from{box-shadow:0 0 0 2px var(--primary-ring)}to{box-shadow:0 0 0 2px transparent}}
.column.is-flash{animation:home-column-flash 1.6s var(--ease-out)}

@media(max-width:1200px){
  .home-card.span-4{grid-column:span 6}
  .home-card.span-8{grid-column:span 12}
}
@media(max-width:900px){
  .home-main{grid-template-columns:minmax(0,1fr)}
  .home-card.span-6,.home-card.span-4{grid-column:span 12}
}
/* Ссылка на «Аналитику» внизу главной — только на телефоне, где её нет в нижней панели. */
.home-mobile-link{display:none}
.home-meta-status{display:none}

@media(max-width:720px){
  .home-page{gap:12px;padding-top:12px}
  .home-grid,.home-main,.home-side{gap:12px}
  .home-bar-row{grid-template-columns:minmax(96px,44%) minmax(0,1fr) auto}
  /* Сводка — столбиком, без разделителей; этап в строке очереди — в подписи вместо чипа. */
  .home-summary{flex-direction:column;align-items:flex-start;gap:2px}
  .home-summary-sep{display:none}
  .home-summary-link{text-align:left}
  .home-row-side .status-chip{display:none}
  .home-meta-status{display:inline}
  .home-mobile-link{
    display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:10px 16px;
    border:1px solid var(--line);border-radius:var(--radius-lg);background:var(--surface);color:var(--text);font:inherit;font-weight:600;text-align:left;cursor:pointer
  }
  .home-mobile-link .icon:last-child{margin-left:auto;color:var(--muted)}
}
@media(prefers-reduced-motion:reduce){.column.is-flash{animation:none}}
</style>

<script>
// ---------- Главная «Мой день» ----------
// Текущее состояние без периода одним RPC getHomeData: очередь «на моём этапе», зависшие,
// вакансии по этапам, уведомления и последние события. Показатели за период — в «Аналитике».
// Интервьюер (focus: 'personal') видит свою очередь и уведомления, остальные — ещё и командные блоки.

const HOME_CACHE_MS=60000;
const HOME_LIST_PREVIEW=8;
const HOME_SIDE_PREVIEW=5;
const HOME_ACTION_ICONS={create:'plus',update:'edit',status:'arrow-right',archive:'archive',unarchive:'unarchive',delete:'trash',restore:'restore',revert:'undo'};
const HOME_ENTITY_LABELS={candidate:'кандидата',vacancy:'вакансию',source:'источник',template:'шаблон вопросов',vacancy_preset:'шаблон вакансии',interview:'результат интервью',user:'пользователя'};
// Короткие подписи этапов в заголовке таблицы вакансий; полное название — в подсказке.
const HOME_STAGE_SHORT={'Новый':'Новые','HR screening':'HR','Проф. интервью':'Проф.','Финальное интервью':'Финал','Offer':'Оффер','Hired':'Наняты'};

const home={
  data:null,
  loadedAt:0,
  loading:false,
  error:'',
  request:0,
  expanded:{queue:false,stale:false},
  notifications:null
};

function homeVisible(){
  const view=el('viewHome');
  return !!view&&!view.hidden;
}

function showHome(){
  renderHome();
  if(!home.data||Date.now()-home.loadedAt>HOME_CACHE_MS)loadHomeData();
}

async function loadHomeData(){
  const request=++home.request;
  home.loading=true;
  home.error='';
  renderHomeLoading();
  try{
    const [data,feed]=await Promise.all([
      rpc('getHomeData'),
      rpc('getNotificationFeed',{view:'unread',limit:HOME_SIDE_PREVIEW}).catch(()=>null)
    ]);
    if(request!==home.request)return;
    home.data=data;
    home.loadedAt=Date.now();
    if(feed){
      home.notifications=feed.items||[];
      if(typeof setNotifyUnread==='function')setNotifyUnread(feed.unread);
    }else if(typeof setNotifyUnread==='function'&&data){
      setNotifyUnread(data.notificationsUnread||0);
    }
  }catch(error){
    if(request!==home.request)return;
    home.error=error&&error.message?error.message:String(error);
    if(home.data)showToast(home.error,'error');
  }finally{
    if(request===home.request){
      home.loading=false;
      renderHome();
    }
  }
}

async function refreshHomePage(button){
  await runUiTask({button,pageId:'viewHome',label:'Обновление…'},async()=>{
    await Promise.all([refreshBootstrapData(),loadHomeData()]);
    if(!home.error)showToast('Главная обновлена.');
  }).catch(()=>{});
}

// Пока идёт повторная загрузка, прежний рендер остаётся на месте с пониженной прозрачностью.
function renderHomeLoading(){
  const root=el('homeRoot');
  if(root)root.classList.toggle('is-loading',home.loading&&!!home.data);
}

function renderHome(){
  const root=el('homeRoot');
  if(!root)return;
  const data=home.data;
  renderHomeHeader();
  root.innerHTML=data?homeBodyHtml(data):home.error?homeErrorHtml():homeSkeletonHtml();
  root.classList.toggle('is-loading',home.loading&&!!data);
}

// ---------- Шапка ----------

function homeGreeting(){
  const user=state.currentUser;
  const hour=new Date().getHours();
  const word=hour<5?'Доброй ночи':hour<12?'Доброе утро':hour<18?'Добрый день':'Добрый вечер';
  const name=user?(user['Имя']||user['ФИО']||''):'';
  return word+(name?', '+name:'');
}

function homePlural(count,one,few,many){
  const n=Math.abs(count)%100;
  const last=n%10;
  if(n>10&&n<20)return many;
  if(last===1)return one;
  if(last>=2&&last<=4)return few;
  return many;
}

// Сводка под приветствием: каждая часть ведёт к своему списку.
function homeSummaryHtml(data){
  const parts=[];
  const queue=(data.my||{}).total||0;
  const stale=(data.stale||{}).total||0;
  const offers=(data.totals||{}).offers||0;
  if(queue)parts.push('<button type="button" class="home-summary-link" onclick="homeScrollTo(\'homeQueue\')">'+homeNum(queue)+' '+homePlural(queue,'кандидат ждёт','кандидата ждут','кандидатов ждут')+' вашего решения</button>');
  if(data.focus==='team'){
    if(stale)parts.push('<button type="button" class="home-summary-link is-warning" onclick="homeScrollTo(\'homeStale\')">'+homeNum(stale)+' без движения дольше '+data.staleDays+' дн.</button>');
    if(offers)parts.push('<button type="button" class="home-summary-link" onclick="homeOpenBoard({status:\'Offer\'})">'+homeNum(offers)+' '+homePlural(offers,'оффер','оффера','офферов')+' в работе</button>');
  }
  if(!parts.length)return '<span>Срочных дел нет.</span>';
  return parts.join('<span class="home-summary-sep" aria-hidden="true">·</span>');
}

function renderHomeHeader(){
  const title=el('homeTitle');
  const summary=el('homeSummary');
  if(title)title.textContent=homeGreeting();
  if(summary)summary.innerHTML=home.data?homeSummaryHtml(home.data):home.error?'':'Загрузка…';
}

function homeScrollTo(id){
  const node=el(id);
  if(!node)return;
  node.scrollIntoView({behavior:'smooth',block:'start'});
  const focusable=node.querySelector('button,[tabindex]');
  if(focusable)focusable.focus({preventScroll:true});
}

// ---------- Действия ----------

function homeReferencesReady(){
  if(state.loaded.references)return true;
  showToast('Справочники ещё загружаются.','error');
  return false;
}

function homeNewCandidate(autofill){
  if(!homeReferencesReady())return;
  openCandidate(null);
  if(autofill&&typeof chooseResumeForAutofill==='function')chooseResumeForAutofill();
}

// Выполнить действие после перехода в раздел (hashchange срабатывает асинхронно).
function homeAfterRoute(route,action){
  const target='#/'+route;
  if(location.hash===target){action();return}
  window.addEventListener('hashchange',()=>setTimeout(action,0),{once:true});
  location.hash=target;
}

function homeOpenForm(route,fnName){
  if(!homeReferencesReady())return;
  homeAfterRoute(route,()=>{
    const fn=window[fnName];
    if(typeof fn==='function')fn();
  });
}

function homeOpenVacancy(id){
  if(!homeReferencesReady())return;
  // Форма откроется поверх раздела «Вакансии»; этапы вакансии editVacancy догрузит сама.
  homeAfterRoute('vacancies',()=>{if(typeof editVacancy==='function')editVacancy(id)});
}

function homeSetSelect(id,values){
  const select=el(id);
  if(!select)return;
  const wanted=new Set(values.map(String));
  [...select.options].forEach(option=>{option.selected=wanted.has(option.value)});
  if(window.UiSelect&&typeof UiSelect.refresh==='function')UiSelect.refresh(select);
}

// Доска «Активные» с одним фильтром (вакансия, источник или рекрутер); status — прокрутить к колонке.
function homeOpenBoard({vacancy='',source='',responsible='',status=''}={}){
  if(!state.loaded.candidates||!state.loaded.references){showToast('Кандидаты ещё загружаются.','error');return}
  homeAfterRoute('candidates',async()=>{
    if(boardState()!=='active')await setBoardState('active');
    vacancyFilter.clear();
    if(vacancy)vacancyFilter.add(String(vacancy));
    homeSetSelect('filterSource',source?[source]:[]);
    homeSetSelect('filterResponsible',responsible?[responsible]:[]);
    if(el('filterSearch'))el('filterSearch').value='';
    if(source||responsible)toggleCandidateFilters(true);
    renderBoard();
    renderVacancyStats();
    if(!status)return;
    const column=document.querySelector('#viewCandidates .column[data-status="'+CSS.escape(status)+'"]');
    if(!column)return;
    column.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
    column.classList.remove('is-flash');
    void column.offsetWidth;
    column.classList.add('is-flash');
  });
}

// Карточка открывается поверх текущего раздела, адрес не меняется.
async function homeOpenCandidate(id){
  if(!state.loaded.candidates||!state.loaded.references){showToast('Кандидаты ещё загружаются.','error');return}
  if(!candidateById(id)){
    try{await ensureArchivedCandidatesLoaded()}catch(error){}
    if(!candidateById(id)&&isAdminUser()){
      try{await ensureDeletedCandidatesLoaded()}catch(error){}
    }
  }
  if(candidateById(id))openCandidateById(id,false);
  else showToast('Кандидат недоступен.','error');
}

function toggleHomeList(key){
  home.expanded[key]=!home.expanded[key];
  renderHome();
  const card=el(key==='queue'?'homeQueue':'homeStale');
  const more=card&&card.querySelector('.home-more .text-btn');
  if(more)more.focus({preventScroll:true});
}

// ---------- Общие блоки (используются и в «Аналитике») ----------

function homeNum(value){
  return Number(value||0).toLocaleString('ru-RU');
}

function homeCard(title,span,body,opts={}){
  return '<section class="home-card '+span+'"'+(opts.id?' id="'+opts.id+'"':'')+'>'+
    '<div class="home-card-head"><div class="home-card-title"><h3>'+escapeHtml(title)+
      (opts.count!==undefined?'<span class="counter-badge">'+homeNum(opts.count)+'</span>':'')+'</h3>'+
      (opts.sub?'<p class="muted">'+escapeHtml(opts.sub)+'</p>':'')+'</div>'+
      '<div class="header-actions">'+(opts.actions||'')+
        (opts.link?'<button type="button" class="text-btn" onclick="'+opts.link[0]+'">'+escapeHtml(opts.link[1])+icon('chevron-right','icon-sm')+'</button>':'')+
      '</div></div>'+
    '<div class="home-card-body'+(opts.flush?' flush':'')+'">'+body+'</div>'+
  '</section>';
}

// Столбики; onclick(item) — строка становится кнопкой (переход на доску с фильтром).
function homeBarsHtml(items,{labelHtml,getValue=item=>item.count,valueHtml,tip,empty,onclick}){
  if(!items.length)return '<div class="empty-state compact">'+escapeHtml(empty||'Данных нет.')+'</div>';
  const max=Math.max(1,...items.map(getValue));
  return '<div class="home-bars">'+items.map(item=>{
    const value=getValue(item);
    const action=onclick?onclick(item):'';
    const tag=action?'button type="button" onclick="'+action+'"':'div';
    return '<'+tag+' class="home-bar-row'+(item.other?' is-other':'')+'"'+(tip?' data-tip="'+escapeHtml(tip(item))+'"':'')+'>'+
      '<span class="home-bar-label">'+labelHtml(item)+'</span>'+
      '<span class="home-bar-track">'+(value?'<span class="home-bar-fill" style="width:'+(value/max*100)+'%"></span>':'')+'</span>'+
      '<b class="home-bar-value">'+(valueHtml?valueHtml(item):homeNum(value))+'</b></'+(action?'button':'div')+'>';
  }).join('')+'</div>';
}

// compact — для узкой боковой колонки: этап уходит в подпись, справа остаются только дни.
function homeCandidateRow(item,side,compact=false){
  const meta=compact
    ?escapeHtml(item.status)+' · '+escapeHtml(item.vacancy)
    :'<span class="home-meta-status">'+escapeHtml(item.status)+' · </span>№'+escapeHtml(item.number)+' · '+escapeHtml(item.vacancy)+(item.recruiter?' · '+escapeHtml(item.recruiter):'');
  return '<button type="button" class="home-row" onclick="homeOpenCandidate(\''+escJs(item.id)+'\')">'+
    '<span class="home-row-main"><strong>'+escapeHtml(item.name)+'</strong><small>'+meta+'</small></span>'+
    '<span class="home-row-side">'+(compact?'':statusChip(item.status,true))+(side||'')+'</span>'+
  '</button>';
}

// ---------- Тело главной ----------

function homeSkeletonHtml(){
  return '<div class="home-main" aria-hidden="true">'+
      '<div class="home-card skeleton" style="min-height:320px"></div>'+
      '<div class="home-side"><div class="home-card skeleton" style="min-height:150px"></div><div class="home-card skeleton" style="min-height:150px"></div></div>'+
    '</div>'+
    '<div class="home-card skeleton" style="min-height:200px" aria-hidden="true"></div>'+
    '<span class="sr-only" role="status">Главная загружается…</span>';
}

function homeErrorHtml(){
  return '<div class="empty-state">Не удалось загрузить главную: '+escapeHtml(home.error)+'<br><button type="button" class="text-btn" style="margin-top:8px" onclick="loadHomeData()">'+icon('refresh','icon-sm')+' Повторить</button></div>';
}

function homeBodyHtml(data){
  const team=data.focus==='team';
  const my=data.my||{items:[],total:0};
  const stale=data.stale||{items:[],total:0};
  const side=(team?homeCard('Без движения','',homeCandidateListHtml(stale,'stale',data.staleDays,'Все кандидаты двигаются по воронке.'),{id:'homeStale',count:stale.total,sub:'Дольше '+data.staleDays+' дней на одном этапе',flush:true}):'')+
    homeCard('Уведомления','',homeNotificationsHtml(),{count:typeof notify!=='undefined'?notify.unread:undefined,sub:'Непрочитанные',flush:true});
  return '<div class="home-main">'+
      homeCard('На моём этапе','',homeCandidateListHtml(my,'queue',data.staleDays,''),{id:'homeQueue',count:my.total,sub:'Кандидаты, где за текущий этап отвечаете вы. Сверху — дольше всех ждут.',flush:true})+
      '<div class="home-side">'+side+'</div>'+
    '</div>'+
    (team?homeCard('Вакансии','',homeVacanciesHtml(data),{
      sub:'Кандидаты в работе по этапам',
      actions:'<button type="button" class="icon-btn icon-btn-sm" data-tip="Новая вакансия" aria-label="Новая вакансия" onclick="homeOpenForm(\'vacancies\',\'resetVacancyForm\')">'+icon('plus','icon-sm')+'</button>',
      link:["navigateTo('vacancies')",'Все вакансии'],
      flush:true
    }):'')+
    (team?homeCard('Последние события','',homeActivityHtml(data.activity||[]),{flush:true}):'')+
    '<button type="button" class="home-mobile-link" onclick="navigateTo(\'analytics\')">'+icon('chart')+'<span>Аналитика найма</span>'+icon('chevron-right')+'</button>';
}

// Список кандидатов: первые HOME_LIST_PREVIEW (в боковой колонке — HOME_SIDE_PREVIEW), остальные по кнопке.
function homeCandidateListHtml(list,key,staleDays,empty){
  const items=list.items||[];
  if(!items.length){
    return key==='queue'
      ?'<div class="home-done">'+icon('check-check')+'<span>Все ваши кандидаты обработаны. Новые появятся здесь, когда перейдут на ваш этап.</span></div>'
      :'<div class="empty-state compact">'+escapeHtml(empty)+'</div>';
  }
  const preview=key==='queue'?HOME_LIST_PREVIEW:HOME_SIDE_PREVIEW;
  const shown=home.expanded[key]?items:items.slice(0,preview);
  const hidden=items.length-shown.length;
  // Сервер отдаёт не больше 50 строк; сверх этого — ссылка на доску.
  const beyond=list.total-items.length;
  return '<div class="home-list">'+shown.map(item=>
      homeCandidateRow(item,'<span class="home-days'+(item.days>=staleDays?' is-stale':'')+'" data-tip="На этапе с '+escapeHtml(fmtDate(item.stageSince))+'">'+item.days+' дн.</span>',key!=='queue')
    ).join('')+'</div>'+
    (hidden>0||home.expanded[key]&&items.length>preview
      ?'<div class="home-more"><button type="button" class="text-btn" aria-expanded="'+!!home.expanded[key]+'" onclick="toggleHomeList(\''+key+'\')">'+
        (home.expanded[key]?icon('chevron-up','icon-sm')+' Свернуть':icon('chevron-down','icon-sm')+' Показать все '+homeNum(items.length))+'</button>'+
        (home.expanded[key]&&beyond>0?' <span class="muted">и ещё '+homeNum(beyond)+' — на доске</span>':'')+'</div>'
      :'');
}

function homeVacanciesHtml(data){
  const items=(data.vacancies||{}).items||[];
  if(!items.length){
    return '<div class="empty-state compact">Открытых вакансий нет.<br><button type="button" class="text-btn" style="margin-top:6px" onclick="homeOpenForm(\'vacancies\',\'resetVacancyForm\')">'+icon('plus','icon-sm')+' Создать вакансию</button></div>';
  }
  const stages=getStatuses();
  const head=stages.map(stage=>'<th class="num" data-tip="'+escapeHtml(stage)+'">'+escapeHtml(HOME_STAGE_SHORT[stage]||stage)+'</th>').join('');
  return '<div class="table-scroll"><table class="home-table"><thead><tr>'+
    '<th>Вакансия</th>'+head+'<th class="num" data-tip="Новых кандидатов за '+data.freshDays+' дн.">За '+data.freshDays+' дн.</th><th class="num" data-tip="Дней с открытия вакансии">Дней</th><th><span class="sr-only">Действия</span></th>'+
    '</tr></thead><tbody>'+
    items.map(item=>{
      const title='№'+item.number+' · '+item.name;
      const cells=stages.map(stage=>{
        const count=(item.stages||{})[stage]||0;
        return '<td class="num"><span class="home-stage-count'+(count?'':' is-zero')+'">'+(count||'—')+'</span></td>';
      }).join('');
      return '<tr>'+
        '<td><span class="home-vacancy-name"><strong>'+escapeHtml(title)+'</strong>'+
          (item.status!=='Открыта'?vacancyStatusChip(item.status):'')+'</span></td>'+
        cells+
        '<td class="num">'+(item.fresh?'<span class="home-fresh">+'+item.fresh+'</span>':'<span class="muted">0</span>')+'</td>'+
        '<td class="num">'+item.daysOpen+'</td>'+
        '<td class="home-actions-cell"><span class="home-row-actions">'+
          '<button type="button" class="icon-btn icon-btn-sm" data-tip="Кандидаты вакансии на доске" aria-label="'+escapeHtml('Кандидаты вакансии '+title+' на доске')+'" onclick="homeOpenBoard({vacancy:\''+escJs(item.id)+'\'})">'+icon('kanban','icon-sm')+'</button>'+
          '<button type="button" class="icon-btn icon-btn-sm" data-tip="Редактировать вакансию" aria-label="'+escapeHtml('Редактировать вакансию '+title)+'" onclick="homeOpenVacancy(\''+escJs(item.id)+'\')">'+icon('edit','icon-sm')+'</button>'+
        '</span></td>'+
      '</tr>';
    }).join('')+
  '</tbody></table></div>';
}

function homeActivitySentence(event){
  const who='<strong>'+escapeHtml(event.actorName)+'</strong>';
  const entity=HOME_ENTITY_LABELS[event.entityType]||'запись';
  const label=event.entityLabel?'<em>«'+escapeHtml(event.entityLabel)+'»</em>':'<em>(удалённая запись)</em>';
  const field=event.fieldLabel?' «'+escapeHtml(event.fieldLabel)+'»':'';
  // Создание результата интервью — это переход кандидата между этапами.
  if(event.entityType==='interview'&&event.action==='create'){
    const [from,to]=String(event.newDisplay||'').split(' → ');
    const diff=from&&to?'<span class="home-event-diff">'+statusChip(from,true)+icon('arrow-right')+statusChip(to,true)+'</span>':'';
    return who+' перевёл(а) кандидата '+label+diff;
  }
  switch(event.action){
    case 'create':return who+' создал(а) '+entity+' '+label;
    case 'update':return who+' изменил(а)'+field+' у '+entity+' '+label+(event.field==='resume'&&event.newDisplay?': '+escapeHtml(event.newDisplay):'');
    case 'status':return who+' сменил(а) статус '+entity+' '+label+(event.oldDisplay&&event.newDisplay?': '+escapeHtml(event.oldDisplay)+' → '+escapeHtml(event.newDisplay):'');
    case 'archive':return who+' отправил(а) в архив '+entity+' '+label;
    case 'unarchive':return who+' вернул(а) из архива '+entity+' '+label;
    case 'delete':return who+' удалил(а) в корзину '+entity+' '+label;
    case 'restore':return who+' восстановил(а) из корзины '+entity+' '+label;
    case 'revert':return who+' вернул(а) прежнее значение'+field+' у '+entity+' '+label;
    default:return who+' — '+escapeHtml(event.action)+' '+entity+' '+label;
  }
}

function homeActivityHtml(items){
  if(!items.length)return '<div class="empty-state compact">Событий пока нет.</div>';
  return '<div class="home-list">'+items.map(event=>{
    const clickable=!!event.candidateId;
    const tag=clickable?'button':'div';
    return '<'+tag+(clickable?' type="button" onclick="homeOpenCandidate(\''+escJs(event.candidateId)+'\')"':'')+' class="home-event">'+
      '<span class="home-event-icon act-'+escapeHtml(event.action)+'">'+icon(HOME_ACTION_ICONS[event.action]||'history')+'</span>'+
      '<span class="home-event-body"><span class="home-event-text">'+homeActivitySentence(event)+'</span>'+
      '<small data-tip="'+escapeHtml(typeof notifyFullTime==='function'?notifyFullTime(event.createdAt):'')+'">'+escapeHtml(typeof notifyTime==='function'?notifyTime(event.createdAt):event.createdAt)+'</small></span>'+
    '</'+tag+'>';
  }).join('')+'</div>';
}

function homeNotificationsHtml(){
  const items=home.notifications;
  const unread=typeof notify!=='undefined'?notify.unread:0;
  if(items===null)return '<div class="empty-state compact">Загрузка…</div>';
  if(!items.length)return '<div class="empty-state compact">'+icon('check-check','icon-sm')+' Непрочитанных уведомлений нет.</div>';
  return '<div class="home-list">'+items.map(item=>
    '<div class="home-row home-notify" role="button" tabindex="0" data-id="'+escapeHtml(item.id)+'" onclick="homeOpenNotification(this.dataset.id)" onkeydown="homeRowKeydown(event,this)">'+
      '<span class="notify-kind kind-'+escapeHtml(item.kind)+'" data-tip="'+escapeHtml(item.kindLabel||'')+'">'+icon((typeof NOTIFY_KIND_ICONS!=='undefined'&&NOTIFY_KIND_ICONS[item.kind])||'bell')+'</span>'+
      '<span class="home-row-main"><strong>'+escapeHtml(item.title)+'</strong><small>'+escapeHtml([item.body,typeof notifyTime==='function'?notifyTime(item.createdAt):''].filter(Boolean).join(' · '))+'</small>'+
        (typeof notifyCardLinkHtml==='function'?notifyCardLinkHtml(item):'')+'</span>'+
    '</div>'
  ).join('')+'</div>'+
  (unread>items.length?'<div class="home-more"><button type="button" class="text-btn" onclick="toggleNotifyPopover(true)">'+icon('bell','icon-sm')+' Ещё '+homeNum(unread-items.length)+'</button></div>':'');
}

// Строка-кнопка (div role="button"): Enter и пробел работают как клик.
function homeRowKeydown(event,node){
  if(event.key==='Enter'||event.key===' '){event.preventDefault();node.click()}
}

function homeOpenNotification(id){
  if(typeof openNotificationCard==='function')openNotificationCard(id);
}
</script>
