<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >
  <?!= include('Styles'); ?>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Recruiting ATS</h1>
      <div class="subtitle">
        Кандидаты, интервью и вакансии
      </div>
    </div>

    <nav class="top-actions">
      <span
        id="dataSyncStatus"
        class="sync-status"
      >
        Загрузка данных…
      </span>

      <button
        id="navCandidates"
        class="button button-secondary"
        onclick="navigateTo('candidates')"
      >
        Кандидаты
      </button>

      <button
        id="navAdmin"
        class="button button-secondary"
        onclick="navigateTo('admin')"
      >
        Админ-панель
      </button>

      <button
        id="addCandidateTop"
        class="button button-primary"
        onclick="openCandidate()"
      >
        + Кандидат
      </button>
    </nav>
  </header>

  <main id="viewCandidates" class="page app-view">
    <section class="filters">
      <input
        id="filterSearch"
        type="search"
        placeholder="ФИО, телефон, email, Telegram..."
        oninput="renderBoard()"
      >

      <select
        id="filterVacancy"
        onchange="renderBoard()"
      ></select>

      <select
        id="filterResponsible"
        onchange="renderBoard()"
      ></select>

      <select
        id="filterSource"
        onchange="renderBoard()"
      ></select>

      <label class="checkbox">
        <input
          id="filterArchived"
          type="checkbox"
          onchange="renderBoard()"
        >
        Архив
      </label>
    </section>

    <section
      id="stats"
      class="stats"
    ></section>

    <section
      id="board"
      class="board"
    ></section>
  </main>

  <main
    id="viewAdmin"
    class="page app-view"
    hidden
  >
    <?!= include('AdminView'); ?>
  </main>

  <div
    id="candidateModal"
    class="modal"
  >
    <div class="panel panel-wide">
      <div class="panel-header">
        <div>
          <h2 id="candidateTitle">
            Новый кандидат
          </h2>
          <div
            id="candidateStatusLabel"
            class="badge"
          ></div>
        </div>

        <button
          class="button button-secondary"
          onclick="closeCandidate()"
        >
          Закрыть
        </button>
      </div>

      <div
        id="candidateTransitions"
        class="transition-bar"
      ></div>

      <div class="tabs">
        <button
          class="tab active"
          onclick="showCandidateTab('candidateDetails', this)"
        >
          Карточка
        </button>

        <button
          id="historyTabButton"
          class="tab"
          onclick="showCandidateTab('candidateHistory', this)"
        >
          Результаты интервью
        </button>
      </div>

      <section
        id="candidateDetails"
        class="tab-section active"
      >
        <input
          id="candidateId"
          type="hidden"
        >

        <div class="form-grid">
          <div class="field">
            <label>ФИО *</label>
            <input id="candidateName">
          </div>

          <div class="field">
            <label>Вакансия *</label>
            <select id="candidateVacancy"></select>
          </div>

          <div class="field">
            <label>Телефон *</label>
            <input
              id="candidatePhone"
              placeholder="+7 7XX XXX XX XX"
            >
          </div>

          <div class="field">
            <label>Email</label>
            <input
              id="candidateEmail"
              type="email"
            >
          </div>

          <div class="field">
            <label>Telegram</label>
            <input
              id="candidateTelegram"
              oninput="renderTelegramPreview()"
              placeholder="@username или https://t.me/username"
            >
            <a
              id="telegramPreview"
              class="preview-link"
              target="_blank"
              rel="noopener"
            ></a>
          </div>

          <div class="field">
            <label>ЗП ожидания</label>
            <input
              id="candidateSalary"
              inputmode="numeric"
              placeholder="500 000"
              oninput="formatMoneyInput(this)"
            >
          </div>

          <div class="field">
            <label>Источник</label>
            <select id="candidateSource"></select>
          </div>

          <div class="field">
            <label>Ответственный *</label>
            <select id="candidateResponsible"></select>
          </div>

          <div class="field full">
            <label>Резюме *</label>
            <input
              id="candidateResumeFile"
              type="file"
              accept=".pdf,.doc,.docx"
            >
            <a
              id="candidateResumeLink"
              class="preview-link"
              target="_blank"
              rel="noopener"
            ></a>
          </div>

          <div class="field full">
            <label>Папка кандидата</label>
            <a
              id="candidateFolderLink"
              class="preview-link"
              target="_blank"
              rel="noopener"
            ></a>
          </div>

          <div class="field full">
            <label>Комментарий</label>
            <textarea id="candidateComment"></textarea>
          </div>

          <div class="field full">
            <div class="field-header">
              <label>Иные ссылки</label>
              <button
                class="button button-small"
                type="button"
                onclick="addCandidateLink()"
              >
                + Ссылка
              </button>
            </div>
            <div id="candidateLinks"></div>
          </div>
        </div>

        <div class="actions">
          <button
            id="archiveCandidateButton"
            class="button button-danger left"
            onclick="archiveCurrentCandidate()"
            style="display:none"
          >
            Архивировать
          </button>

          <button
            class="button button-primary"
            onclick="saveCandidateForm()"
          >
            Сохранить
          </button>
        </div>
      </section>

      <section
        id="candidateHistory"
        class="tab-section"
      >
        <div id="interviewHistory"></div>
      </section>
    </div>
  </div>

  <div
    id="transitionModal"
    class="modal modal-top"
  >
    <div class="panel">
      <div class="panel-header">
        <div>
          <h2>Результат этапа</h2>
          <div
            id="transitionTitle"
            class="muted"
          ></div>
        </div>

        <button
          class="button button-secondary"
          onclick="closeTransition()"
        >
          Закрыть
        </button>
      </div>

      <div class="form-grid one">
        <div class="field">
          <label>Шаблон вопросов</label>
          <select
            id="transitionTemplate"
            onchange="renderTransitionQuestions()"
          ></select>
        </div>

        <div class="field">
          <label>Ответственный на следующем этапе *</label>
          <select id="transitionResponsible"></select>
        </div>

        <div
          id="transitionQuestions"
          class="field full"
        ></div>

        <div class="field full">
          <label>Комментарии</label>
          <textarea id="transitionComment"></textarea>
        </div>

        <div class="field full">
          <label>Результат *</label>
          <textarea id="transitionResult"></textarea>
        </div>
      </div>

      <div class="actions">
        <button
          class="button button-primary"
          onclick="submitTransition()"
        >
          Сохранить результат и перейти
        </button>
      </div>
    </div>
  </div>

  <div
    id="interviewEditModal"
    class="modal modal-top"
  >
    <div class="panel">
      <div class="panel-header">
        <h2>Редактирование результата</h2>
        <button
          class="button button-secondary"
          onclick="closeInterviewEdit()"
        >
          Закрыть
        </button>
      </div>

      <div id="editInterviewQuestions"></div>

      <div class="field">
        <label>Комментарий</label>
        <textarea id="editInterviewComment"></textarea>
      </div>

      <div class="field">
        <label>Результат</label>
        <textarea id="editInterviewResult"></textarea>
      </div>

      <div class="actions">
        <button
          class="button button-primary"
          onclick="saveInterviewEdit()"
        >
          Сохранить
        </button>
      </div>
    </div>
  </div>

  <div
    id="loading"
    class="loading"
  >
    Загрузка...
  </div>

  <div
    id="toast"
    class="toast"
    role="status"
    aria-live="polite"
  ></div>

  <div
    id="confirmModal"
    class="modal modal-top"
  >
    <div class="panel confirm-panel">
      <h2 id="confirmTitle">Подтверждение</h2>
      <p id="confirmMessage"></p>

      <div class="actions">
        <button
          class="button button-secondary"
          onclick="closeConfirm(false)"
        >
          Отмена
        </button>

        <button
          id="confirmActionButton"
          class="button button-danger"
          onclick="closeConfirm(true)"
        >
          Подтвердить
        </button>
      </div>
    </div>
  </div>

  <script>
    window.__INITIAL_ROUTE__ = '<?= initialRoute ?>';
  </script>

  <?!= include('Scripts'); ?>
  <?!= include('AdminScripts'); ?>
</body>
</html>
