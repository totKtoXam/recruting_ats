<script>
let state={
  vacancies:[],
  sources:[],
  responsibles:[],
  interviewTemplates:[],
  pipelineStatuses:[]
};

let confirmResolver=null;

function el(id){
  return document.getElementById(id);
}

function value(id){
  return el(id).value;
}

function escapeHtml(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function escJs(v){
  return String(v??'')
    .replaceAll('\\','\\\\')
    .replaceAll("'","\\'");
}

function setLoading(v){
  el('loading')
    .classList
    .toggle('active',!!v);
}

function showToast(message,type='info'){
  const toast=el('toast');

  toast.textContent=message;
  toast.className=
    'toast active '+
    (type==='error'
      ? 'toast-error'
      : 'toast-success');

  clearTimeout(showToast.timer);

  showToast.timer=setTimeout(()=>{
    toast.className='toast';
  },3500);
}

function handleError(error){
  setLoading(false);

  showToast(
    error&&error.message
      ? error.message
      : String(error),
    'error'
  );
}

function call(name,args,onSuccess){
  setLoading(true);

  const runner=
    google.script.run
      .withFailureHandler(handleError)
      .withSuccessHandler(result=>{
        setLoading(false);

        if(onSuccess){
          onSuccess(result);
        }
      });

  if(args===undefined){
    runner[name]();
  }else{
    runner[name](args);
  }
}

function init(){
  loadData();
}

function loadData(after){
  call(
    'getInitialData',
    undefined,
    data=>{
      state=data;
      renderAll();

      if(after){
        after();
      }
    }
  );
}

function renderAll(){
  renderResponsibleStages();
  renderTemplateSelects();
  renderVacancies();
  renderSources();
  renderResponsibles();
  renderTemplates();
}

function showAdminTab(name,button){
  document
    .querySelectorAll('.admin-page-section')
    .forEach(section=>
      section.classList.remove('active')
    );

  document
    .querySelectorAll('.admin-tabs .tab')
    .forEach(tab=>
      tab.classList.remove('active')
    );

  el('admin-'+name)
    .classList
    .add('active');

  if(button){
    button.classList.add('active');
  }
}

function showConfirm(message,title='Подтверждение'){
  el('confirmTitle').textContent=title;
  el('confirmMessage').textContent=message;

  el('confirmModal')
    .classList
    .add('open');

  return new Promise(resolve=>{
    confirmResolver=resolve;
  });
}

function closeConfirm(result){
  el('confirmModal')
    .classList
    .remove('open');

  if(confirmResolver){
    confirmResolver(result);
    confirmResolver=null;
  }
}

function actionButtons(editFn,id,deleteFn){
  return (
    '<div class="table-actions">'+
      '<button class="button button-small" '+
      'onclick="'+editFn+'(\''+
      escJs(id)+
      '\')">Изменить</button>'+
      '<button class="button button-small button-danger" '+
      'onclick="'+deleteFn+'(\''+
      escJs(id)+
      '\')">Удалить</button>'+
    '</div>'
  );
}

function table(headers,rows){
  return (
    '<div class="table-scroll">'+
      '<table class="admin-table">'+
        '<thead><tr>'+
          headers
            .map(h=>'<th>'+escapeHtml(h)+'</th>')
            .join('')+
        '</tr></thead>'+
        '<tbody>'+
          (
            rows.length
              ? rows.map(row=>
                  '<tr>'+
                    row.map((cell,index)=>
                      '<td>'+
                      (
                        index===row.length-1
                          ? cell
                          : escapeHtml(cell)
                      )+
                      '</td>'
                    ).join('')+
                  '</tr>'
                ).join('')
              : '<tr><td colspan="'+
                headers.length+
                '" class="empty-cell">Нет данных</td></tr>'
          )+
        '</tbody>'+
      '</table>'+
    '</div>'
  );
}

function renderVacancies(){
  el('vacancyCount').textContent=
    state.vacancies.length+' шт.';

  el('vacancyList').innerHTML=
    table(
      ['Вакансия','Статус','Комментарий',''],
      state.vacancies.map(item=>[
        item['Вакансия']||'',
        item['Статус']||'',
        item['Комментарий']||'',
        actionButtons(
          'editVacancy',
          item['Vacancy ID'],
          'deleteVacancy'
        )
      ])
    );
}

function resetVacancyForm(){
  el('vacancyId').value='';
  el('vacancyName').value='';
  el('vacancyStatus').value='Открыта';
  el('vacancyComment').value='';
  el('vacancyFormTitle').textContent=
    'Новая вакансия';
}

function editVacancy(id){
  const item=
    state.vacancies.find(v=>
      v['Vacancy ID']===id
    );

  if(!item){
    return;
  }

  el('vacancyId').value=id;
  el('vacancyName').value=
    item['Вакансия']||'';
  el('vacancyStatus').value=
    item['Статус']||'Открыта';
  el('vacancyComment').value=
    item['Комментарий']||'';
  el('vacancyFormTitle').textContent=
    'Редактирование вакансии';

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });
}

function saveVacancyForm(){
  const name=value('vacancyName').trim();

  if(!name){
    showToast(
      'Укажите название вакансии.',
      'error'
    );
    return;
  }

  call(
    'saveVacancy',
    {
      id:value('vacancyId'),
      name,
      status:value('vacancyStatus'),
      comment:value('vacancyComment')
    },
    ()=>{
      showToast('Вакансия сохранена.');
      resetVacancyForm();
      loadData();
    }
  );
}

async function deleteVacancy(id){
  const item=
    state.vacancies.find(v=>
      v['Vacancy ID']===id
    );

  const ok=await showConfirm(
    'Удалить вакансию "'+
    (item?item['Вакансия']:'')+
    '"?'
  );

  if(!ok){
    return;
  }

  call(
    'deleteVacancy',
    id,
    ()=>{
      showToast('Вакансия удалена.');
      loadData();
    }
  );
}

function renderSources(){
  el('sourceCount').textContent=
    state.sources.length+' шт.';

  el('sourceList').innerHTML=
    table(
      ['Название',''],
      state.sources.map(item=>[
        item['Название']||'',
        actionButtons(
          'editSource',
          item['Source ID'],
          'deleteSource'
        )
      ])
    );
}

function resetSourceForm(){
  el('sourceId').value='';
  el('sourceName').value='';
  el('sourceFormTitle').textContent=
    'Новый источник';
}

function editSource(id){
  const item=
    state.sources.find(s=>
      s['Source ID']===id
    );

  if(!item){
    return;
  }

  el('sourceId').value=id;
  el('sourceName').value=
    item['Название']||'';
  el('sourceFormTitle').textContent=
    'Редактирование источника';
}

function saveSourceForm(){
  const name=value('sourceName').trim();

  if(!name){
    showToast(
      'Укажите название источника.',
      'error'
    );
    return;
  }

  call(
    'saveSource',
    {
      id:value('sourceId'),
      name
    },
    ()=>{
      showToast('Источник сохранён.');
      resetSourceForm();
      loadData();
    }
  );
}

async function deleteSource(id){
  const item=
    state.sources.find(s=>
      s['Source ID']===id
    );

  const ok=await showConfirm(
    'Удалить источник "'+
    (item?item['Название']:'')+
    '"?'
  );

  if(!ok){
    return;
  }

  call(
    'deleteSource',
    id,
    ()=>{
      showToast('Источник удалён.');
      loadData();
    }
  );
}

function renderResponsibleStages(selected=[]){
  el('responsibleStages').innerHTML=
    (state.pipelineStatuses||[])
      .map(stage=>
        '<label>'+
          '<input '+
            'type="checkbox" '+
            'class="responsible-stage" '+
            'value="'+escapeHtml(stage)+'" '+
            (
              selected.includes(stage)
                ? 'checked'
                : ''
            )+
          '>'+
          '<span>'+escapeHtml(stage)+'</span>'+
        '</label>'
      )
      .join('');
}

function renderResponsibles(){
  el('responsibleCount').textContent=
    state.responsibles.length+' шт.';

  el('responsibleList').innerHTML=
    table(
      ['ФИО','Email','Доступные этапы',''],
      state.responsibles.map(item=>[
        item['ФИО']||'',
        item['Email']||'',
        (item.stages||[]).join(', '),
        actionButtons(
          'editResponsible',
          item['Responsible ID'],
          'deleteResponsible'
        )
      ])
    );
}

function resetResponsibleForm(){
  el('responsibleId').value='';
  el('responsibleName').value='';
  el('responsibleEmail').value='';
  el('responsibleFormTitle').textContent=
    'Новый ответственный';
  renderResponsibleStages([]);
}

function editResponsible(id){
  const item=
    state.responsibles.find(r=>
      r['Responsible ID']===id
    );

  if(!item){
    return;
  }

  el('responsibleId').value=id;
  el('responsibleName').value=
    item['ФИО']||'';
  el('responsibleEmail').value=
    item['Email']||'';
  el('responsibleFormTitle').textContent=
    'Редактирование ответственного';

  renderResponsibleStages(
    item.stages||[]
  );
}

function selectedResponsibleStages(){
  return [
    ...document.querySelectorAll(
      '.responsible-stage:checked'
    )
  ].map(input=>input.value);
}

function saveResponsibleForm(){
  const name=
    value('responsibleName').trim();

  const stages=
    selectedResponsibleStages();

  if(!name){
    showToast(
      'Укажите ФИО ответственного.',
      'error'
    );
    return;
  }

  if(!stages.length){
    showToast(
      'Выберите хотя бы один этап.',
      'error'
    );
    return;
  }

  call(
    'saveResponsible',
    {
      id:value('responsibleId'),
      name,
      email:value('responsibleEmail'),
      stages
    },
    ()=>{
      showToast('Ответственный сохранён.');
      resetResponsibleForm();
      loadData();
    }
  );
}

async function deleteResponsible(id){
  const item=
    state.responsibles.find(r=>
      r['Responsible ID']===id
    );

  const ok=await showConfirm(
    'Удалить ответственного "'+
    (item?item['ФИО']:'')+
    '"?'
  );

  if(!ok){
    return;
  }

  call(
    'deleteResponsible',
    id,
    ()=>{
      showToast('Ответственный удалён.');
      loadData();
    }
  );
}

function renderTemplateSelects(
  vacancyId='',
  stage=''
){
  el('templateVacancy').innerHTML=
    '<option value="">Выберите вакансию</option>'+
    state.vacancies
      .map(item=>
        '<option value="'+
        escapeHtml(item['Vacancy ID'])+
        '" '+
        (
          item['Vacancy ID']===vacancyId
            ? 'selected'
            : ''
        )+
        '>'+
        escapeHtml(item['Вакансия'])+
        '</option>'
      )
      .join('');

  el('templateStage').innerHTML=
    '<option value="">Выберите этап</option>'+
    (state.pipelineStatuses||[])
      .map(item=>
        '<option value="'+
        escapeHtml(item)+
        '" '+
        (
          item===stage
            ? 'selected'
            : ''
        )+
        '>'+
        escapeHtml(item)+
        '</option>'
      )
      .join('');
}

function renderTemplates(){
  el('templateCount').textContent=
    state.interviewTemplates.length+' шт.';

  el('templateList').innerHTML=
    table(
      [
        'Название',
        'Вакансия',
        'Этап',
        'Вопросов',
        ''
      ],
      state.interviewTemplates.map(item=>[
        item['Название']||'',
        item['Вакансия']||'',
        item['Этап']||'',
        String((item.questions||[]).length),
        actionButtons(
          'editTemplate',
          item['Template ID'],
          'deleteTemplate'
        )
      ])
    );
}

function resetTemplateForm(){
  el('templateId').value='';
  el('templateName').value='';
  el('templateQuestions').value='';
  el('templateFormTitle').textContent=
    'Новый шаблон интервью';

  renderTemplateSelects();
}

function editTemplate(id){
  const item=
    state.interviewTemplates.find(t=>
      t['Template ID']===id
    );

  if(!item){
    return;
  }

  el('templateId').value=id;
  el('templateName').value=
    item['Название']||'';
  el('templateQuestions').value=
    (item.questions||[]).join('\n');
  el('templateFormTitle').textContent=
    'Редактирование шаблона';

  renderTemplateSelects(
    item['Vacancy ID'],
    item['Этап']
  );
}

function saveTemplateForm(){
  const name=
    value('templateName').trim();

  const vacancyId=
    value('templateVacancy');

  const stage=
    value('templateStage');

  if(!name){
    showToast(
      'Укажите название шаблона.',
      'error'
    );
    return;
  }

  if(!vacancyId){
    showToast(
      'Выберите вакансию.',
      'error'
    );
    return;
  }

  if(!stage){
    showToast(
      'Выберите этап.',
      'error'
    );
    return;
  }

  const questions=
    value('templateQuestions')
      .split('\n')
      .map(q=>q.trim())
      .filter(Boolean);

  call(
    'saveInterviewTemplate',
    {
      id:value('templateId'),
      name,
      vacancyId,
      stage,
      questions
    },
    ()=>{
      showToast('Шаблон сохранён.');
      resetTemplateForm();
      loadData();
    }
  );
}

async function deleteTemplate(id){
  const item=
    state.interviewTemplates.find(t=>
      t['Template ID']===id
    );

  const ok=await showConfirm(
    'Удалить шаблон "'+
    (item?item['Название']:'')+
    '"?'
  );

  if(!ok){
    return;
  }

  call(
    'deleteInterviewTemplate',
    id,
    ()=>{
      showToast('Шаблон удалён.');
      loadData();
    }
  );
}

init();
</script>
