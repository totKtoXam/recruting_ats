<div class="page-header">
  <div>
    <h2>Настройки ATS</h2>
    <p class="page-description">
      Вакансии, источники, ответственные и шаблоны интервью.
    </p>
  </div>
</div>

<div class="tabs admin-tabs">
  <button
    class="tab active"
    data-admin-tab="vacancies"
    onclick="showAdminTab('vacancies', this)"
  >
    Вакансии
  </button>

  <button
    class="tab"
    data-admin-tab="sources"
    onclick="showAdminTab('sources', this)"
  >
    Источники
  </button>

  <button
    class="tab"
    data-admin-tab="responsibles"
    onclick="showAdminTab('responsibles', this)"
  >
    Ответственные
  </button>

  <button
    class="tab"
    data-admin-tab="templates"
    onclick="showAdminTab('templates', this)"
  >
    Шаблоны интервью
  </button>
</div>

<section
  id="admin-vacancies"
  class="admin-page-section active"
>
  <div class="admin-layout">
    <aside class="admin-form-card">
      <div class="section-title-row">
        <h3 id="vacancyFormTitle">Новая вакансия</h3>
        <button
          class="button button-small button-secondary"
          onclick="resetVacancyForm()"
        >
          Очистить
        </button>
      </div>

      <input id="vacancyId" type="hidden">

      <div class="field">
        <label for="vacancyName">Название *</label>
        <input id="vacancyName">
      </div>

      <div class="field">
        <label for="vacancyStatus">Статус *</label>
        <select id="vacancyStatus">
          <option value="Открыта">Открыта</option>
          <option value="На паузе">На паузе</option>
          <option value="Закрыта">Закрыта</option>
        </select>
      </div>

      <div class="field">
        <label for="vacancyComment">Комментарий</label>
        <textarea id="vacancyComment"></textarea>
      </div>

      <div class="actions">
        <button
          class="button button-primary"
          onclick="saveVacancyForm()"
        >
          Сохранить
        </button>
      </div>
    </aside>

    <div class="admin-list-card">
      <div class="section-title-row">
        <h3>Вакансии</h3>
        <span id="vacancyCount" class="muted"></span>
      </div>
      <div id="vacancyList"></div>
    </div>
  </div>
</section>

<section
  id="admin-sources"
  class="admin-page-section"
>
  <div class="admin-layout">
    <aside class="admin-form-card">
      <div class="section-title-row">
        <h3 id="sourceFormTitle">Новый источник</h3>
        <button
          class="button button-small button-secondary"
          onclick="resetSourceForm()"
        >
          Очистить
        </button>
      </div>

      <input id="sourceId" type="hidden">

      <div class="field">
        <label for="sourceName">Название *</label>
        <input id="sourceName">
      </div>

      <div class="actions">
        <button
          class="button button-primary"
          onclick="saveSourceForm()"
        >
          Сохранить
        </button>
      </div>
    </aside>

    <div class="admin-list-card">
      <div class="section-title-row">
        <h3>Источники</h3>
        <span id="sourceCount" class="muted"></span>
      </div>
      <div id="sourceList"></div>
    </div>
  </div>
</section>

<section
  id="admin-responsibles"
  class="admin-page-section"
>
  <div class="admin-layout">
    <aside class="admin-form-card">
      <div class="section-title-row">
        <h3 id="responsibleFormTitle">
          Новый ответственный
        </h3>
        <button
          class="button button-small button-secondary"
          onclick="resetResponsibleForm()"
        >
          Очистить
        </button>
      </div>

      <input id="responsibleId" type="hidden">

      <div class="field">
        <label for="responsibleName">ФИО *</label>
        <input id="responsibleName">
      </div>

      <div class="field">
        <label for="responsibleEmail">Email</label>
        <input id="responsibleEmail" type="email">
      </div>

      <div class="field">
        <label>Доступные этапы *</label>
        <div
          id="responsibleStages"
          class="stage-multiselect"
        ></div>
      </div>

      <div class="actions">
        <button
          class="button button-primary"
          onclick="saveResponsibleForm()"
        >
          Сохранить
        </button>
      </div>
    </aside>

    <div class="admin-list-card">
      <div class="section-title-row">
        <h3>Ответственные</h3>
        <span id="responsibleCount" class="muted"></span>
      </div>
      <div id="responsibleList"></div>
    </div>
  </div>
</section>

<section
  id="admin-templates"
  class="admin-page-section"
>
  <div class="admin-layout">
    <aside class="admin-form-card">
      <div class="section-title-row">
        <h3 id="templateFormTitle">
          Новый шаблон интервью
        </h3>
        <button
          class="button button-small button-secondary"
          onclick="resetTemplateForm()"
        >
          Очистить
        </button>
      </div>

      <input id="templateId" type="hidden">

      <div class="field">
        <label for="templateName">Название *</label>
        <input id="templateName">
      </div>

      <div class="field">
        <label for="templateVacancy">Вакансия *</label>
        <select id="templateVacancy"></select>
      </div>

      <div class="field">
        <label for="templateStage">Этап *</label>
        <select id="templateStage"></select>
      </div>

      <div class="field">
        <label for="templateQuestions">Вопросы</label>
        <textarea
          id="templateQuestions"
          class="questions-textarea"
          placeholder="Один вопрос на строку"
        ></textarea>
      </div>

      <div class="actions">
        <button
          class="button button-primary"
          onclick="saveTemplateForm()"
        >
          Сохранить
        </button>
      </div>
    </aside>

    <div class="admin-list-card">
      <div class="section-title-row">
        <h3>Шаблоны интервью</h3>
        <span id="templateCount" class="muted"></span>
      </div>
      <div id="templateList"></div>
    </div>
  </div>
</section>
