<style>
*{box-sizing:border-box}

:root{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#172033;
  background:#f4f7fb;
  --surface:#fff;
  --surface-2:#f8fafc;
  --surface-3:#f1f5f9;
  --line:#e4e9f1;
  --line-strong:#d4dce8;
  --text:#172033;
  --muted:#6b7588;
  --primary:#4f46e5;
  --primary-strong:#4338ca;
  --danger:#dc2626;
  --success:#15803d;
  --shadow:0 12px 34px rgba(31,41,55,.09);
  --radius:16px;
}

html,body{margin:0;min-height:100%;overflow-x:hidden}
body{
  background:
    radial-gradient(circle at 20% 0,rgba(99,102,241,.05),transparent 28%),
    linear-gradient(180deg,#f9fbff 0,#f4f7fb 360px,#f4f7fb 100%);
  color:var(--text)
}

*{
  scrollbar-width:thin;
  scrollbar-color:#94a3b8 #e8edf4
}

*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-track{background:#e8edf4;border-radius:999px}
*::-webkit-scrollbar-thumb{
  background:linear-gradient(180deg,#a3afc2,#7f8ca3);
  border:2px solid #e8edf4;
  border-radius:999px
}
*::-webkit-scrollbar-thumb:hover{background:linear-gradient(180deg,#8794aa,#64748b)}
*::-webkit-scrollbar-corner{background:#e8edf4}

button,input,select,textarea{font:inherit}
button{border:0}
a{color:var(--primary)}
[hidden]{display:none!important}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  min-height:68px;
  padding:11px 24px;
  background:rgba(15,23,42,.97);
  backdrop-filter:blur(12px);
  color:#fff;
  box-shadow:0 7px 26px rgba(15,23,42,.14)
}

.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  font-weight:800;font-size:18px;
  box-shadow:0 8px 18px rgba(99,102,241,.35)
}
.topbar h1{margin:0;font-size:18px;letter-spacing:-.02em}
.subtitle{color:#aab5c8;font-size:12px;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:8px}

.nav-button{
  padding:9px 13px;
  border-radius:10px;
  background:transparent;
  color:#cbd5e1;
  cursor:pointer;
  transition:.16s ease
}
.nav-button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-button.nav-active{
  background:#fff;
  color:#111827;
  box-shadow:0 4px 12px rgba(0,0,0,.14)
}

.sync-status{font-size:12px;color:#fbbf24;margin-right:6px;white-space:nowrap}
.sync-status.sync-ready{color:#86efac}

.page{
  width:100%;
  max-width:none;
  margin:0;
  padding:22px 20px 36px
}

.page-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:20px;
  margin-bottom:18px
}
.page-header h2{margin:0;font-size:28px;letter-spacing:-.03em}
.page-description{margin:6px 0 0;color:var(--muted);font-size:14px}
.page-actions{display:flex;gap:9px;align-items:center}

.surface,
.form-card,
.admin-form-card,
.admin-list-card,
.history-card,
.candidate-column{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(15,23,42,.03)
}

.surface{padding:15px}

.filters{
  display:grid;
  grid-template-columns:minmax(260px,2fr) repeat(3,minmax(170px,1fr)) auto;
  gap:12px;
  align-items:end;
  margin-bottom:16px
}

.field{
  display:flex;
  flex-direction:column;
  gap:7px;
  min-width:0
}
.field.full{grid-column:1/-1}
.field.compact{gap:5px}
.field label{font-size:12px;font-weight:700;color:#4b5565}
.field-hint{color:#8a94a6;font-size:11px}

input,
select,
textarea{
  width:100%;
  border:1px solid var(--line-strong);
  background:#fff;
  color:var(--text);
  padding:10px 12px;
  border-radius:11px;
  outline:none;
  transition:border-color .15s,box-shadow .15s,background .15s
}

select{
  appearance:none;
  -webkit-appearance:none;
  padding-right:38px;
  background-image:
    linear-gradient(45deg,transparent 50%,#64748b 50%),
    linear-gradient(135deg,#64748b 50%,transparent 50%),
    linear-gradient(to right,#e6ebf2,#e6ebf2);
  background-position:
    calc(100% - 17px) 50%,
    calc(100% - 12px) 50%,
    calc(100% - 34px) 50%;
  background-size:5px 5px,5px 5px,1px 20px;
  background-repeat:no-repeat
}

select:hover{background-color:#fbfcfe}

input:hover,
select:hover,
textarea:hover{border-color:#bcc8d9}

input:focus,
select:focus,
textarea:focus{
  border-color:#818cf8;
  box-shadow:0 0 0 4px rgba(99,102,241,.10)
}

input.input-error{
  border-color:#ef4444;
  box-shadow:0 0 0 4px rgba(239,68,68,.08)
}

textarea{min-height:92px;resize:vertical}
input:disabled,select:disabled,textarea:disabled,button:disabled{opacity:.58;cursor:not-allowed}
.search-field input{padding-left:13px}

.toggle{
  height:42px;
  display:flex;
  align-items:center;
  gap:8px;
  padding:0 12px;
  border:1px solid var(--line-strong);
  border-radius:11px;
  background:#fff;
  color:#4b5565;
  font-size:13px
}
.toggle input{width:auto}

.button{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  min-height:38px;
  padding:9px 14px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  transition:transform .12s,box-shadow .12s,background .12s,color .12s
}
.button:hover:not(:disabled){transform:translateY(-1px)}
.button-primary{
  background:linear-gradient(135deg,#5b5cf0,#4f46e5);
  color:#fff;
  box-shadow:0 7px 16px rgba(79,70,229,.22)
}
.button-primary:hover:not(:disabled){box-shadow:0 9px 20px rgba(79,70,229,.3)}
.button-secondary{background:#eef2f7;color:#263144}
.button-secondary:hover:not(:disabled){background:#e4e9f1}
.button-ghost{background:transparent;color:#475569}
.button-ghost:hover:not(:disabled){background:#f1f5f9}
.button-danger{background:#dc2626;color:#fff}
.button-small{min-height:30px;padding:5px 9px;font-size:12px}
.button-icon{font-size:16px}
.danger-text{color:#dc2626}
.is-loading{pointer-events:none}

.spinner{
  width:14px;
  height:14px;
  border:2px solid rgba(255,255,255,.45);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .75s linear infinite;
  display:inline-block;
  flex:0 0 auto
}
.spinner-dark{border-color:#cbd5e1;border-top-color:#475569}
@keyframes spin{to{transform:rotate(360deg)}}

.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:16px}
.stat{
  min-width:116px;
  padding:12px 14px;
  border-radius:14px;
  background:#fff;
  border:1px solid var(--line)
}
.stat span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.stat b{font-size:21px}
.stat-main{border-color:#c7d2fe;background:#eef2ff}
.stat-status{border-color:transparent}
.status-bg-new{background:#eff6ff}
.status-bg-hr{background:#f5f3ff}
.status-bg-tech{background:#ecfeff}
.status-bg-final{background:#fff7ed}
.status-bg-offer{background:#fefce8}
.status-bg-hired{background:#ecfdf5}
.status-bg-rejected{background:#fef2f2}

.board{
  display:flex;
  align-items:stretch;
  gap:12px;
  width:calc(100vw - 40px);
  max-width:100%;
  min-height:430px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:2px 2px 14px;
  scroll-snap-type:x proximity
}

.board-placeholder,
.empty-state{
  width:100%;
  padding:28px;
  border:1px dashed #cbd5e1;
  border-radius:14px;
  color:#7a8597;
  background:#fff;
  text-align:center
}
.empty-state.compact{padding:14px}

.column{
  flex:1 0 270px;
  min-width:270px;
  min-height:410px;
  padding:10px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#eef2f7;
  transition:.15s ease;
  scroll-snap-align:start
}

.column-new{background:#f4f8ff;border-top:3px solid #3b82f6}
.column-hr{background:#f7f5ff;border-top:3px solid #8b5cf6}
.column-tech{background:#f0fdff;border-top:3px solid #06b6d4}
.column-final{background:#fff8f1;border-top:3px solid #f97316}
.column-offer{background:#fffdf0;border-top:3px solid #eab308}
.column-hired{background:#f0fdf6;border-top:3px solid #22c55e}
.column-rejected{background:#fff5f5;border-top:3px solid #ef4444}
.column.drag-over{outline:2px dashed #6366f1;outline-offset:-5px}
.column.collapsed{flex:0 0 56px;min-width:56px;min-height:170px}
.column.collapsed .cards{display:none}
.column.collapsed .column-title{writing-mode:vertical-rl;min-height:150px;align-items:center}

.column-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin:2px 2px 10px
}
.column-title>div{display:flex;align-items:center;gap:7px}
.column-count{
  font-size:11px;
  color:#667085;
  background:rgba(255,255,255,.78);
  padding:2px 6px;
  border-radius:999px
}
.icon-button{background:transparent;cursor:pointer;color:#6b7280;padding:4px 7px;border-radius:8px}
.icon-button:hover{background:#fff}

.candidate-card{
  position:relative;
  margin-bottom:10px;
  padding:13px;
  border:1px solid #e4e9f0;
  border-left-width:4px;
  border-radius:13px;
  background:#fff;
  cursor:pointer;
  box-shadow:0 4px 12px rgba(15,23,42,.04);
  transition:transform .13s,box-shadow .13s
}
.candidate-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08)}
.candidate-card.candidate-pending{cursor:progress;background:#fffdf5}
.card-new{border-left-color:#3b82f6}
.card-hr{border-left-color:#8b5cf6}
.card-tech{border-left-color:#06b6d4}
.card-final{border-left-color:#f97316}
.card-offer{border-left-color:#eab308}
.card-hired{border-left-color:#22c55e}
.card-rejected{border-left-color:#ef4444}
.candidate-card.dragging{opacity:.45}

.candidate-card-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:8px;
  margin-bottom:8px
}
.candidate-number{
  display:flex;
  align-items:center;
  gap:5px;
  color:#8b95a7;
  font-size:10px;
  font-weight:800;
  margin-bottom:3px
}
.candidate-name{font-weight:780;line-height:1.25}
.candidate-meta-row{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:12px;color:#677386}
.candidate-meta-row>span:first-child{min-width:18px;color:#94a3b8}
.card-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.card-link{text-decoration:none;font-size:12px;font-weight:700}

.status-chip,
.mini-chip{
  display:inline-flex;
  align-items:center;
  gap:5px;
  width:max-content;
  padding:5px 9px;
  border-radius:999px;
  font-size:12px;
  font-weight:750;
  border:1px solid transparent;
  white-space:nowrap
}
.status-chip.small,.mini-chip{padding:3px 7px;font-size:10px}
.status-new,.status-soft-new{color:#1d4ed8;background:#dbeafe;border-color:#bfdbfe}
.status-hr,.status-soft-hr{color:#6d28d9;background:#ede9fe;border-color:#ddd6fe}
.status-tech,.status-soft-tech{color:#0e7490;background:#cffafe;border-color:#a5f3fc}
.status-final,.status-soft-final{color:#c2410c;background:#ffedd5;border-color:#fed7aa}
.status-offer,.status-soft-offer{color:#a16207;background:#fef9c3;border-color:#fef08a}
.status-hired,.status-soft-hired{color:#15803d;background:#dcfce7;border-color:#bbf7d0}
.status-rejected,.status-soft-rejected{color:#b91c1c;background:#fee2e2;border-color:#fecaca}
.status-neutral{color:#475569;background:#f1f5f9;border-color:#e2e8f0}

.vacancy-open{color:#15803d;background:#dcfce7;border-color:#bbf7d0}
.vacancy-paused{color:#a16207;background:#fef3c7;border-color:#fde68a}
.vacancy-closed{color:#475569;background:#e2e8f0;border-color:#cbd5e1}

.brand-icon{
  width:24px;
  height:24px;
  flex:0 0 24px;
  display:inline-grid;
  place-items:center;
  border-radius:7px;
  font-size:10px;
  font-weight:900;
  letter-spacing:-.02em
}
.brand-linkedin{background:#0a66c2;color:#fff}
.brand-github{background:#111827;color:#fff}
.brand-telegram{background:#229ed9;color:#fff}
.brand-hh{background:#e31e24;color:#fff}
.brand-referral{background:#fef3c7;color:#a16207}
.brand-internal{background:#dcfce7;color:#15803d}
.brand-generic{background:#e2e8f0;color:#475569}

.social-icon{
  display:inline-grid;
  place-items:center;
  width:20px;
  height:20px;
  margin-right:4px;
  border-radius:5px;
  font-size:9px;
  font-weight:900;
  vertical-align:middle
}
.social-icon.telegram{background:#229ed9;color:#fff}
.social-icon.github{background:#111827;color:#fff}
.social-icon.linkedin{background:#0a66c2;color:#fff}

.select-with-brand,
.input-with-brand{
  position:relative;
  display:flex;
  align-items:center
}
.select-with-brand .brand-icon,
.input-with-brand .brand-icon{
  position:absolute;
  left:9px;
  z-index:2
}
.select-with-brand select,
.input-with-brand input{padding-left:42px}

.modal{
  position:fixed;
  inset:0;
  z-index:40;
  display:none;
  align-items:center;
  justify-content:center;
  padding:16px;
  background:rgba(15,23,42,.58);
  backdrop-filter:blur(5px)
}
.modal.open{display:flex}
.modal-top{z-index:50}

.panel{
  width:min(900px,100%);
  max-height:92vh;
  overflow-y:auto;
  padding:20px;
  border-radius:20px;
  background:#f8fafc;
  box-shadow:0 24px 80px rgba(15,23,42,.25)
}

.candidate-panel{
  width:min(1680px,97vw);
  height:min(900px,92vh);
  max-height:92vh;
  overflow:hidden;
  padding:16px;
  display:flex;
  flex-direction:column
}

.candidate-header{
  display:grid;
  grid-template-columns:minmax(260px,.9fr) minmax(360px,1.2fr) auto;
  gap:16px;
  align-items:center;
  padding:2px 2px 14px;
  border-bottom:1px solid var(--line)
}

.candidate-header-title{min-width:0}
.candidate-header-title h2{
  margin:3px 0 0;
  font-size:24px;
  line-height:1.15;
  letter-spacing:-.025em;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap
}

.candidate-header-flow{
  min-width:0;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap
}

.candidate-header-actions{
  display:flex;
  justify-content:flex-end;
  align-items:center;
  gap:7px;
  flex-wrap:wrap
}

.candidate-layout{
  min-height:0;
  flex:1;
  display:grid;
  grid-template-columns:minmax(360px,1.15fr) minmax(320px,.9fr) minmax(340px,1fr);
  gap:12px;
  padding-top:12px;
  position:relative
}

.candidate-column{
  min-width:0;
  min-height:0;
  height:100%;
  overflow-y:auto;
  padding:15px
}

.compact-heading{margin-bottom:13px}
.section-heading{
  display:flex;
  justify-content:space-between;
  gap:12px;
  margin-bottom:16px
}
.section-heading h3{margin:0;font-size:16px}
.section-heading p{margin:4px 0 0;color:var(--muted);font-size:12px}

.candidate-fields{display:flex;flex-direction:column;gap:11px}
.name-grid{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px
}
.social-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:10px
}

.panel-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:14px;
  margin-bottom:14px
}
.panel-header h2{margin:2px 0 0;font-size:24px;letter-spacing:-.02em}
.eyebrow{
  font-size:10px;
  font-weight:850;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#8b95a7
}
.icon-close{
  width:36px;
  height:36px;
  border-radius:10px;
  background:#e9eef5;
  color:#475569;
  font-size:22px;
  cursor:pointer;
  flex:0 0 auto
}
.icon-close:hover{background:#dde4ee}

.form-card{padding:18px;position:relative}
.form-card-flat{box-shadow:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid.one{grid-template-columns:1fr}
.field-header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.actions{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.actions .left{margin-right:auto}

.file-drop{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:12px;
  min-height:76px;
  padding:13px;
  border:1px dashed #bec9db;
  border-radius:13px;
  background:#f8fafc;
  color:#64748b;
  cursor:pointer
}
.file-drop:hover{border-color:#818cf8;background:#f5f7ff}
.file-drop input{display:none}
.file-drop-icon{
  width:36px;height:36px;border-radius:10px;
  display:grid;place-items:center;
  background:#eef2ff;color:#4f46e5;
  font-size:19px;font-weight:900
}
.file-drop strong{display:block;font-size:12px;color:#374151}
.file-drop small{display:block;margin-top:2px;font-size:10px;color:#94a3b8}

.resume-selected{margin-top:8px}
.resume-versions{display:flex;flex-direction:column;gap:7px;margin-top:9px}
.resume-versions-title{font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:#8a94a6}
.resume-version{
  display:grid;
  grid-template-columns:auto 1fr auto;
  gap:9px;
  align-items:center;
  padding:9px 10px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  color:inherit;
  text-decoration:none
}
.resume-version:hover{border-color:#c7d2fe;background:#fafaff}
.resume-version strong{display:block;font-size:12px}
.resume-version small{display:block;margin-top:2px;color:#8a94a6;font-size:10px}
.resume-version-index{
  min-width:28px;height:24px;padding:0 5px;
  display:grid;place-items:center;
  border-radius:7px;
  background:#eef2ff;
  color:#4f46e5;
  font-size:9px;font-weight:900
}
.resume-open{color:#64748b}
.resume-ok{
  width:22px;height:22px;display:grid;place-items:center;
  border-radius:50%;background:#dcfce7;color:#15803d;font-weight:900
}
.selected-file{background:#f8fafc}

.resource-link{
  min-height:42px;
  display:flex;
  align-items:center;
  padding:10px 12px;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fff;
  text-decoration:none;
  font-size:12px;
  font-weight:700
}
.resource-link:empty::before{content:"Будет создана после сохранения";color:#9aa4b4;font-weight:500}

.preview-link{
  font-size:10px;
  color:#64748b;
  word-break:break-all;
  text-decoration:none
}

.link-item{
  display:grid;
  grid-template-columns:.8fr 1.4fr auto;
  gap:7px;
  margin-bottom:7px
}

.transition-bar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:6px;
  margin:0
}
.transition-pill{
  padding:6px 10px;
  border-radius:999px;
  border:1px solid transparent;
  cursor:pointer;
  font-size:10px;
  font-weight:800
}
.transition-arrow{color:#94a3b8;margin:0 4px}

.history-card{
  padding:13px;
  margin-bottom:9px
}
.history-title{
  display:flex;
  justify-content:space-between;
  gap:8px;
  align-items:flex-start
}
.history-meta{margin-top:6px}

.qa{
  margin-top:8px;
  padding:9px 10px;
  border-radius:10px;
  background:#f8fafc;
  border:1px solid #edf1f6
}
.qa strong{
  display:block;
  margin-bottom:4px;
  font-size:11px;
  color:#5c6677
}

.interview-question{
  display:grid;
