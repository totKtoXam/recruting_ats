<style>
  * {
    box-sizing: border-box;
  }

  :root {
    font-family:
      Inter,
      Arial,
      sans-serif;

    color:
      #1f2937;

    background:
      #f5f7fb;
  }

  body {
    margin: 0;
    min-height: 100vh;
  }

  button,
  input,
  select,
  textarea {
    font: inherit;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 16px;

    padding:
      16px
      22px;

    color:
      #fff;

    background:
      #111827;

    box-shadow:
      0
      2px
      12px
      rgba(0, 0, 0, .12);
  }

  .topbar h1 {
    margin: 0;
    font-size: 20px;
  }

  .subtitle {
    margin-top: 3px;

    font-size: 12px;

    color:
      #9ca3af;
  }

  .page {
    padding: 20px;
  }

  .toolbar {
    display: flex;

    margin-bottom: 14px;
  }

  .search {
    width: min(520px, 100%);

    padding:
      11px
      12px;

    border:
      1px solid
      #d1d5db;

    border-radius:
      10px;

    background:
      #fff;
  }

  .stats {
    display: flex;
    flex-wrap: wrap;

    gap: 10px;

    margin-bottom: 18px;
  }

  .stat {
    min-width: 120px;

    padding:
      12px
      14px;

    border:
      1px solid
      #e5e7eb;

    border-radius:
      12px;

    background:
      #fff;

    box-shadow:
      0
      1px
      2px
      rgba(0, 0, 0, .04);
  }

  .stat span {
    display: block;

    margin-bottom: 4px;

    color:
      #6b7280;

    font-size: 12px;
  }

  .stat b {
    font-size: 22px;
  }

  .board {
    display: grid;

    grid-template-columns:
      repeat(
        8,
        minmax(260px, 1fr)
      );

    align-items: start;

    gap: 12px;

    overflow-x: auto;

    padding-bottom: 20px;
  }

  .column {
    min-height: 380px;

    padding: 10px;

    border:
      1px solid
      #e5e7eb;

    border-radius:
      12px;

    background:
      #edf0f5;
  }

  .column.drag-over {
    outline:
      2px dashed
      #2563eb;

    outline-offset:
      -4px;
  }

  .column-title {
    display: flex;
    justify-content: space-between;

    gap: 10px;

    margin:
      2px
      3px
      10px;

    color:
      #374151;

    font-size: 13px;
    font-weight: 700;
  }

  .candidate-card {
    margin-bottom: 9px;

    padding: 12px;

    border:
      1px solid
      #e5e7eb;

    border-radius:
      10px;

    background:
      #fff;

    cursor:
      pointer;

    box-shadow:
      0
      1px
      3px
      rgba(0, 0, 0, .06);

    transition:
      transform .12s ease,
      box-shadow .12s ease;
  }

  .candidate-card:hover {
    transform:
      translateY(-1px);

    box-shadow:
      0
      5px
      16px
      rgba(0, 0, 0, .09);
  }

  .candidate-card.dragging {
    opacity: .5;
  }

  .candidate-name {
    font-weight: 700;
  }

  .candidate-meta {
    margin-top: 4px;

    color:
      #6b7280;

    font-size: 12px;
  }

  .button {
    padding:
      9px
      13px;

    border: 0;

    border-radius:
      8px;

    cursor: pointer;
  }

  .button-primary {
    color: #fff;
    background: #2563eb;
  }

  .button-secondary {
    color: #111827;
    background: #e5e7eb;
  }

  .button-danger {
    color: #fff;
    background: #dc2626;
  }

  .modal {
    position: fixed;
    inset: 0;
    z-index: 20;

    display: none;
    align-items: center;
    justify-content: center;

    padding: 16px;

    background:
      rgba(17, 24, 39, .58);
  }

  .modal.open {
    display: flex;
  }

  .panel {
    width:
      min(920px, 100%);

    max-height:
      92vh;

    overflow-y: auto;

    padding: 20px;

    border-radius:
      14px;

    background:
      #fff;

    box-shadow:
      0
      18px
      70px
      rgba(0, 0, 0, .25);
  }

  .panel-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;

    gap: 12px;
  }

  .panel-header h2 {
    margin: 0;
  }

  .tabs {
    display: flex;

    gap: 8px;

    margin:
      18px
      0;
  }

  .tab {
    padding:
      8px
      12px;

    border: 0;

    border-radius:
      8px;

    color:
      #111827;

    background:
      #e5e7eb;

    cursor: pointer;
  }

  .tab.active {
    color:
      #fff;

    background:
      #111827;
  }

  .tab-section {
    display: none;
  }

  .tab-section.active {
    display: block;
  }

  .form-grid {
    display: grid;

    grid-template-columns:
      repeat(
        2,
        minmax(0, 1fr)
      );

    gap: 12px;
  }

  .field {
    display: flex;
    flex-direction: column;

    gap: 5px;
  }

  .field.full {
    grid-column:
      1 / -1;
  }

  label {
    color:
      #4b5563;

    font-size:
      12px;
  }

  input,
  select,
  textarea {
    width: 100%;

    padding:
      9px
      10px;

    border:
      1px solid
      #d1d5db;

    border-radius:
      8px;

    background:
      #fff;
  }

  textarea {
    min-height: 88px;
    resize: vertical;
  }

  .link-row {
    display: grid;

    grid-template-columns:
      1fr auto;

    gap: 8px;
  }

  .actions {
    display: flex;
    justify-content: flex-end;

    gap: 8px;

    margin-top: 16px;
  }

  .actions .left {
    margin-right: auto;
  }

  .interview {
    padding:
      14px
      0;

    border-bottom:
      1px solid
      #e5e7eb;
  }

  .interview:first-child {
    border-top:
      1px solid
      #e5e7eb;
  }

  .interview-row {
    margin-top: 7px;
  }

  .muted {
    color:
      #6b7280;

    font-size: 12px;
  }

  .loading {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 50;

    display: none;

    padding:
      9px
      12px;

    border-radius:
      9px;

    color:
      #fff;

    background:
      #111827;

    box-shadow:
      0
      5px
      20px
      rgba(0, 0, 0, .2);
  }

  .loading.active {
    display: block;
  }

  @media (
    max-width: 720px
  ) {
    .page {
      padding: 12px;
    }

    .topbar {
      padding: 14px;
    }

    .form-grid {
      grid-template-columns:
        1fr;
    }

    .field.full {
      grid-column: auto;
    }

    .board {
      grid-template-columns:
        repeat(
          8,
          86vw
        );
    }
  }
</style>
