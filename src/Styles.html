<style>
*{box-sizing:border-box}
:root{font-family:Inter,Arial,sans-serif;color:#1f2937;background:#f5f7fb}
body{margin:0;min-height:100vh}
button,input,select,textarea{font:inherit}
a{color:#2563eb}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 22px;color:#fff;background:#111827;box-shadow:0 2px 12px rgba(0,0,0,.12)}
.topbar h1,.panel-header h2{margin:0}
.subtitle,.muted{color:#9ca3af;font-size:12px}
.top-actions,.actions,.tabs,.transition-bar,.field-header{display:flex;gap:8px;align-items:center}
.page{padding:20px}
.filters{display:grid;grid-template-columns:minmax(240px,2fr) repeat(3,minmax(150px,1fr)) auto;gap:10px;margin-bottom:14px}
.filters input,.filters select{min-width:0}
.checkbox{display:flex;align-items:center;gap:6px;padding:0 8px;white-space:nowrap}
.checkbox input{width:auto}
.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.stat{min-width:120px;padding:12px 14px;border:1px solid #e5e7eb;border-radius:12px;background:#fff}
.stat span{display:block;margin-bottom:4px;color:#6b7280;font-size:12px}.stat b{font-size:22px}
.board{display:flex;align-items:flex-start;gap:12px;overflow-x:auto;padding-bottom:20px}
.column{flex:0 0 280px;min-height:360px;padding:10px;border:1px solid #e5e7eb;border-radius:12px;background:#edf0f5}
.column.collapsed{flex-basis:52px;min-height:160px}.column.collapsed .cards{display:none}.column.collapsed .column-title{writing-mode:vertical-rl;min-height:140px;align-items:center}
.column.drag-over{outline:2px dashed #2563eb;outline-offset:-4px}
.column-title{display:flex;justify-content:space-between;gap:8px;margin:2px 3px 10px;color:#374151;font-size:13px;font-weight:700}
.icon-button{border:0;background:transparent;cursor:pointer;padding:2px 5px}
.candidate-card{margin-bottom:9px;padding:12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.candidate-card.dragging{opacity:.45}.candidate-name{font-weight:700}.candidate-meta{margin-top:5px;color:#6b7280;font-size:12px}.card-actions{display:flex;gap:6px;margin-top:10px}
.button{padding:9px 13px;border:0;border-radius:8px;cursor:pointer}.button-small{padding:5px 8px;font-size:12px}.button-primary{color:#fff;background:#2563eb}.button-secondary{color:#111827;background:#e5e7eb}.button-danger{color:#fff;background:#dc2626}
.modal{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(17,24,39,.58)}.modal.open{display:flex}.modal-top{z-index:30}
.panel{width:min(860px,100%);max-height:92vh;overflow-y:auto;padding:20px;border-radius:14px;background:#fff;box-shadow:0 18px 70px rgba(0,0,0,.25)}.panel-wide{width:min(980px,100%)}.panel-admin{width:min(1100px,100%)}
.panel-header{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.badge{display:inline-block;margin-top:6px;padding:3px 8px;border-radius:999px;background:#e5e7eb;font-size:12px}
.tabs{margin:18px 0;flex-wrap:wrap}.tab{padding:8px 12px;border:0;border-radius:8px;color:#111827;background:#e5e7eb;cursor:pointer}.tab.active{color:#fff;background:#111827}.tab-section,.admin-section{display:none}.tab-section.active,.admin-section.active{display:block}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid.one{grid-template-columns:1fr}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field-header{justify-content:space-between}
label{color:#4b5563;font-size:12px}input,select,textarea{width:100%;padding:9px 10px;border:1px solid #d1d5db;border-radius:8px;background:#fff}textarea{min-height:86px;resize:vertical}.preview-link{font-size:12px;word-break:break-all}.actions{justify-content:flex-end;margin-top:16px}.actions .left{margin-right:auto}
.link-item,.question-item{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:8px}.question-item{grid-template-columns:1fr}.transition-bar{margin:16px 0;flex-wrap:wrap}.transition-button{border:1px solid #cbd5e1;background:#fff}
.history-card,.admin-card{margin-bottom:10px;padding:12px;border:1px solid #e5e7eb;border-radius:10px;background:#fff}.history-title{display:flex;justify-content:space-between;gap:10px}.qa{margin-top:8px;padding:8px;border-radius:8px;background:#f8fafc}.qa strong{display:block}
.admin-toolbar{display:flex;justify-content:flex-end;margin-bottom:10px}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left;vertical-align:top}.admin-table th{font-size:12px;color:#6b7280}.stage-multiselect{display:flex;flex-wrap:wrap;gap:8px}.stage-multiselect label{display:flex;align-items:center;gap:5px;padding:6px 8px;border:1px solid #e5e7eb;border-radius:8px}.stage-multiselect input{width:auto}
.loading{position:fixed;right:18px;bottom:18px;z-index:50;display:none;padding:9px 12px;border-radius:9px;color:#fff;background:#111827}.loading.active{display:block}
@media(max-width:800px){.page{padding:12px}.topbar{padding:14px}.filters{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.column{flex-basis:86vw}.admin-table{display:block;overflow-x:auto}.link-item{grid-template-columns:1fr}}
</style>
