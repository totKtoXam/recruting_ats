<style>
*{box-sizing:border-box}
:root{
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color:#172033;
  background:#f4f7fb;
  --surface:#fff;
  --surface-2:#f8fafc;
  --line:#e5eaf2;
  --line-strong:#d7deea;
  --text:#172033;
  --muted:#6b7588;
  --primary:#4f46e5;
  --primary-strong:#4338ca;
  --danger:#dc2626;
  --shadow:0 12px 32px rgba(31,41,55,.08);
  --radius:16px;
}
html,body{margin:0;min-height:100%}
body{background:linear-gradient(180deg,#f8fbff 0,#f4f7fb 320px,#f4f7fb 100%);color:var(--text)}
button,input,select,textarea{font:inherit}
button{border:0}
a{color:var(--primary)}
[hidden]{display:none!important}

.topbar{
  position:sticky;top:0;z-index:20;
  display:flex;align-items:center;justify-content:space-between;gap:18px;
  min-height:72px;padding:12px 28px;
  background:rgba(15,23,42,.96);backdrop-filter:blur(12px);
  color:#fff;box-shadow:0 8px 30px rgba(15,23,42,.12)
}
.brand{display:flex;align-items:center;gap:12px}
.brand-mark{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);font-weight:800;font-size:18px;
  box-shadow:0 8px 18px rgba(99,102,241,.35)
}
.topbar h1{margin:0;font-size:18px;letter-spacing:-.02em}
.subtitle{color:#aab5c8;font-size:12px;margin-top:2px}
.top-actions{display:flex;align-items:center;gap:8px}
.nav-button{
  padding:9px 13px;border-radius:10px;background:transparent;color:#cbd5e1;cursor:pointer;
  transition:.16s ease
}
.nav-button:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-button.nav-active{background:#fff;color:#111827;box-shadow:0 4px 12px rgba(0,0,0,.14)}
.sync-status{font-size:12px;color:#fbbf24;margin-right:6px;white-space:nowrap}
.sync-status.sync-ready{color:#86efac}

.page{padding:26px 30px 40px;max-width:1800px;margin:0 auto}
.page-header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:18px}
.page-header h2{margin:0;font-size:28px;letter-spacing:-.03em}
.page-description{margin:6px 0 0;color:var(--muted);font-size:14px}
.page-actions{display:flex;gap:9px;align-items:center}

.surface,.form-card,.admin-form-card,.admin-list-card,.history-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:0 1px 2px rgba(15,23,42,.03)
}
.surface{padding:16px}
.filters{
  display:grid;grid-template-columns:minmax(260px,2fr) repeat(3,minmax(170px,1fr)) auto;
  gap:12px;align-items:end;margin-bottom:18px
}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field.full{grid-column:1/-1}
.field.compact{gap:5px}
.field label{font-size:12px;font-weight:650;color:#4b5565}
.field-hint{color:#8a94a6;font-size:11px}
input,select,textarea{
  width:100%;border:1px solid var(--line-strong);background:#fff;color:var(--text);
  padding:10px 12px;border-radius:11px;outline:none;transition:border-color .15s,box-shadow .15s,background .15s
}
input:hover,select:hover,textarea:hover{border-color:#bfc9da}
input:focus,select:focus,textarea:focus{border-color:#818cf8;box-shadow:0 0 0 4px rgba(99,102,241,.10)}
input.input-error{border-color:#ef4444;box-shadow:0 0 0 4px rgba(239,68,68,.08)}
textarea{min-height:96px;resize:vertical}
input:disabled,select:disabled,textarea:disabled,button:disabled{opacity:.58;cursor:not-allowed}
.search-field input{padding-left:13px}
.toggle{height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line-strong);border-radius:11px;background:#fff;color:#4b5565;font-size:13px}
.toggle input{width:auto}

.button{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:38px;padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:650;
  transition:transform .12s,box-shadow .12s,background .12s,color .12s
}
.button:hover:not(:disabled){transform:translateY(-1px)}
.button-primary{background:linear-gradient(135deg,#5b5cf0,#4f46e5);color:#fff;box-shadow:0 7px 16px rgba(79,70,229,.22)}
.button-primary:hover:not(:disabled){box-shadow:0 9px 20px rgba(79,70,229,.3)}
.button-secondary{background:#eef2f7;color:#263144}
.button-secondary:hover:not(:disabled){background:#e4e9f1}
.button-ghost{background:transparent;color:#475569}
.button-ghost:hover:not(:disabled){background:#f1f5f9}
.button-danger{background:#dc2626;color:#fff}
.button-small{min-height:30px;padding:5px 9px;font-size:12px}
.button-icon{font-size:16px}
.danger-text{color:#dc2626}
.is-loading{pointer-events:none}

.spinner{
  width:14px;height:14px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;
  border-radius:50%;animation:spin .75s linear infinite;display:inline-block;flex:0 0 auto
}
.spinner-dark{border-color:#cbd5e1;border-top-color:#475569}
@keyframes spin{to{transform:rotate(360deg)}}

.stats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:18px}
.stat{
  min-width:120px;padding:13px 15px;border-radius:14px;background:#fff;border:1px solid var(--line)
}
.stat span{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.stat b{font-size:21px}
.stat-main{border-color:#c7d2fe;background:#eef2ff}
.stat-status{border-color:transparent}
.status-bg-new{background:#eff6ff}.status-bg-hr{background:#f5f3ff}.status-bg-tech{background:#ecfeff}.status-bg-final{background:#fff7ed}.status-bg-offer{background:#fefce8}.status-bg-hired{background:#ecfdf5}.status-bg-rejected{background:#fef2f2}

.board{display:flex;align-items:flex-start;gap:14px;overflow-x:auto;padding:2px 2px 20px}
.board-placeholder,.empty-state{
  width:100%;padding:28px;border:1px dashed #cbd5e1;border-radius:14px;color:#7a8597;background:#fff;text-align:center
}
.empty-state.compact{padding:16px}
.column{
  flex:0 0 290px;min-height:410px;padding:10px;border:1px solid var(--line);border-radius:16px;
  background:#eef2f7;transition:.15s ease
}
.column-new{background:#f4f8ff;border-top:3px solid #3b82f6}
.column-hr{background:#f7f5ff;border-top:3px solid #8b5cf6}
.column-tech{background:#f0fdff;border-top:3px solid #06b6d4}
.column-final{background:#fff8f1;border-top:3px solid #f97316}
.column-offer{background:#fffdf0;border-top:3px solid #eab308}
.column-hired{background:#f0fdf6;border-top:3px solid #22c55e}
.column-rejected{background:#fff5f5;border-top:3px solid #ef4444}
.column.drag-over{outline:2px dashed #6366f1;outline-offset:-5px}
.column.collapsed{flex-basis:56px;min-height:170px}
.column.collapsed .cards{display:none}
.column.collapsed .column-title{writing-mode:vertical-rl;min-height:150px;align-items:center}
.column-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:2px 2px 10px}
.column-title>div{display:flex;align-items:center;gap:7px}
.column-count{font-size:11px;color:#667085;background:rgba(255,255,255,.75);padding:2px 6px;border-radius:999px}
.icon-button{background:transparent;cursor:pointer;color:#6b7280;padding:4px 7px;border-radius:8px}
.icon-button:hover{background:#fff}

.candidate-card{
  position:relative;margin-bottom:10px;padding:13px;border:1px solid #e4e9f0;border-left-width:4px;
  border-radius:13px;background:#fff;cursor:pointer;box-shadow:0 4px 12px rgba(15,23,42,.04);
  transition:transform .13s,box-shadow .13s
}
.candidate-card:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,23,42,.08)}
.card-new{border-left-color:#3b82f6}.card-hr{border-left-color:#8b5cf6}.card-tech{border-left-color:#06b6d4}.card-final{border-left-color:#f97316}.card-offer{border-left-color:#eab308}.card-hired{border-left-color:#22c55e}.card-rejected{border-left-color:#ef4444}
.candidate-card.dragging{opacity:.45}
.candidate-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:8px}
.candidate-name{font-weight:750;line-height:1.25}
.candidate-meta-row{display:flex;gap:7px;margin-top:5px;font-size:12px;color:#677386}
.candidate-meta-row span:first-child{width:14px;color:#94a3b8}
.card-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:12px}
.card-link{text-decoration:none;font-size:12px;font-weight:650}

.status-chip,.mini-chip{
  display:inline-flex;align-items:center;gap:5px;width:max-content;padding:5px 9px;border-radius:999px;
  font-size:12px;font-weight:700;border:1px solid transparent;white-space:nowrap
}
.status-chip.small,.mini-chip{padding:3px 7px;font-size:10px}
.status-new,.status-soft-new{color:#1d4ed8;background:#dbeafe;border-color:#bfdbfe}
.status-hr,.status-soft-hr{color:#6d28d9;background:#ede9fe;border-color:#ddd6fe}
.status-tech,.status-soft-tech{color:#0e7490;background:#cffafe;border-color:#a5f3fc}
.status-final,.status-soft-final{color:#c2410c;background:#ffedd5;border-color:#fed7aa}
.status-offer,.status-soft-offer{color:#a16207;background:#fef9c3;border-color:#fef08a}
.status-hired,.status-soft-hired{color:#15803d;background:#dcfce7;border-color:#bbf7d0}
.status-rejected,.status-soft-rejected{color:#b91c1c;background:#fee2e2;border-color:#fecaca}
.status-neutral{color:#475569;background:#f1f5f9;border-color:#e2e8f0}
.vacancy-open{color:#15803d;background:#dcfce7;border-color:#bbf7d0}
.vacancy-paused{color:#a16207;background:#fef3c7;border-color:#fde68a}
.vacancy-closed{color:#475569;background:#e2e8f0;border-color:#cbd5e1}

.modal{
  position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
  padding:20px;background:rgba(15,23,42,.58);backdrop-filter:blur(5px)
}
.modal.open{display:flex}.modal-top{z-index:50}
.panel{
  width:min(880px,100%);max-height:92vh;overflow-y:auto;padding:22px;
  border-radius:20px;background:#f8fafc;box-shadow:0 24px 80px rgba(15,23,42,.25)
}
.panel-wide{width:min(1040px,100%)}
.panel-header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.panel-header h2{margin:2px 0 0;font-size:24px;letter-spacing:-.02em}
.eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#8b95a7}
.icon-close{width:36px;height:36px;border-radius:10px;background:#e9eef5;color:#475569;font-size:22px;cursor:pointer}
.icon-close:hover{background:#dde4ee}
.form-card{padding:18px;position:relative}
.form-card-flat{box-shadow:none}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.form-grid.one{grid-template-columns:1fr}
.section-heading{display:flex;justify-content:space-between;gap:12px;margin-bottom:16px}
.section-heading h3{margin:0;font-size:16px}.section-heading p{margin:4px 0 0;color:var(--muted);font-size:12px}
.field-header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.form-actions{margin-top:18px}
.actions{display:flex;justify-content:flex-end;gap:8px;align-items:center}.actions .left{margin-right:auto}
.file-drop{
  display:flex;align-items:center;justify-content:center;min-height:70px;padding:12px;
  border:1px dashed #c4cde0;border-radius:12px;background:#f8fafc;color:#64748b;cursor:pointer
}
.file-drop:hover{border-color:#818cf8;background:#f5f7ff}
.file-drop input{display:none}
.preview-link{font-size:12px;word-break:break-all;text-decoration:none}
.link-item{display:grid;grid-template-columns:1fr 2fr auto;gap:8px;margin-bottom:8px}
.transition-bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin:0 0 14px}
.transition-label{font-size:12px;color:#8a94a6}
.transition-pill{padding:6px 10px;border-radius:999px;border:1px solid transparent;cursor:pointer;font-size:11px;font-weight:750}
.transition-arrow{color:#94a3b8;margin:0 5px}
.history-section{margin-top:18px}
.history-card{padding:15px;margin-bottom:10px}
.history-title{display:flex;justify-content:space-between;gap:10px;align-items:center}
.history-meta{margin-top:7px}
.qa{margin-top:9px;padding:10px 12px;border-radius:11px;background:#f8fafc;border:1px solid #edf1f6}
.qa strong{display:block;margin-bottom:4px;font-size:11px;color:#5c6677}
.confirm-panel{width:min(440px,100%);text-align:center}
.confirm-icon{width:42px;height:42px;margin:0 auto 10px;border-radius:50%;display:grid;place-items:center;background:#fee2e2;color:#b91c1c;font-weight:900}

.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.tab{padding:9px 13px;border-radius:10px;background:#e9eef5;color:#475569;cursor:pointer;font-weight:650}
.tab.active{background:#111827;color:#fff}
.admin-page-section{display:none}.admin-page-section.active{display:block}
.admin-layout{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:18px;align-items:start}
.admin-form-card,.admin-list-card{padding:18px}
.admin-form-card{position:sticky;top:92px}
.section-title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:14px}
.section-title-row h3{margin:0;font-size:16px}
.counter-badge{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:28px;padding:0 8px;border-radius:999px;background:#eef2f7;color:#5a6575;font-size:11px;font-weight:800}
.nested-panel{margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.nested-panel-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.nested-panel-header h4{margin:2px 0 0}
.questions-textarea{min-height:150px}
.compact-actions{margin-top:10px}
.template-list{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.template-row{
  display:grid;grid-template-columns:24px 1fr auto;gap:9px;align-items:center;
  padding:10px;border:1px solid var(--line);border-radius:11px;background:#fff
}
.template-row-main{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.template-row-actions{display:flex;gap:5px}
.chip-wrap{display:flex;flex-wrap:wrap;gap:5px}

.admin-table{width:100%;border-collapse:separate;border-spacing:0}
.admin-table th{
  padding:9px 10px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.06em;
  color:#8a94a6;border-bottom:1px solid var(--line)
}
.admin-table td{padding:11px 10px;border-bottom:1px solid #edf1f5;vertical-align:middle;font-size:13px}
.admin-table tbody tr:hover{background:#fafbfe}
.table-scroll{overflow-x:auto}
.table-actions{display:flex;gap:4px;flex-wrap:wrap}
.empty-cell{padding:28px!important;text-align:center!important;color:#9aa4b4}
.row-pending{background:#fffbeb!important}
.sync-cell{width:20px;height:20px;display:inline-grid;place-items:center;border-radius:50%;font-size:12px;font-weight:900}
.sync-cell.idle{color:#c4ccd8}.sync-cell.success{color:#15803d;background:#dcfce7}.sync-cell.error{color:#b91c1c;background:#fee2e2}.sync-cell.pending{background:#f8fafc}
.stage-multiselect{display:flex;flex-wrap:wrap;gap:7px}
.stage-check{display:inline-flex;align-items:center;gap:6px;padding:6px 8px;border-radius:999px;border:1px solid transparent;font-size:11px;font-weight:700;cursor:pointer}
.stage-check input{width:auto;margin:0}

.is-busy{position:relative;pointer-events:none}
.is-busy::after{
  content:"";position:absolute;inset:0;z-index:5;border-radius:inherit;
  background:rgba(255,255,255,.58);backdrop-filter:blur(1px)
}
.is-refreshing .board,.is-refreshing .admin-layout,.is-refreshing .filters,.is-refreshing .stats{
  opacity:.55;pointer-events:none
}

.toast{
  position:fixed;right:20px;top:84px;z-index:100;display:none;max-width:min(420px,calc(100vw - 40px));
  padding:12px 15px;border-radius:12px;color:#fff;box-shadow:0 12px 32px rgba(15,23,42,.22);font-size:13px
}
.toast.active{display:block}.toast-success{background:#166534}.toast-error{background:#b91c1c}
.muted{color:var(--muted);font-size:12px}
.skeleton-card{opacity:.65}

@media(max-width:1050px){
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .admin-layout{grid-template-columns:1fr}
  .admin-form-card{position:static}
  .form-grid-3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media(max-width:720px){
  .topbar{padding:10px 14px;align-items:flex-start}.top-actions{flex-wrap:wrap;justify-content:flex-end}
  .sync-status{width:100%;text-align:right}
  .page{padding:16px 12px 30px}
  .page-header{flex-direction:column}.page-actions{width:100%}.page-actions .button{flex:1}
  .filters,.form-grid,.form-grid-3{grid-template-columns:1fr}
  .field.full{grid-column:auto}
  .column{flex-basis:86vw}
  .panel{padding:15px}
  .link-item{grid-template-columns:1fr}
  .template-row{grid-template-columns:24px 1fr}.template-row-actions{grid-column:2}
}
</style>
