<script>
let state={
  candidates:[],
  vacancies:[],
  sources:[],
  responsibles:[],
  interviewTemplates:[],
  dictionaries:{},
  transitions:{},
  pipelineStatuses:[],
  stats:{},
  interviews:[],
  loaded:{
    references:false,
    candidates:false,
    interviews:false
  }
};

let currentCandidate=null;
let pendingTransition=null;
let currentInterviews=[];
let editingInterview=null;
let confirmResolver=null;
let currentRoute='candidates';

const collapsedColumns=new Set();

function el(id){
  return document.getElementById(id);
}

function value(id){
  return el(id).value;
}

function escapeHtml(v){
  return String(v??'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");
}

function escJs(v){
  return String(v??'')
    .replaceAll('\\','\\\\')
    .replaceAll("'","\\'");
}

function option(value,label,selected){
  return (
    '<option value="'+
    escapeHtml(value)+
    '"'+
    (selected?' selected':'')+
    '>'+
    escapeHtml(label)+
    '</option>'
  );
}

function setLoading(v){
  el('loading')
    .classList
    .toggle('active',!!v);
}

function showToast(message,type='info'){
  const toast=el('toast');

  toast.textContent=message;
  toast.className=
    'toast active '+
    (type==='error'
      ? 'toast-error'
      : 'toast-success');

  clearTimeout(showToast.timer);

  showToast.timer=setTimeout(()=>{
    toast.className='toast';
  },3500);
}

function handleError(error){
  setLoading(false);

  showToast(
    error&&error.message
      ? error.message
      : String(error),
    'error'
  );
}

function showConfirm(
  message,
  title='Подтверждение'
){
  el('confirmTitle').textContent=title;
  el('confirmMessage').textContent=message;

  el('confirmModal')
    .classList
    .add('open');

  return new Promise(resolve=>{
    confirmResolver=resolve;
  });
}

function closeConfirm(result){
  el('confirmModal')
    .classList
    .remove('open');

  if(confirmResolver){
    confirmResolver(result);
    confirmResolver=null;
  }
}

function call(
  name,
  args,
  onSuccess
){
  setLoading(true);

  const runner=
    google.script.run
      .withFailureHandler(handleError)
      .withSuccessHandler(result=>{
        setLoading(false);

        if(onSuccess){
          onSuccess(result);
        }
      });

  if(args===undefined){
    runner[name]();
  }else{
    runner[name](args);
  }
}

function backgroundCall(
  name,
  args,
  onSuccess
){
  const runner=
    google.script.run
      .withFailureHandler(error=>{
        showToast(
          error&&error.message
            ? error.message
            : String(error),
          'error'
        );
      })
      .withSuccessHandler(result=>{
        if(onSuccess){
          onSuccess(result);
        }
      });

  if(args===undefined){
    runner[name]();
  }else{
    runner[name](args);
  }
}

function init(){
  initRouter();
  renderInitialShell();
  preloadAllData();
}

function initRouter(){
  window.addEventListener(
    'hashchange',
    applyRoute
  );

  if(!location.hash){
    const initial=
      window.__INITIAL_ROUTE__==='admin'
        ? 'admin'
        : 'candidates';

    history.replaceState(
      null,
      '',
      '#/'+initial
    );
  }

  applyRoute();
}

function navigateTo(route){
  const next=
    route==='admin'
      ? 'admin'
      : 'candidates';

  if(location.hash==='#/'+next){
    applyRoute();
    return;
  }

  location.hash='#/'+next;
}

function applyRoute(){
  const route=
    location.hash==='#/admin'
      ? 'admin'
      : 'candidates';

  currentRoute=route;

  el('viewCandidates').hidden=
    route!=='candidates';

  el('viewAdmin').hidden=
    route!=='admin';

  el('addCandidateTop').hidden=
    route!=='candidates';

  el('navCandidates')
    .classList
    .toggle(
      'nav-active',
      route==='candidates'
    );

  el('navAdmin')
    .classList
    .toggle(
      'nav-active',
      route==='admin'
    );

  if(route==='admin' &&
     typeof renderAdminAll==='function'){
    renderAdminAll();
  }
}

function renderInitialShell(){
  el('stats').innerHTML=
    '<div class="stat skeleton-card">'+
    '<span>Загрузка</span><b>…</b></div>';

  el('board').innerHTML=
    '<div class="board-placeholder">'+
    'Кандидаты загружаются в фоне…'+
    '</div>';

  updateSyncStatus();
}

function preloadAllData(){
  backgroundCall(
    'getReferenceData',
    undefined,
    data=>{
      state.vacancies=
        data.vacancies||[];

      state.sources=
        data.sources||[];

      state.responsibles=
        data.responsibles||[];

      state.interviewTemplates=
        data.interviewTemplates||[];

      state.dictionaries=
        data.dictionaries||{};

      state.transitions=
        data.transitions||{};

      state.pipelineStatuses=
        data.pipelineStatuses||[];

      state.loaded.references=true;

      populateGlobalFilters();
      render();

      if(typeof renderAdminAll==='function'){
        renderAdminAll();
      }

      updateSyncStatus();
    }
  );

  backgroundCall(
    'getCandidateData',
    undefined,
    data=>{
      state.candidates=
        data.candidates||[];

      state.stats=
        data.stats||{};

      state.loaded.candidates=true;

      populateGlobalFilters();
      render();
      updateSyncStatus();
    }
  );

  backgroundCall(
    'getAllInterviews',
    undefined,
    data=>{
      state.interviews=
        data||[];

      state.loaded.interviews=true;

      if(currentCandidate){
        setCurrentInterviews(
          currentCandidate.ID
        );
      }

      updateSyncStatus();
    }
  );
}

function updateSyncStatus(){
  const loaded=
    Object.values(state.loaded)
      .filter(Boolean)
      .length;

  const total=
    Object.keys(state.loaded)
      .length;

  const status=el('dataSyncStatus');

  if(loaded===total){
    status.textContent='Данные загружены';
    status.classList.add('sync-ready');
    return;
  }

  status.textContent=
    'Загрузка данных '+
    loaded+
    '/'+
    total;

  status.classList.remove('sync-ready');
}

function refreshReferences(after){
  backgroundCall(
    'getReferenceData',
    undefined,
    data=>{
      state.vacancies=
        data.vacancies||[];

      state.sources=
        data.sources||[];

      state.responsibles=
        data.responsibles||[];

      state.interviewTemplates=
        data.interviewTemplates||[];

      state.dictionaries=
        data.dictionaries||{};

      state.transitions=
        data.transitions||{};

      state.pipelineStatuses=
        data.pipelineStatuses||[];

      state.loaded.references=true;

      populateGlobalFilters();

      if(typeof renderAdminAll==='function'){
        renderAdminAll();
      }

      renderBoard();

      if(after){
        after();
      }
    }
  );
}

function refreshCandidates(after){
  backgroundCall(
    'getCandidateData',
    undefined,
    data=>{
      state.candidates=
        data.candidates||[];

      state.stats=
        data.stats||{};

      state.loaded.candidates=true;

      populateGlobalFilters();
      render();

      if(after){
        after();
      }
    }
  );
}

function refreshInterviews(after){
  backgroundCall(
    'getAllInterviews',
    undefined,
    data=>{
      state.interviews=
        data||[];

      state.loaded.interviews=true;

      if(currentCandidate){
        setCurrentInterviews(
          currentCandidate.ID
        );
      }

      if(after){
        after();
      }
    }
  );
}

function refreshAll(after){
  let remaining=3;

  const done=()=>{
    remaining--;

    if(remaining===0 && after){
      after();
    }
  };

  refreshReferences(done);
  refreshCandidates(done);
  refreshInterviews(done);
}

function getStatuses(){
  return state.pipelineStatuses||[];
}

function activeVacancies(){
  return state.vacancies.filter(
    vacancy=>
      vacancy['Статус']==='Открыта'
  );
}

function responsiblesFor(stage){
  return state.responsibles.filter(
    responsible=>
      (responsible.stages||[])
        .includes(stage)
  );
}

function populateGlobalFilters(){
  if(!el('filterVacancy')){
    return;
  }

  const old={
    vacancy:value('filterVacancy'),
    responsible:value('filterResponsible'),
    source:value('filterSource')
  };

  el('filterVacancy').innerHTML=
    option('','Все вакансии')+
    state.vacancies
      .map(item=>
        option(
          item['Vacancy ID'],
          item['Вакансия'],
          item['Vacancy ID']===
            old.vacancy
        )
      )
      .join('');

  el('filterResponsible').innerHTML=
    option('','Все ответственные')+
    state.responsibles
      .map(item=>
        option(
          item['Responsible ID'],
          item['ФИО'],
          item['Responsible ID']===
            old.responsible
        )
      )
      .join('');

  el('filterSource').innerHTML=
    option('','Все источники')+
    state.sources
      .map(item=>
        option(
          item['Source ID'],
          item['Название'],
          item['Source ID']===
            old.source
        )
      )
      .join('');
}

function render(){
  renderStats();
  renderBoard();
}

function renderStats(){
  const stats=state.stats||{};

  if(!state.loaded.candidates){
    return;
  }

  el('stats').innerHTML=
    '<div class="stat">'+
      '<span>Активные</span>'+
      '<b>'+(stats.total||0)+'</b>'+
    '</div>'+
    '<div class="stat">'+
      '<span>Архив</span>'+
      '<b>'+(stats.archived||0)+'</b>'+
    '</div>'+
    Object
      .entries(stats.byStatus||{})
      .map(([status,count])=>
        '<div class="stat">'+
          '<span>'+escapeHtml(status)+'</span>'+
          '<b>'+count+'</b>'+
        '</div>'
      )
      .join('');
}

function filteredCandidates(){
  const q=
    value('filterSearch')
      .trim()
      .toLowerCase();

  const vacancy=
    value('filterVacancy');

  const responsible=
    value('filterResponsible');

  const source=
    value('filterSource');

  const archived=
    el('filterArchived').checked;

  return state.candidates.filter(
    candidate=>{
      if(
        archived!==
        !!candidate.archived
      ){
        return false;
      }

      if(
        vacancy &&
        candidate['Vacancy ID']!==vacancy
      ){
        return false;
      }

      if(
        responsible &&
        candidate['Responsible ID']!==
          responsible
      ){
        return false;
      }

      if(
        source &&
        candidate['Source ID']!==source
      ){
        return false;
      }

      if(q){
        const haystack=[
          candidate['ФИО'],
          candidate['Телефон'],
          candidate['Email'],
          candidate['Telegram'],
          candidate['Вакансия'],
          candidate['Ответственный']
        ]
          .filter(Boolean)
          .join(' ')
          .toLowerCase();

        if(!haystack.includes(q)){
          return false;
        }
      }

      return true;
    }
  );
}

function renderBoard(){
  if(!state.loaded.candidates ||
     !state.loaded.references){
    return;
  }

  const archived=
    el('filterArchived').checked;

  const statuses=
    archived
      ? ['Отказ']
      : getStatuses();

  const candidates=
    filteredCandidates();

  el('board').innerHTML=
    statuses
      .map(status=>{
        const list=
          candidates.filter(
            candidate=>
              candidate['Статус']===
                status
          );

        const collapsed=
          collapsedColumns.has(status);

        return (
          '<section class="column '+
          (collapsed?'collapsed':'')+
          '" data-status="'+
          escapeHtml(status)+
          '" ondragover="dragOver(event)" '+
          'ondragleave="dragLeave(event)" '+
          'ondrop="dropCandidate(event)">'+

            '<div class="column-title">'+
              '<span>'+
                escapeHtml(status)+
                ' ('+list.length+')'+
              '</span>'+
              '<button class="icon-button" '+
                'onclick="event.stopPropagation();'+
                'toggleColumn(\''+
                escJs(status)+
                '\')">'+
                (collapsed?'›':'‹')+
              '</button>'+
            '</div>'+

            '<div class="cards">'+
              list
                .map(renderCard)
                .join('')+
            '</div>'+
          '</section>'
        );
      })
      .join('');
}

function renderCard(candidate){
  return (
    '<article class="candidate-card" '+
      'draggable="'+
      (!candidate.archived)+
      '" data-id="'+
      escapeHtml(candidate.ID)+
      '" ondragstart="dragStart(event)" '+
      'ondragend="dragEnd(event)" '+
      'onclick="openCandidateById(\''+
      escJs(candidate.ID)+
      '\')">'+

      '<div class="candidate-name">'+
        escapeHtml(candidate['ФИО'])+
      '</div>'+

      '<div class="candidate-meta">'+
        escapeHtml(
          candidate['Телефон']||''
        )+
      '</div>'+

      '<div class="candidate-meta">'+
        escapeHtml(
          candidate['Вакансия']||''
        )+
      '</div>'+

      '<div class="candidate-meta">'+
        escapeHtml(
          candidate['Ответственный']||''
        )+
      '</div>'+

      (
        candidate['Резюме']
          ? '<div class="card-actions">'+
            '<a href="'+
            escapeHtml(candidate['Резюме'])+
            '" target="_blank" rel="noopener" '+
            'onclick="event.stopPropagation()">'+
            'Резюме</a></div>'
          : ''
      )+

      (
        !candidate.archived
          ? '<div class="card-actions">'+
            '<button class="button button-small button-danger" '+
            'onclick="event.stopPropagation();'+
            'archiveById(\''+
            escJs(candidate.ID)+
            '\')">Архив</button></div>'
          : ''
      )+
    '</article>'
  );
}

function toggleColumn(status){
  if(collapsedColumns.has(status)){
    collapsedColumns.delete(status);
  }else{
    collapsedColumns.add(status);
  }

  renderBoard();
}

function dragStart(event){
  event.dataTransfer.setData(
    'text/plain',
    event.currentTarget.dataset.id
  );

  event.currentTarget
    .classList
    .add('dragging');
}

function dragEnd(event){
  event.currentTarget
    .classList
    .remove('dragging');

  document
    .querySelectorAll('.column')
    .forEach(column=>
      column.classList.remove(
        'drag-over'
      )
    );
}

function dragOver(event){
  event.preventDefault();

  event.currentTarget
    .classList
    .add('drag-over');
}

function dragLeave(event){
  event.currentTarget
    .classList
    .remove('drag-over');
}

function dropCandidate(event){
  event.preventDefault();

  event.currentTarget
    .classList
    .remove('drag-over');

  const id=
    event.dataTransfer.getData(
      'text/plain'
    );

  const status=
    event.currentTarget.dataset.status;

  startTransition(id,status);
}

function openCandidateById(id){
  const candidate=
    state.candidates.find(
      item=>
        String(item.ID)===
        String(id)
    );

  if(candidate){
    openCandidate(candidate);
  }
}

function openCandidate(candidate){
  if(!state.loaded.references){
    showToast(
      'Справочники ещё загружаются. Попробуйте через секунду.',
      'error'
    );
    return;
  }

  currentCandidate=
    candidate||null;

  const isNew=!candidate;

  el('candidateId').value=
    candidate?candidate.ID:'';

  el('candidateName').value=
    candidate
      ? candidate['ФИО']||''
      : '';

  el('candidatePhone').value=
    candidate
      ? candidate['Телефон']||''
      : '';

  el('candidateEmail').value=
    candidate
      ? candidate['Email']||''
      : '';

  el('candidateTelegram').value=
    candidate
      ? candidate['Telegram']||''
      : '';

  el('candidateSalary').value=
    candidate
      ? formatMoney(
          candidate[
            'Зарплатные ожидания'
          ]
        )
      : '';

  el('candidateComment').value=
    candidate
      ? candidate['Комментарий']||''
      : '';

  el('candidateTitle').textContent=
    isNew
      ? 'Новый кандидат'
      : candidate['ФИО'];

  el('candidateStatusLabel')
    .textContent=
      isNew
        ? 'Новый'
        : candidate['Статус'];

  const vacancies=
    isNew
      ? activeVacancies()
      : state.vacancies;

  el('candidateVacancy').innerHTML=
    option('','Выберите вакансию')+
    vacancies
      .map(item=>
        option(
          item['Vacancy ID'],
          item['Вакансия'],
          candidate &&
          item['Vacancy ID']===
            candidate['Vacancy ID']
        )
      )
      .join('');

  el('candidateSource').innerHTML=
    option('','Не указан')+
    state.sources
      .map(item=>
        option(
          item['Source ID'],
          item['Название'],
          candidate &&
          item['Source ID']===
            candidate['Source ID']
        )
      )
      .join('');

  const stage=
    isNew
      ? 'Новый'
      : candidate['Статус'];

  el('candidateResponsible').innerHTML=
    option(
      '',
      'Выберите ответственного'
    )+
    responsiblesFor(stage)
      .map(item=>
        option(
          item['Responsible ID'],
          item['ФИО'],
          candidate &&
          item['Responsible ID']===
            candidate['Responsible ID']
        )
      )
      .join('');

  el('candidateResumeFile').value='';

  setLink(
    'candidateResumeLink',
    candidate &&
      candidate['Резюме'],
    'Открыть резюме'
  );

  setLink(
    'candidateFolderLink',
    candidate &&
      candidate['Папка кандидата'],
    'Открыть папку кандидата'
  );

  renderCandidateLinks(
    candidate
      ? candidate.links||[]
      : []
  );

  renderTelegramPreview();

  el('archiveCandidateButton')
    .style
    .display=
      candidate &&
      !candidate.archived
        ? 'inline-block'
        : 'none';

  el('historyTabButton')
    .style
    .display=
      candidate
        ? 'inline-block'
        : 'none';

  renderTransitions();

  el('candidateModal')
    .classList
    .add('open');

  showCandidateTab(
    'candidateDetails',
    document.querySelector(
      '#candidateModal .tab'
    )
  );

  if(candidate){
    setCurrentInterviews(
      candidate.ID
    );
  }else{
    currentInterviews=[];
    renderInterviewHistory();
  }
}

function closeCandidate(){
  el('candidateModal')
    .classList
    .remove('open');

  currentCandidate=null;
}

function setLink(
  id,
  url,
  label
){
  const anchor=el(id);

  anchor.href=url||'';
  anchor.textContent=
    url
      ? label
      : '';
}

function showCandidateTab(
  id,
  button
){
  document
    .querySelectorAll(
      '#candidateModal .tab-section'
    )
    .forEach(section=>
      section.classList.remove(
        'active'
      )
    );

  document
    .querySelectorAll(
      '#candidateModal .tab'
    )
    .forEach(tab=>
      tab.classList.remove(
        'active'
      )
    );

  el(id)
    .classList
    .add('active');

  if(button){
    button.classList.add('active');
  }
}

function renderTransitions(){
  const root=
    el('candidateTransitions');

  if(
    !currentCandidate ||
    currentCandidate.archived
  ){
    root.innerHTML='';
    return;
  }

  const allowed=
    state.transitions[
      currentCandidate['Статус']
    ]||[];

  root.innerHTML=
    allowed
      .map(status=>
        '<button class="button transition-button" '+
          'onclick="startTransition(\''+
          escJs(currentCandidate.ID)+
          '\',\''+
          escJs(status)+
          '\')">→ '+
          escapeHtml(status)+
        '</button>'
      )
      .join('');
}

function renderCandidateLinks(links){
  el('candidateLinks').innerHTML=
    (links||[])
      .map(link=>
        linkRow(
          link.name,
          link.url
        )
      )
      .join('');
}

function linkRow(
  name='',
  url=''
){
  return (
    '<div class="link-item">'+
      '<input class="other-link-name" '+
      'placeholder="Название" value="'+
      escapeHtml(name)+
      '">'+
      '<input class="other-link-url" '+
      'placeholder="https://..." value="'+
      escapeHtml(url)+
      '">'+
      '<button class="button button-small button-danger" '+
      'type="button" '+
      'onclick="this.parentElement.remove()">×</button>'+
    '</div>'
  );
}

function addCandidateLink(){
  el('candidateLinks')
    .insertAdjacentHTML(
      'beforeend',
      linkRow()
    );
}

function collectLinks(){
  return [
    ...document.querySelectorAll(
      '#candidateLinks .link-item'
    )
  ].map(row=>({
    name:
      row.querySelector(
        '.other-link-name'
      ).value,
    url:
      row.querySelector(
        '.other-link-url'
      ).value
  }));
}

function renderTelegramPreview(){
  const raw=
    value('candidateTelegram')
      .trim();

  const anchor=
    el('telegramPreview');

  if(!raw){
    anchor.textContent='';
    anchor.removeAttribute('href');
    return;
  }

  let url=raw;

  if(!/^https?:\/\//i.test(raw)){
    const username=
      raw
        .replace(/^@/,'')
        .replace(/^t\.me\//i,'');

    url=
      'https://t.me/'+
      username;
  }

  anchor.href=url;
  anchor.textContent=url;
}

function formatMoney(v){
  const digits=
    String(v||'')
      .replace(/\D/g,'');

  return digits
    ? digits.replace(
        /\B(?=(\d{3})+(?!\d))/g,
        ' '
      )
    : '';
}

function formatMoneyInput(input){
  input.value=
    formatMoney(input.value);
}

function readResumeFile(){
  return new Promise(
    (resolve,reject)=>{
      const file=
        el('candidateResumeFile')
          .files[0];

      if(!file){
        resolve(null);
        return;
      }

      if(
        file.size>
        10*1024*1024
      ){
        reject(
          new Error(
            'Резюме не должно превышать 10 МБ.'
          )
        );
        return;
      }

      const reader=
        new FileReader();

      reader.onload=()=>resolve({
        name:file.name,
        mimeType:file.type,
        base64:
          String(reader.result)
            .split(',')[1]
      });

      reader.onerror=()=>reject(
        new Error(
          'Не удалось прочитать файл.'
        )
      );

      reader.readAsDataURL(file);
    }
  );
}

async function saveCandidateForm(){
  try{
    const resumeFile=
      await readResumeFile();

    const payload={
      ID:value('candidateId'),
      fullName:value('candidateName'),
      vacancyId:value('candidateVacancy'),
      phone:value('candidatePhone'),
      email:value('candidateEmail'),
      telegram:value('candidateTelegram'),
      salary:value('candidateSalary'),
      sourceId:value('candidateSource'),
      responsibleId:
        value('candidateResponsible'),
      comment:value('candidateComment'),
      links:collectLinks(),
      resumeFile
    };

    call(
      'saveCandidate',
      payload,
      response=>{
        showToast('Кандидат сохранён.');

        refreshCandidates(()=>{
          openCandidateById(
            response.candidate.ID
          );
        });
      }
    );
  }catch(error){
    handleError(error);
  }
}

function archiveCurrentCandidate(){
  if(currentCandidate){
    archiveById(
      currentCandidate.ID
    );
  }
}

async function archiveById(id){
  const ok=
    await showConfirm(
      'Архивировать кандидата? Статус станет "Отказ", причина — "Архивация".',
      'Архивация кандидата'
    );

  if(!ok){
    return;
  }

  call(
    'archiveCandidate',
    id,
    ()=>{
      showToast(
        'Кандидат архивирован.'
      );

      closeCandidate();
      refreshCandidates();
    }
  );
}

function startTransition(
  id,
  toStatus
){
  const candidate=
    state.candidates.find(
      item=>
        String(item.ID)===
        String(id)
    );

  if(
    !candidate ||
    candidate.archived ||
    candidate['Статус']===toStatus
  ){
    return;
  }

  const allowed=
    state.transitions[
      candidate['Статус']
    ]||[];

  if(!allowed.includes(toStatus)){
    showToast(
      'Переход '+
      candidate['Статус']+
      ' → '+
      toStatus+
      ' не разрешён.',
      'error'
    );

    return;
  }

  call(
    'getInterviewContext',
    {
      candidateId:id,
      toStatus
    },
    context=>{
      pendingTransition=context;

      el('transitionTitle')
        .textContent=
          context.fromStatus+
          ' → '+
          context.toStatus;

      el('transitionTemplate')
        .innerHTML=
          option('','Без шаблона')+
          (context.templates||[])
            .map((template,index)=>
              option(
                template['Template ID'],
                template['Название'],
                index===0
              )
            )
            .join('');

      const nextResponsibles=
        responsiblesFor(
          context.toStatus
        );

      el('transitionResponsible')
        .innerHTML=
          option(
            '',
            'Выберите ответственного'
          )+
          nextResponsibles
            .map(item=>
              option(
                item['Responsible ID'],
                item['ФИО'],
                item['Responsible ID']===
                  candidate[
                    'Responsible ID'
                  ]
              )
            )
            .join('');

      el('transitionComment').value='';
      el('transitionResult').value='';

      renderTransitionQuestions();

      el('transitionModal')
        .classList
        .add('open');
    }
  );
}

function closeTransition(){
  el('transitionModal')
    .classList
    .remove('open');

  pendingTransition=null;
}

function selectedTransitionTemplate(){
  const id=
    value('transitionTemplate');

  return pendingTransition
    ? (pendingTransition.templates||[])
        .find(
          template=>
            template['Template ID']===id
        )
    : null;
}

function renderTransitionQuestions(){
  const template=
    selectedTransitionTemplate();

  const questions=
    template
      ? template.questions||[]
      : [];

  el('transitionQuestions').innerHTML=
    questions.length
      ? '<label>Вопросы и ответы</label>'+
        questions
          .map(question=>
            '<div class="qa">'+
              '<strong>'+
                escapeHtml(question)+
              '</strong>'+
              '<textarea class="transition-answer" '+
                'data-question="'+
                escapeHtml(question)+
                '" placeholder="Ответ"></textarea>'+
            '</div>'
          )
          .join('')
      : '<div class="muted">'+
        'Для этого этапа шаблон вопросов не выбран.'+
        '</div>';
}

function submitTransition(){
  if(!pendingTransition){
    return;
  }

  const answers=[
    ...document.querySelectorAll(
      '.transition-answer'
    )
  ].map(input=>({
    question:input.dataset.question,
    answer:input.value
  }));

  const payload={
    candidateId:
      pendingTransition.candidate.ID,
    toStatus:
      pendingTransition.toStatus,
    responsibleId:
      value('transitionResponsible'),
    interview:{
      templateId:
        value('transitionTemplate'),
      answers,
      comment:
        value('transitionComment'),
      result:
        value('transitionResult')
    }
  };

  call(
    'transitionCandidate',
    payload,
    ()=>{
      closeTransition();
      showToast('Этап кандидата обновлён.');

      refreshCandidates(()=>{
        openCandidateById(
          payload.candidateId
        );
      });

      refreshInterviews();
    }
  );
}

function setCurrentInterviews(
  candidateId
){
  if(!state.loaded.interviews){
    currentInterviews=[];

    el('interviewHistory')
      .innerHTML=
        '<div class="muted">'+
        'История интервью загружается в фоне…'+
        '</div>';

    return;
  }

  currentInterviews=
    state.interviews.filter(
      interview=>
        String(
          interview['Candidate ID']
        )===
        String(candidateId)
    );

  renderInterviewHistory();
}

function renderInterviewHistory(){
  el('interviewHistory').innerHTML=
    currentInterviews.length
      ? currentInterviews
          .map(interview=>
            '<article class="history-card">'+
              '<div class="history-title">'+
                '<strong>'+
                  escapeHtml(
                    interview['Этап']||
                    'Этап'
                  )+
                  ' → '+
                  escapeHtml(
                    interview['To Status']||
                    ''
                  )+
                '</strong>'+
                '<button class="button button-small" '+
                  'onclick="editInterview(\''+
                  escJs(
                    interview[
                      'Interview ID'
                    ]
                  )+
                  '\')">Редактировать</button>'+
              '</div>'+
              '<div class="muted">'+
                escapeHtml(
                  interview['Дата']||''
                )+
                ' · '+
                escapeHtml(
                  interview['Шаблон']||
                  'Без шаблона'
                )+
              '</div>'+
              (interview.answers||[])
                .map(answer=>
                  '<div class="qa">'+
                    '<strong>'+
                      escapeHtml(
                        answer.question
                      )+
                    '</strong>'+
                    escapeHtml(
                      answer.answer
                    )+
                  '</div>'
                )
                .join('')+
              '<div class="qa">'+
                '<strong>Комментарий</strong>'+
                escapeHtml(
                  interview['Комментарий']||
                  '—'
                )+
              '</div>'+
              '<div class="qa">'+
                '<strong>Результат</strong>'+
                escapeHtml(
                  interview['Результат']||
                  '—'
                )+
              '</div>'+
            '</article>'
          )
          .join('')
      : '<div class="muted">'+
        'Результатов интервью пока нет.'+
        '</div>';
}

function editInterview(id){
  editingInterview=
    currentInterviews.find(
      interview=>
        interview['Interview ID']===id
    );

  if(!editingInterview){
    return;
  }

  el('editInterviewQuestions')
    .innerHTML=
      (editingInterview.answers||[])
        .map(answer=>
          '<div class="qa">'+
            '<strong>'+
              escapeHtml(
                answer.question
              )+
            '</strong>'+
            '<textarea class="edit-answer" '+
              'data-question="'+
              escapeHtml(
                answer.question
              )+
              '">'+
              escapeHtml(
                answer.answer
              )+
            '</textarea>'+
          '</div>'
        )
        .join('');

  el('editInterviewComment').value=
    editingInterview['Комментарий']||'';

  el('editInterviewResult').value=
    editingInterview['Результат']||'';

  el('interviewEditModal')
    .classList
    .add('open');
}

function closeInterviewEdit(){
  el('interviewEditModal')
    .classList
    .remove('open');

  editingInterview=null;
}

function saveInterviewEdit(){
  if(!editingInterview){
    return;
  }

  const payload={
    id:
      editingInterview[
        'Interview ID'
      ],
    answers:[
      ...document.querySelectorAll(
        '.edit-answer'
      )
    ].map(input=>({
      question:
        input.dataset.question,
      answer:
        input.value
    })),
    comment:
      value('editInterviewComment'),
    result:
      value('editInterviewResult')
  };

  call(
    'updateInterview',
    payload,
    ()=>{
      closeInterviewEdit();
      showToast(
        'Результат интервью обновлён.'
      );

      refreshInterviews();
    }
  );
}

init();
</script>
