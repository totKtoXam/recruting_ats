<script>
let state={candidates:[],vacancies:[],sources:[],responsibles:[],interviewTemplates:[],dictionaries:{},transitions:{},pipelineStatuses:[],stats:{}};
let currentCandidate=null;
let pendingTransition=null;
let currentInterviews=[];
let editingInterview=null;
let confirmResolver=null;
const collapsedColumns=new Set();

function el(id){return document.getElementById(id)}
function value(id){return el(id).value}
function setLoading(v){el('loading').classList.toggle('active',!!v)}
function escapeHtml(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;")}
function escJs(v){return String(v??'').replaceAll('\\','\\\\').replaceAll("'","\\'")}
function option(value,label,selected){return '<option value="'+escapeHtml(value)+'"'+(selected?' selected':'')+'>'+escapeHtml(label)+'</option>'}
function showToast(message,type='info'){
  const toast=el('toast');
  toast.textContent=message;
  toast.className='toast active '+(type==='error'?'toast-error':'toast-success');
  clearTimeout(showToast.timer);
  showToast.timer=setTimeout(()=>{toast.className='toast'},3500);
}
function handleError(error){
  setLoading(false);
  showToast(error&&error.message?error.message:String(error),'error');
}
function showConfirm(message,title='Подтверждение'){
  el('confirmTitle').textContent=title;
  el('confirmMessage').textContent=message;
  el('confirmModal').classList.add('open');
  return new Promise(resolve=>{confirmResolver=resolve});
}
function closeConfirm(result){
  el('confirmModal').classList.remove('open');
  if(confirmResolver){
    confirmResolver(result);
    confirmResolver=null;
  }
}
function call(name,args,onSuccess){
  setLoading(true);
  const runner=google.script.run.withFailureHandler(handleError).withSuccessHandler(result=>{setLoading(false);if(onSuccess)onSuccess(result)});
  if(args===undefined)runner[name]();else runner[name](args);
}

function init(){
  call('getInitialData',undefined,data=>{
    state=data;
    populateGlobalFilters();
    render();
  });
}

function refresh(after){
  call('getInitialData',undefined,data=>{
    state=data;
    populateGlobalFilters();
    render();
    if(after)after();
  });
}

function getStatuses(){return state.pipelineStatuses||[]}
function activeVacancies(){return state.vacancies.filter(v=>v['Статус']==='Открыта')}
function responsiblesFor(stage){return state.responsibles.filter(r=>(r.stages||[]).includes(stage))}

function populateGlobalFilters(){
  const old={v:value('filterVacancy'),r:value('filterResponsible'),s:value('filterSource')};
  el('filterVacancy').innerHTML=option('','Все вакансии')+state.vacancies.map(v=>option(v['Vacancy ID'],v['Вакансия'],v['Vacancy ID']===old.v)).join('');
  el('filterResponsible').innerHTML=option('','Все ответственные')+state.responsibles.map(r=>option(r['Responsible ID'],r['ФИО'],r['Responsible ID']===old.r)).join('');
  el('filterSource').innerHTML=option('','Все источники')+state.sources.map(s=>option(s['Source ID'],s['Название'],s['Source ID']===old.s)).join('');
}

function render(){
  renderStats();
  renderBoard();
}

function renderStats(){
  const s=state.stats||{};
  el('stats').innerHTML='<div class="stat"><span>Активные</span><b>'+(s.total||0)+'</b></div><div class="stat"><span>Архив</span><b>'+(s.archived||0)+'</b></div>'+
    Object.entries(s.byStatus||{}).map(([k,v])=>'<div class="stat"><span>'+escapeHtml(k)+'</span><b>'+v+'</b></div>').join('');
}

function filteredCandidates(){
  const q=value('filterSearch').trim().toLowerCase();
  const vacancy=value('filterVacancy'),responsible=value('filterResponsible'),source=value('filterSource'),archived=el('filterArchived').checked;
  return state.candidates.filter(c=>{
    if(archived!==!!c.archived)return false;
    if(vacancy&&c['Vacancy ID']!==vacancy)return false;
    if(responsible&&c['Responsible ID']!==responsible)return false;
    if(source&&c['Source ID']!==source)return false;
    if(q){
      const h=[c['ФИО'],c['Телефон'],c['Email'],c['Telegram'],c['Вакансия'],c['Ответственный']].filter(Boolean).join(' ').toLowerCase();
      if(!h.includes(q))return false;
    }
    return true;
  });
}

function renderBoard(){
  const archived=el('filterArchived').checked;
  const statuses=archived?['Отказ']:getStatuses();
  const candidates=filteredCandidates();
  el('board').innerHTML=statuses.map(status=>{
    const list=candidates.filter(c=>c['Статус']===status);
    const collapsed=collapsedColumns.has(status);
    return '<section class="column '+(collapsed?'collapsed':'')+'" data-status="'+escapeHtml(status)+'" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropCandidate(event)">'+
      '<div class="column-title"><span>'+escapeHtml(status)+' ('+list.length+')</span><button class="icon-button" onclick="event.stopPropagation();toggleColumn(\''+escJs(status)+'\')">'+(collapsed?'›':'‹')+'</button></div>'+
      '<div class="cards">'+list.map(renderCard).join('')+'</div></section>';
  }).join('');
}

function renderCard(c){
  return '<article class="candidate-card" draggable="'+(!c.archived)+'" data-id="'+escapeHtml(c.ID)+'" ondragstart="dragStart(event)" ondragend="dragEnd(event)" onclick="openCandidateById(\''+escJs(c.ID)+'\')">'+
    '<div class="candidate-name">'+escapeHtml(c['ФИО'])+'</div>'+
    '<div class="candidate-meta">'+escapeHtml(c['Телефон']||'')+'</div>'+
    '<div class="candidate-meta">'+escapeHtml(c['Вакансия']||'')+'</div>'+
    '<div class="candidate-meta">'+escapeHtml(c['Ответственный']||'')+'</div>'+
    (c['Резюме']?'<div class="card-actions"><a href="'+escapeHtml(c['Резюме'])+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">Резюме</a></div>':'')+
    (!c.archived?'<div class="card-actions"><button class="button button-small button-danger" onclick="event.stopPropagation();archiveById(\''+escJs(c.ID)+'\')">Архив</button></div>':'')+
    '</article>';
}

function toggleColumn(status){collapsedColumns.has(status)?collapsedColumns.delete(status):collapsedColumns.add(status);renderBoard()}
function dragStart(e){e.dataTransfer.setData('text/plain',e.currentTarget.dataset.id);e.currentTarget.classList.add('dragging')}
function dragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.column').forEach(x=>x.classList.remove('drag-over'))}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over')}
function dragLeave(e){e.currentTarget.classList.remove('drag-over')}
function dropCandidate(e){e.preventDefault();e.currentTarget.classList.remove('drag-over');const id=e.dataTransfer.getData('text/plain');const status=e.currentTarget.dataset.status;startTransition(id,status)}

function openCandidateById(id){openCandidate(state.candidates.find(c=>String(c.ID)===String(id)))}
function openCandidate(candidate){
  currentCandidate=candidate||null;
  const isNew=!candidate;
  el('candidateId').value=candidate?candidate.ID:'';
  el('candidateName').value=candidate?candidate['ФИО']||'':'';
  el('candidatePhone').value=candidate?candidate['Телефон']||'':'';
  el('candidateEmail').value=candidate?candidate['Email']||'':'';
  el('candidateTelegram').value=candidate?candidate['Telegram']||'':'';
  el('candidateSalary').value=candidate?formatMoney(candidate['Зарплатные ожидания']):'';
  el('candidateComment').value=candidate?candidate['Комментарий']||'':'';
  el('candidateTitle').textContent=isNew?'Новый кандидат':candidate['ФИО'];
  el('candidateStatusLabel').textContent=isNew?'Новый':candidate['Статус'];
  el('candidateVacancy').innerHTML=option('','Выберите вакансию')+(isNew?activeVacancies():state.vacancies).map(v=>option(v['Vacancy ID'],v['Вакансия'],candidate&&v['Vacancy ID']===candidate['Vacancy ID'])).join('');
  el('candidateSource').innerHTML=option('','Не указан')+state.sources.map(s=>option(s['Source ID'],s['Название'],candidate&&s['Source ID']===candidate['Source ID'])).join('');
  const stage=isNew?'Новый':candidate['Статус'];
  el('candidateResponsible').innerHTML=option('','Выберите ответственного')+responsiblesFor(stage).map(r=>option(r['Responsible ID'],r['ФИО'],candidate&&r['Responsible ID']===candidate['Responsible ID'])).join('');
  el('candidateResumeFile').value='';
  setLink('candidateResumeLink',candidate&&candidate['Резюме'],'Открыть резюме');
  setLink('candidateFolderLink',candidate&&candidate['Папка кандидата'],'Открыть папку кандидата');
  renderCandidateLinks(candidate?candidate.links||[]:[]);
  renderTelegramPreview();
  el('archiveCandidateButton').style.display=candidate&&!candidate.archived?'inline-block':'none';
  el('historyTabButton').style.display=candidate?'inline-block':'none';
  renderTransitions();
  el('candidateModal').classList.add('open');
  showCandidateTab('candidateDetails',el('candidateDetails').previousElementSibling?document.querySelector('#candidateModal .tab'):null);
  if(candidate)loadInterviewHistory(candidate.ID);else el('interviewHistory').innerHTML='';
}
function closeCandidate(){el('candidateModal').classList.remove('open');currentCandidate=null}
function setLink(id,url,label){const a=el(id);a.href=url||'';a.textContent=url?label:''}
function showCandidateTab(id,button){document.querySelectorAll('#candidateModal .tab-section').forEach(x=>x.classList.remove('active'));document.querySelectorAll('#candidateModal .tab').forEach(x=>x.classList.remove('active'));el(id).classList.add('active');if(button)button.classList.add('active')}

function renderTransitions(){
  const root=el('candidateTransitions');
  if(!currentCandidate||currentCandidate.archived){root.innerHTML='';return}
  const allowed=state.transitions[currentCandidate['Статус']]||[];
  root.innerHTML=allowed.map(status=>'<button class="button transition-button" onclick="startTransition(\''+escJs(currentCandidate.ID)+'\',\''+escJs(status)+'\')">→ '+escapeHtml(status)+'</button>').join('');
}
function renderCandidateLinks(links){el('candidateLinks').innerHTML=(links||[]).map(l=>linkRow(l.name,l.url)).join('')}
function linkRow(name='',url=''){return '<div class="link-item"><input class="other-link-name" placeholder="Название" value="'+escapeHtml(name)+'"><input class="other-link-url" placeholder="https://..." value="'+escapeHtml(url)+'"><button class="button button-small button-danger" type="button" onclick="this.parentElement.remove()">×</button></div>'}
function addCandidateLink(){el('candidateLinks').insertAdjacentHTML('beforeend',linkRow())}
function collectLinks(){return [...document.querySelectorAll('#candidateLinks .link-item')].map(row=>({name:row.querySelector('.other-link-name').value,url:row.querySelector('.other-link-url').value}))}

function renderTelegramPreview(){
  const raw=value('candidateTelegram').trim(),a=el('telegramPreview');
  if(!raw){a.textContent='';a.removeAttribute('href');return}
  let url=raw;
  if(!/^https?:\/\//i.test(raw)){const u=raw.replace(/^@/,'').replace(/^t\.me\//i,'');url='https://t.me/'+u}
  a.href=url;a.textContent=url;
}
function formatMoney(v){const n=String(v||'').replace(/\D/g,'');return n?n.replace(/\B(?=(\d{3})+(?!\d))/g,' '):''}
function formatMoneyInput(input){input.value=formatMoney(input.value)}

function readResumeFile(){
  return new Promise((resolve,reject)=>{
    const file=el('candidateResumeFile').files[0];
    if(!file){resolve(null);return}
    if(file.size>10*1024*1024){reject(new Error('Резюме не должно превышать 10 МБ.'));return}
    const reader=new FileReader();
    reader.onload=()=>resolve({name:file.name,mimeType:file.type,base64:String(reader.result).split(',')[1]});
    reader.onerror=()=>reject(new Error('Не удалось прочитать файл.'));
    reader.readAsDataURL(file);
  });
}

async function saveCandidateForm(){
  try{
    const resumeFile=await readResumeFile();
    const payload={
      ID:value('candidateId'),
      fullName:value('candidateName'),
      vacancyId:value('candidateVacancy'),
      phone:value('candidatePhone'),
      email:value('candidateEmail'),
      telegram:value('candidateTelegram'),
      salary:value('candidateSalary'),
      sourceId:value('candidateSource'),
      responsibleId:value('candidateResponsible'),
      comment:value('candidateComment'),
      links:collectLinks(),
      resumeFile
    };
    call('saveCandidate',payload,response=>refresh(()=>openCandidateById(response.candidate.ID)));
  }catch(e){handleError(e)}
}

function archiveCurrentCandidate(){if(currentCandidate)archiveById(currentCandidate.ID)}
async function archiveById(id){
  const ok=await showConfirm(
    'Архивировать кандидата? Статус станет "Отказ", причина — "Архивация".',
    'Архивация кандидата'
  );
  if(!ok)return;
  call('archiveCandidate',id,()=>{
    showToast('Кандидат архивирован.');
    refresh(()=>{
      if(el('candidateModal').classList.contains('open'))closeCandidate();
    });
  });
}

function startTransition(id,toStatus){
  const candidate=state.candidates.find(c=>String(c.ID)===String(id));
  if(!candidate||candidate.archived||candidate['Статус']===toStatus)return;
  const allowed=state.transitions[candidate['Статус']]||[];
  if(!allowed.includes(toStatus)){
    showToast('Переход '+candidate['Статус']+' → '+toStatus+' не разрешён.','error');
    return;
  }
  call('getInterviewContext',{candidateId:id,toStatus},ctx=>{
    pendingTransition=ctx;
    el('transitionTitle').textContent=ctx.fromStatus+' → '+ctx.toStatus;
    el('transitionTemplate').innerHTML=option('','Без шаблона')+(ctx.templates||[]).map((t,i)=>option(t['Template ID'],t['Название'],i===0)).join('');
    const nextResponsibles=responsiblesFor(ctx.toStatus);
    el('transitionResponsible').innerHTML=option('','Выберите ответственного')+nextResponsibles.map(r=>option(r['Responsible ID'],r['ФИО'],r['Responsible ID']===candidate['Responsible ID'])).join('');
    el('transitionComment').value='';el('transitionResult').value='';
    renderTransitionQuestions();
    el('transitionModal').classList.add('open');
  });
}
function closeTransition(){el('transitionModal').classList.remove('open');pendingTransition=null}
function selectedTransitionTemplate(){const id=value('transitionTemplate');return pendingTransition?(pendingTransition.templates||[]).find(t=>t['Template ID']===id):null}
function renderTransitionQuestions(){
  const t=selectedTransitionTemplate(),questions=t?(t.questions||[]):[];
  el('transitionQuestions').innerHTML=questions.length?'<label>Вопросы и ответы</label>'+questions.map((q,i)=>'<div class="qa"><strong>'+escapeHtml(q)+'</strong><textarea class="transition-answer" data-question="'+escapeHtml(q)+'" placeholder="Ответ"></textarea></div>').join(''):'<div class="muted">Для этого этапа шаблон вопросов не выбран.</div>';
}
function submitTransition(){
  if(!pendingTransition)return;
  const answers=[...document.querySelectorAll('.transition-answer')].map(x=>({question:x.dataset.question,answer:x.value}));
  const payload={candidateId:pendingTransition.candidate.ID,toStatus:pendingTransition.toStatus,responsibleId:value('transitionResponsible'),interview:{templateId:value('transitionTemplate'),answers,comment:value('transitionComment'),result:value('transitionResult')}};
  call('transitionCandidate',payload,()=>{closeTransition();refresh(()=>{if(el('candidateModal').classList.contains('open'))openCandidateById(payload.candidateId)})});
}

function loadInterviewHistory(candidateId){
  call('getInterviews',candidateId,items=>{currentInterviews=items;renderInterviewHistory()});
}
function renderInterviewHistory(){
  el('interviewHistory').innerHTML=currentInterviews.length?currentInterviews.map(i=>'<article class="history-card"><div class="history-title"><strong>'+escapeHtml(i['Этап']||'Этап')+' → '+escapeHtml(i['To Status']||'')+'</strong><button class="button button-small" onclick="editInterview(\''+escJs(i['Interview ID'])+'\')">Редактировать</button></div><div class="muted">'+escapeHtml(i['Дата']||'')+' · '+escapeHtml(i['Шаблон']||'Без шаблона')+'</div>'+(i.answers||[]).map(a=>'<div class="qa"><strong>'+escapeHtml(a.question)+'</strong>'+escapeHtml(a.answer)+'</div>').join('')+'<div class="qa"><strong>Комментарий</strong>'+escapeHtml(i['Комментарий']||'—')+'</div><div class="qa"><strong>Результат</strong>'+escapeHtml(i['Результат']||'—')+'</div></article>').join(''):'<div class="muted">Результатов интервью пока нет.</div>';
}
function editInterview(id){
  editingInterview=currentInterviews.find(i=>i['Interview ID']===id);
  if(!editingInterview)return;
  el('editInterviewQuestions').innerHTML=(editingInterview.answers||[]).map(a=>'<div class="qa"><strong>'+escapeHtml(a.question)+'</strong><textarea class="edit-answer" data-question="'+escapeHtml(a.question)+'">'+escapeHtml(a.answer)+'</textarea></div>').join('');
  el('editInterviewComment').value=editingInterview['Комментарий']||'';
  el('editInterviewResult').value=editingInterview['Результат']||'';
  el('interviewEditModal').classList.add('open');
}
function closeInterviewEdit(){el('interviewEditModal').classList.remove('open');editingInterview=null}
function saveInterviewEdit(){
  if(!editingInterview)return;
  const payload={id:editingInterview['Interview ID'],answers:[...document.querySelectorAll('.edit-answer')].map(x=>({question:x.dataset.question,answer:x.value})),comment:value('editInterviewComment'),result:value('editInterviewResult')};
  call('updateInterview',payload,()=>{closeInterviewEdit();loadInterviewHistory(currentCandidate.ID)});
}

init();
</script>
