# Подключается внутри существующего server { ... } для portal.devexpert.kz (listen 443 ssl):
#     include snippets/recruiting-ats.conf;

location = /recruiting {
    return 301 /recruiting/;
}

# Префикс не отрезается: приложение само работает под /recruiting (PUBLIC_URL).
location /recruiting/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Если TLS терминируется до nginx (другой прокси), замените $scheme на https:
    # иначе secure-cookie сессии не выставится и вход будет зацикливаться.
    proxy_set_header X-Forwarded-Proto $scheme;

    # Резюме передаются в base64 внутри JSON (до 20 МБ).
    client_max_body_size 25m;
    proxy_read_timeout 120s;
}
