# Render Blueprint: https://render.com/docs/blueprint-spec
# Render → New → Blueprint → выбрать этот репозиторий.
# Значения с sync: false Render запросит при создании сервиса (секреты не хранятся в git).
services:
  - type: web
    name: recruiting-ats
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --omit=dev --no-audit --no-fund
    startCommand: node server/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: APP_TIMEZONE
        value: Asia/Almaty
      # Render завершает HTTPS на своём прокси — нужно для secure-cookie сессии.
      - key: TRUST_PROXY
        value: "true"
      - key: AUTH_MODE
        value: google
      - key: SESSION_SECRET
        generateValue: true
      - key: ATS_API_KEY
        generateValue: true
      - key: GOOGLE_DRIVE_AUTH
        value: oauth

      # https://<имя-сервиса>.onrender.com — видно в дашборде после создания сервиса.
      - key: PUBLIC_URL
        sync: false
      # PostgreSQL на Neon (бесплатная база Render удаляется через 30 дней):
      # postgres://user:password@ep-xxx.eu-central-1.aws.neon.tech/ats?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: AUTH_ALLOWED_DOMAINS
        sync: false
      - key: AUTH_ALLOWED_EMAILS
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: GOOGLE_DRIVE_REFRESH_TOKEN
        sync: false
